            // =========================================================================
            function syncChargeMarkers() {
                const activeIds = new Set(state.charges.map(c => c.id));

                // Remove stale charge meshes
                for (const [id, entry] of chargeMeshes.entries()) {
                    if (!activeIds.has(id)) {
                        scene.remove(entry.core);
                        scene.remove(entry.ring);
                        scene.remove(entry.badge);
                        if (entry.badge.material.map) {
                            entry.badge.material.map.dispose();
                        }
                        entry.badge.material.dispose();
                        chargeMeshes.delete(id);
                    }
                }

                // Add or update active charge meshes
                state.charges.forEach((ch) => {
                    const isPos = ch.q >= 0;
                    let entry = chargeMeshes.get(ch.id);
                    if (!entry) {
                        const core = new THREE.Mesh(coreGeo, isPos ? posMat : negMat);
                        core.userData.chargeId = ch.id;

                        const ring = new THREE.Mesh(capRingGeo, isPos ? posRingMat : negRingMat);
                        ring.userData.chargeId = ch.id;
                        ring.renderOrder = 2;

                        const badge = createSignSprite(isPos);
                        badge.userData.chargeId = ch.id;

                        scene.add(core);
                        scene.add(ring);
                        scene.add(badge);
                        entry = { core, ring, badge, isPos };
                        chargeMeshes.set(ch.id, entry);
                    } else {
                        entry.core.material = isPos ? posMat : negMat;
                        if (entry.isPos !== isPos) {
                            scene.remove(entry.badge);
                            if (entry.badge.material.map) {
                                entry.badge.material.map.dispose();
                            }
                            entry.badge.material.dispose();
                            const newBadge = createSignSprite(isPos);
                            newBadge.userData.chargeId = ch.id;
                            scene.add(newBadge);
                            entry.badge = newBadge;
                            entry.isPos = isPos;
                        }
                        entry.ring.material = isPos ? posRingMat : negRingMat;
                    }
                });
            }

            // =========================================================================
            // 5. TOP VIEW & SIDE VIEW CAMERA + FREE MOUSE NAVIGATION + CHARGE DRAGGING
            // =========================================================================
            function applyCameraSpherical() {
                cameraRig.phi = Math.max(
                    cameraRig.minPhi,
                    Math.min(cameraRig.maxPhi, cameraRig.phi)
                );
                cameraRig.radius = Math.max(
                    cameraRig.minRadius,
                    Math.min(cameraRig.maxRadius, cameraRig.radius)
                );

                const sinPhi = Math.sin(cameraRig.phi);
                const x = cameraRig.target.x + cameraRig.radius * sinPhi * Math.sin(cameraRig.theta);
                const y = cameraRig.target.y + cameraRig.radius * Math.cos(cameraRig.phi);
                const z = cameraRig.target.z + cameraRig.radius * sinPhi * Math.cos(cameraRig.theta);

                camera.position.set(x, y, z);
                camera.lookAt(cameraRig.target);
                syncViewButtons();
            }

            // Camera distance that keeps the same width of sheet in frame on wide screens, tall phones and tablets
            function viewRadius() {
                const aspect = camera && camera.aspect ? camera.aspect : 1.6;
                const halfWidth = 12;                       // world units we always want visible sideways
                const need = halfWidth / (Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * aspect);
                return Math.max(24, Math.min(cameraRig.maxRadius, need));
            }

            const VIEW_PRESETS = {
                top:  { theta: 0, phi: 0.001 },
                side: { theta: 0, phi: Math.PI / 2 - 0.06 }
            };
            let camTween = null;
            let lastFitAspect = 0;

            function cancelCameraTween() { camTween = null; }

            // Highlight a button only while the camera really sits in that view (orbiting away clears both)
            function syncViewButtons() {
                const topBtn = document.getElementById('top-view-btn');
                const sideBtn = document.getElementById('side-view-btn');
                if (!topBtn || !sideBtn) return;
                const wrap = (a) => Math.abs(Math.atan2(Math.sin(a), Math.cos(a)));
                const near = (p) => Math.abs(cameraRig.phi - p.phi) < 0.03 && (p === VIEW_PRESETS.top || wrap(cameraRig.theta - p.theta) < 0.04)
                    && cameraRig.target.lengthSq() < 0.25;
                const isTop = near(VIEW_PRESETS.top), isSide = !isTop && near(VIEW_PRESETS.side);
                topBtn.setAttribute('aria-pressed', String(isTop));
                sideBtn.setAttribute('aria-pressed', String(isSide));
            }

            function setCameraView(mode, animated) {
                state.viewMode = mode;
                const p = VIEW_PRESETS[mode] || VIEW_PRESETS.top;
                const to = { theta: p.theta, phi: p.phi, radius: viewRadius(), tx: 0, ty: 0, tz: 0 };
                lastFitAspect = camera.aspect;

                if (!animated || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                    camTween = null;
                    cameraRig.target.set(0, 0, 0);
                    cameraRig.theta = to.theta; cameraRig.phi = to.phi; cameraRig.radius = to.radius;
                    applyCameraSpherical();
                    return;
                }
                // shortest way round for theta
                let dTheta = to.theta - cameraRig.theta;
                dTheta = Math.atan2(Math.sin(dTheta), Math.cos(dTheta));
                camTween = {
                    t: 0, dur: 0.55,
                    from: { theta: cameraRig.theta, phi: cameraRig.phi, radius: cameraRig.radius, tx: cameraRig.target.x, ty: cameraRig.target.y, tz: cameraRig.target.z },
                    dTheta, to
                };
            }

            // advanced from the render loop
            function stepCameraTween(dt) {
                if (!camTween) return;
                const tw = camTween;
                tw.t = Math.min(1, tw.t + dt / tw.dur);
                const k = tw.t < 0.5 ? 4 * tw.t ** 3 : 1 - Math.pow(-2 * tw.t + 2, 3) / 2; // easeInOutCubic
                cameraRig.theta = tw.from.theta + tw.dTheta * k;
                cameraRig.phi = tw.from.phi + (tw.to.phi - tw.from.phi) * k;
                cameraRig.radius = tw.from.radius + (tw.to.radius - tw.from.radius) * k;
                cameraRig.target.set(tw.from.tx * (1 - k), tw.from.ty * (1 - k), tw.from.tz * (1 - k));
                applyCameraSpherical();
                if (tw.t >= 1) camTween = null;
            }

            function orbitCamera(deltaX, deltaY) {
                cancelCameraTween();
                const rotateSpeed = 0.0055;
                cameraRig.theta -= deltaX * rotateSpeed;
                cameraRig.phi -= deltaY * rotateSpeed;
                applyCameraSpherical();
            }

            function panCamera(deltaX, deltaY) {
                cancelCameraTween();
                const panSpeed = 0.0015 * cameraRig.radius;
                const forward = new THREE.Vector3();
                camera.getWorldDirection(forward);

                const right = new THREE.Vector3().crossVectors(forward, camera.up).normalize();
                const up = new THREE.Vector3().crossVectors(right, forward).normalize();

                cameraRig.target.addScaledVector(right, -deltaX * panSpeed);
                cameraRig.target.addScaledVector(up, deltaY * panSpeed);
                applyCameraSpherical();
            }

            function setNDCFromClient(clientX, clientY) {
                const rect = renderer.domElement.getBoundingClientRect();
                pointerState.ndc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
                pointerState.ndc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
            }

            function pickChargeAtNDC(ndcX, ndcY) {
                raycaster.setFromCamera(new THREE.Vector2(ndcX, ndcY), camera);
                const pickTargets = [];
                for (const entry of chargeMeshes.values()) {
                    pickTargets.push(entry.core, entry.ring, entry.badge);
                }
                const hits = raycaster.intersectObjects(pickTargets, false);
                if (hits.length > 0) {
                    return { type: 'charge', id: hits[0].object.userData.chargeId };
                }

                if (testChargeGroup && testChargeGroup.visible) {
                    const testHits = raycaster.intersectObjects(testChargeGroup.children, false);
                    if (testHits.length > 0) {
                        return { type: 'test' };
                    }
                }
                return null;
            }

            function moveDraggedCharge() {
                if (pointerState.mode === 'drag-charge' && pointerState.draggedChargeId !== null) {
                    raycaster.setFromCamera(pointerState.ndc, camera);
                    if (raycaster.ray.intersectPlane(dragPlane, intersectPoint)) {
                        const ch = state.charges.find(c => c.id === pointerState.draggedChargeId);
                        if (ch) {
                            ch.x = Math.max(-14, Math.min(14, intersectPoint.x));
                            ch.y = Math.max(-14, Math.min(14, intersectPoint.z));
                            recomputeSurface();
                        }
                    }
                } else if (pointerState.mode === 'drag-test-charge' && state.testCharge.active) {
                    raycaster.setFromCamera(pointerState.ndc, camera);
                    if (raycaster.ray.intersectPlane(dragPlane, intersectPoint)) {
                        state.testCharge.x = Math.max(-14, Math.min(14, intersectPoint.x));
                        state.testCharge.y = Math.max(-14, Math.min(14, intersectPoint.z));
                        state.testCharge.vx = 0;
                        state.testCharge.vz = 0;
                        syncTestChargeMarker();
                    }
                }
            }

            // Spawn the currently selected tool (+ charge, - charge, or +1 test charge) on the surface
            function pickSurfaceSpawnPoint(ndcX, ndcY) {
                raycaster.setFromCamera(new THREE.Vector2(ndcX, ndcY), camera);
                if (surfaceMesh) {
                    const hits = raycaster.intersectObject(surfaceMesh, false);
                    if (hits.length > 0) {
                        return {
                            x: Math.max(-14, Math.min(14, hits[0].point.x)),
                            z: Math.max(-14, Math.min(14, hits[0].point.z))
                        };
                    }
                }
                const fallbackPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
                if (raycaster.ray.intersectPlane(fallbackPlane, intersectPoint)) {
                    return {
                        x: Math.max(-14, Math.min(14, intersectPoint.x)),
                        z: Math.max(-14, Math.min(14, intersectPoint.z))
                    };
                }
                return null;
            }

            function spawnSelectedToolAt(x, z) {
                if (state.placementMode === 'pos' || state.placementMode === 'neg') {
                    if (state.charges.length >= MAX_CHARGES) { showToast('That is the maximum: ' + MAX_CHARGES + ' charges.'); return; }
                    const sign = state.placementMode === 'pos' ? 1 : -1;
                    const id = state.nextId++;
                    state.charges.push({ id, x, y: z, q: sign * 1.8 });
                    state.selectedId = id;
                    syncChargeMarkers();
                    syncMagnitudeControls();
                    recomputeSurface();
                } else if (state.placementMode === 'test') {
                    state.testCharge.active = true;
                    state.testCharge.x = x;
                    state.testCharge.y = z;
                    state.testCharge.vx = 0.0;
                    state.testCharge.vz = 0.0;
                    syncTestChargeMarker();
                }
            }

            function attachEvents() {
                const domElem = renderer.domElement;

                domElem.addEventListener('contextmenu', (e) => e.preventDefault());

                domElem.addEventListener('mousedown', (e) => {
                    pointerState.lastX = e.clientX;
                    pointerState.lastY = e.clientY;
                    setNDCFromClient(e.clientX, e.clientY);

                    if (e.button === 0) {
                        const hit = filmActive ? null : pickChargeAtNDC(pointerState.ndc.x, pointerState.ndc.y);
                        if (hit && hit.type === 'charge') {
                            state.selectedId = hit.id;
                            syncMagnitudeControls();
                            pointerState.mode = 'drag-charge';
                            pointerState.draggedChargeId = hit.id;
                            const ch = state.charges.find(c => c.id === hit.id);
                            const { height } = evaluatePotential(ch.x, ch.y);
                            dragPlane.setFromNormalAndCoplanarPoint(
                                new THREE.Vector3(0, 1, 0),
                                new THREE.Vector3(0, height, 0)
                            );
                            domElem.style.cursor = 'grabbing';
                        } else if (hit && hit.type === 'test') {
                            pointerState.mode = 'drag-test-charge';
                            pointerState.draggedChargeId = null;
                            state.testCharge.vx = 0;
                            state.testCharge.vz = 0;
                            const { height } = evaluatePotential(state.testCharge.x, state.testCharge.y);
                            dragPlane.setFromNormalAndCoplanarPoint(
                                new THREE.Vector3(0, 1, 0),
                                new THREE.Vector3(0, height, 0)
                            );
                            domElem.style.cursor = 'grabbing';
                        } else if (state.placementMode !== 'none') {
                            const spawnPt = pickSurfaceSpawnPoint(pointerState.ndc.x, pointerState.ndc.y);
                            if (spawnPt) {
                                spawnSelectedToolAt(spawnPt.x, spawnPt.z);
                            }
                            pointerState.mode = 'none';
                            domElem.style.cursor = 'crosshair';
                        } else {
                            pointerState.mode = 'orbit';
                            domElem.style.cursor = 'move';
                        }
                    } else if (e.button === 2 || e.button === 1) {
                        pointerState.mode = 'pan';
                        domElem.style.cursor = 'all-scroll';
                    }
                });

                window.addEventListener('mousemove', (e) => {
                    const dx = e.clientX - pointerState.lastX;
                    const dy = e.clientY - pointerState.lastY;
                    pointerState.lastX = e.clientX;
                    pointerState.lastY = e.clientY;
                    setNDCFromClient(e.clientX, e.clientY);

                    if (pointerState.mode === 'drag-charge' || pointerState.mode === 'drag-test-charge') {
                        moveDraggedCharge();
                    } else if (pointerState.mode === 'orbit') {
                        orbitCamera(dx, dy);
                    } else if (pointerState.mode === 'pan') {
                        panCamera(dx, dy);
                    } else {
                        const hoverHit = pickChargeAtNDC(pointerState.ndc.x, pointerState.ndc.y);
                        if (hoverHit) {
                            domElem.style.cursor = 'grab';
                        } else if (state.placementMode !== 'none') {
                            domElem.style.cursor = 'crosshair';
                        } else {
                            domElem.style.cursor = 'grab';
                        }
                    }
                });

                window.addEventListener('mouseup', () => {
                    pointerState.mode = 'none';
                    pointerState.draggedChargeId = null;
                    domElem.style.cursor = state.placementMode !== 'none' ? 'crosshair' : 'default';
                });

                domElem.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    cancelCameraTween();
                    const zoomFactor = 1 + e.deltaY * 0.0012;
                    cameraRig.radius *= zoomFactor;
                    applyCameraSpherical();
                }, { passive: false });

                domElem.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 1) {
                        const t = e.touches[0];
                        pointerState.lastX = t.clientX;
                        pointerState.lastY = t.clientY;
                        pointerState.pinchDist = null;
                        setNDCFromClient(t.clientX, t.clientY);
                        const hit = filmActive ? null : pickChargeAtNDC(pointerState.ndc.x, pointerState.ndc.y);
                        if (hit && hit.type === 'charge') {
                            state.selectedId = hit.id;
                            syncMagnitudeControls();
                            pointerState.mode = 'drag-charge';
                            pointerState.draggedChargeId = hit.id;
                            const ch = state.charges.find(c => c.id === hit.id);
                            const { height } = evaluatePotential(ch.x, ch.y);
                            dragPlane.setFromNormalAndCoplanarPoint(
                                new THREE.Vector3(0, 1, 0),
                                new THREE.Vector3(0, height, 0)
                            );
                        } else if (hit && hit.type === 'test') {
                            pointerState.mode = 'drag-test-charge';
                            pointerState.draggedChargeId = null;
                            state.testCharge.vx = 0;
                            state.testCharge.vz = 0;
                            const { height } = evaluatePotential(state.testCharge.x, state.testCharge.y);
                            dragPlane.setFromNormalAndCoplanarPoint(
                                new THREE.Vector3(0, 1, 0),
                                new THREE.Vector3(0, height, 0)
                            );
                        } else if (state.placementMode !== 'none') {
                            const spawnPt = pickSurfaceSpawnPoint(pointerState.ndc.x, pointerState.ndc.y);
                            if (spawnPt) {
                                spawnSelectedToolAt(spawnPt.x, spawnPt.z);
                            }
                            pointerState.mode = 'none';
                        } else {
                            pointerState.mode = 'orbit';
                        }
                    } else if (e.touches.length === 2) {
                        const dx = e.touches[0].clientX - e.touches[1].clientX;
                        const dy = e.touches[0].clientY - e.touches[1].clientY;
                        pointerState.pinchDist = Math.hypot(dx, dy);
                        pointerState.lastX = (e.touches[0].clientX + e.touches[1].clientX) * 0.5;
                        pointerState.lastY = (e.touches[0].clientY + e.touches[1].clientY) * 0.5;
                        pointerState.mode = 'pan';
                    }
                }, { passive: true });

                domElem.addEventListener('touchmove', (e) => {
                    if (e.touches.length === 1) {
                        const t = e.touches[0];
                        const dx = t.clientX - pointerState.lastX;
                        const dy = t.clientY - pointerState.lastY;
                        pointerState.lastX = t.clientX;
                        pointerState.lastY = t.clientY;
                        setNDCFromClient(t.clientX, t.clientY);

                        if (pointerState.mode === 'drag-charge' || pointerState.mode === 'drag-test-charge') {
                            moveDraggedCharge();
                        } else if (pointerState.mode === 'orbit') {
                            orbitCamera(dx, dy);
                        }
                    } else if (e.touches.length === 2) {
                        const dxPinch = e.touches[0].clientX - e.touches[1].clientX;
                        const dyPinch = e.touches[0].clientY - e.touches[1].clientY;
                        const dist = Math.hypot(dxPinch, dyPinch);

                        const midX = (e.touches[0].clientX + e.touches[1].clientX) * 0.5;
                        const midY = (e.touches[0].clientY + e.touches[1].clientY) * 0.5;
                        const panDx = midX - pointerState.lastX;
                        const panDy = midY - pointerState.lastY;
                        pointerState.lastX = midX;
                        pointerState.lastY = midY;

                        if (pointerState.pinchDist && dist > 0) {
                            cameraRig.radius *= pointerState.pinchDist / dist;
                        }
                        pointerState.pinchDist = dist;
                        panCamera(panDx, panDy);
                    }
                }, { passive: true });

                domElem.addEventListener('touchend', (e) => {
                    if (e.touches.length === 0) {
                        pointerState.mode = 'none';
                        pointerState.draggedChargeId = null;
                        pointerState.pinchDist = null;
                    }
                });

                window.addEventListener('resize', () => {
                    if (!renderer || !camera) return;
                    const w = container.clientWidth || window.innerWidth;
                    const h = container.clientHeight || window.innerHeight;
                    camera.aspect = w / h;
                    camera.updateProjectionMatrix();
                    renderer.setSize(w, h);
                    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
                    // rotating the phone / resizing the window: re-frame the sheet, but ignore tiny toolbar-height jitters
                    if (!filmActive && Math.abs(camera.aspect - lastFitAspect) > 0.2) {
                        lastFitAspect = camera.aspect;
                        cameraRig.radius = viewRadius();
                        applyCameraSpherical();
                    }
                });
            }

            // =========================================================================
            // 6. BUTTON ACTIONS (+ CHARGE / - CHARGE / TOP VIEW / SIDE VIEW)
            // =========================================================================
            function syncPlacementButtons() {
                const posBtn = document.getElementById('add-pos-btn');
                const negBtn = document.getElementById('add-neg-btn');
                const testBtn = document.getElementById('test-charge-btn');

                const base = 'h-10 rounded-xl active:scale-95 font-semibold transition ';
                const sym = 'w-11 text-xl font-bold leading-none ';
                const txt = 'px-3 text-xs sm:text-sm ';

                if (posBtn) {
                    posBtn.className = base + sym + (state.placementMode === 'pos'
                        ? 'bg-rose-500/40 border-2 border-rose-300 text-rose-100'
                        : 'bg-rose-500/25 hover:bg-rose-500/35 border border-rose-400/50 text-rose-200');
                }

                if (negBtn) {
                    negBtn.className = base + sym + (state.placementMode === 'neg'
                        ? 'bg-blue-500/40 border-2 border-blue-300 text-blue-100'
                        : 'bg-blue-500/25 hover:bg-blue-500/35 border border-blue-400/50 text-blue-200');
                }

                if (testBtn) {
                    testBtn.className = base + txt + (state.placementMode === 'test'
                        ? 'bg-amber-400/40 border-2 border-amber-200 text-amber-100'
                        : state.testCharge.active
                            ? 'bg-amber-400/30 hover:bg-amber-400/40 border border-amber-300 text-amber-100'
                            : 'bg-amber-500/25 hover:bg-amber-500/35 border border-amber-400/50 text-amber-200');
                }

                if (renderer && renderer.domElement) {
                    renderer.domElement.style.cursor = state.placementMode !== 'none' ? 'crosshair' : 'default';
                }
            }

            function selectPlacementMode(mode) {
                state.placementMode = state.placementMode === mode ? 'none' : mode;
                syncPlacementButtons();
            }

            function bindUI() {
                document.getElementById('top-view-btn').addEventListener('click', () => setCameraView('top', true));
                document.getElementById('side-view-btn').addEventListener('click', () => setCameraView('side', true));
                document.getElementById('add-pos-btn').addEventListener('click', () => selectPlacementMode('pos'));
                document.getElementById('add-neg-btn').addEventListener('click', () => selectPlacementMode('neg'));
                document.getElementById('test-charge-btn').addEventListener('click', () => selectPlacementMode('test'));
                document.getElementById('sel-mag').addEventListener('input', (e) => setSelectedMagnitude(parseFloat(e.target.value)));
                document.getElementById('sel-del').addEventListener('click', deleteSelectedCharge);
                document.addEventListener('input', paintRanges);
                initPolygon();
                paintRanges();
                window.addEventListener('keydown', (e) => {
                    if ((e.key === 'Delete' || e.key === 'Backspace') && e.target.tagName !== 'INPUT' && !document.body.classList.contains('film')) { e.preventDefault(); deleteSelectedCharge(); }
                });

                syncMagnitudeControls();
                syncPlacementButtons();
            }

            // =========================================================================
            // 7. ANIMATION LOOP & INITIALIZATION
            // =========================================================================
            let lastFrameTime = performance.now();

            function animate() {
                requestAnimationFrame(animate);
                const now = performance.now();
                const dt = (now - lastFrameTime) / 1000;
                lastFrameTime = now;

                stepCameraTween(Math.min(dt, 0.05));
                stepTestCharge(dt);
                if (guideTickFn) guideTickFn(dt);
                if (guideRender) guideRender(); else renderer.render(scene, camera);
            }

            // =========================================================================
            // 8. INTERACTIVE GUIDE + PER-STEP ANIMATION (film) LAYER
            // =========================================================================
            let guideTickFn = null, guideRender = null, filmActive = false;

            function initGuide() {
                const $ = (id) => document.getElementById(id);
                const G = new THREE.Group();
                scene.add(G);
                const K = 2.2, defaults = [[-3, 0, 1.8], [3, 0, -1.8]];
                const V = (x, z) => evaluatePotential(x, z).potential;
                const H = (x, z) => evaluatePotential(x, z).height;
                const ez = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));
                const sg = (t, a, b) => ez((t - a) / (b - a));
                const clampP = (v) => Math.max(-13.5, Math.min(13.5, v));
                const MT = [];
                const reg = (m, o) => { m.transparent = true; m.opacity = o; MT.push([m, o]); return m; };
                // Round dots (a textured circle) instead of the default square points
                const dotTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d'); g.fillStyle = '#fff'; g.beginPath(); g.arc(32, 32, 30, 0, Math.PI * 2); g.fill(); return new THREE.CanvasTexture(c); })();
                const dotMat = (size) => new THREE.PointsMaterial({ size, map: dotTex, vertexColors: true, transparent: true, alphaTest: 0.05, depthTest: false, depthWrite: false });

                const mk = (Type, c, n, o = 1) => {
                    const g = new THREE.BufferGeometry();
                    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
                    const l = new Type(g, reg(new THREE.LineBasicMaterial({ color: c, depthTest: false }), o));
                    l.renderOrder = 5; l.frustumCulled = false; G.add(l);
                    return l;
                };
                const put = (l, pts) => { const a = l.geometry.attributes.position; pts.forEach((p, i) => a.setXYZ(i, p[0], p[1], p[2])); a.needsUpdate = true; };
                const orb = (c, r = 0.3) => {
                    const m = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 20), reg(new THREE.MeshBasicMaterial({ color: c, depthTest: false }), 1));
                    m.renderOrder = 6; G.add(m);
                    return m;
                };
                const arrowPts = (x, y, z, dx, dz, len) => {
                    const tx = x + dx * len, tz = z + dz * len, h = 0.35, w = 0.17;
                    return [[x, y, z], [tx, y, tz], [tx - dx * h - dz * w, y, tz - dz * h + dx * w], [tx, y, tz], [tx - dx * h + dz * w, y, tz - dz * h - dx * w]];
                };
                const trail = (l, h, p, n) => { h.push(p); if (h.length > n) h.shift(); put(l, Array.from({ length: n }, (_, i) => h[Math.min(i, h.length - 1)])); };
                // Arrow field of -grad(V), laid out on a 13x13 grid around (ox, oz) with spacing sp
                const field = (line, reveal, k = 1, ox = 0, oz = 0, sp = 2) => {
                    const a = line.geometry.attributes.position, A = a.array; let o = 0;
                    const sgm = (x1, y1, z1, x2, y2, z2) => { A[o++] = x1; A[o++] = y1; A[o++] = z1; A[o++] = x2; A[o++] = y2; A[o++] = z2; };
                    for (let i = -6; i <= 6; i++) for (let j = -6; j <= 6; j++) {
                        const x = ox + sp * i, z = oz + sp * j, e = evaluateTestChargeAcceleration(x, z), m = Math.hypot(e.ax, e.az) || 1;
                        const dx = e.ax / m, dz = e.az / m, L = Math.min(1.5, 0.25 + 0.55 * Math.log(1 + m)) * ez((reveal - Math.hypot(x - ox, z - oz)) / 3) * k;
                        const tx = x + dx * L, tz = z + dz * L, y0 = H(x, z) + 0.2, y1 = H(tx, tz) + 0.2, f = Math.min(1, L / 0.5), hd = 0.4 * f, w = 0.18 * f;
                        sgm(x, y0, z, tx, y1, tz);
                        sgm(tx, y1, tz, tx - dx * hd - dz * w, y1, tz - dz * hd + dx * w);
                        sgm(tx, y1, tz, tx - dx * hd + dz * w, y1, tz - dz * hd - dx * w);
                    }
                    a.needsUpdate = true;
                };
                const clearG = () => {
                    MT.length = 0;
                    while (G.children.length) { const o = G.children[0]; G.remove(o); if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); }
                };
                const restore = () => {
                    surfaceMesh.material.opacity = 0.42; contourLines.material.opacity = 0.35; surfaceMesh.visible = true; deformationGridLines.visible = true; contourLines.visible = true;
                };
                const setCharges = (list) => {
                    state.charges = list.map((c, i) => ({ id: i + 1, x: c[0], y: c[1], q: c[2] }));
                    state.nextId = list.length + 1; state.selectedId = 1; state.placementMode = 'none';
                    syncPlacementButtons(); syncChargeMarkers(); syncMagnitudeControls(); recomputeSurface();
                };
                // The charge you last clicked, dragged or placed
                const sel = () => state.charges.find((c) => c.id === state.selectedId) || state.charges[0];
                const scaleCharge = (id, s) => { const e = chargeMeshes.get(id); if (e) { e.core.scale.setScalar(s); e.ring.scale.setScalar(s); e.badge.visible = s > 0.6; } };
                const drop = (x, z) => { Object.assign(state.testCharge, { active: true, x, y: z, vx: 0, vz: 0 }); syncTestChargeMarker(); };
                const view = (th, ph, r) => {
                    cameraRig.target.set(0, 0, 0);
                    cameraRig.theta = th; cameraRig.phi = ph; cameraRig.radius = r;
                    applyCameraSpherical();
                };
                const sl = (id, lab, min, max, st, v) => `<label class="flex items-center gap-3 text-xs font-medium text-slate-300 px-3 py-1.5 rounded-xl bg-slate-800/60 border border-slate-700/60"><span class="min-w-[8.5rem] flex items-center justify-between gap-2 whitespace-nowrap">${lab} <b id="${id}v" class="rng-val"></b></span><input id="${id}" type="range" min="${min}" max="${max}" step="${st}" value="${v}" class="rng"></label>`;
                const bt = (id, lab, c) => `<button id="${id}" type="button" class="flex-1 px-3 py-2 rounded-xl bg-${c}-500/25 hover:bg-${c}-500/35 active:scale-95 border border-${c}-400/50 text-${c}-200 text-xs font-semibold transition">${lab}</button>`;
                const row = (...b) => `<div class="flex gap-2">${b.join('')}</div>`;
                const rd = (id, d = 1) => { const v = +$(id).value; $(id + 'v').textContent = v.toFixed(d); return v; };
                const sn = (v) => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2);
                const f2 = (v) => v.toFixed(2);
                const sub = (n) => String(n).replace(/\d/g, (d) => '₀₁₂₃₄₅₆₇₈₉'[+d]);

                // ---- Cinematic atmosphere (only while a step is animating) ----------------------
                const fog = new THREE.FogExp2(0x0b0f19, 0.0075);
                const dp = new Float32Array(900);
                for (let i = 0; i < 300; i++) { const a = Math.random() * 6.283, r = 8 + Math.random() * 55; dp.set([r * Math.cos(a), -6 + Math.random() * 38, r * Math.sin(a)], i * 3); }
                const dg = new THREE.BufferGeometry(); dg.setAttribute('position', new THREE.BufferAttribute(dp, 3));
                const dust = new THREE.Points(dg, new THREE.PointsMaterial({ color: 0x9db8ff, size: 0.22, transparent: true, opacity: 0.55, depthWrite: false, fog: false, blending: THREE.AdditiveBlending }));
                dust.visible = false; scene.add(dust);
                let comp = null;
                if (THREE.EffectComposer && THREE.UnrealBloomPass && THREE.RenderPass) {
                    comp = new THREE.EffectComposer(renderer);
                    comp.addPass(new THREE.RenderPass(scene, camera));
                    comp.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.65, 0.6, 0.3));
                }

                let S = {}, cur = 0, T = 0, film = false, userCam = false, ready = false, capK = -2, capTxt = '';
                let sc = null, ctx = null, U = null, eqLines = [], eqTok = 0;
                const fitView = () => {
                    const w = window.innerWidth, h = window.innerHeight;
                    if (film) camera.setViewOffset(w, h, 0, h * 0.16, w, h); // lift the scene above captions/equations
                    if (comp) comp.setSize(w, h);
                };
                window.addEventListener('resize', fitView);

                // ---- The user's own configuration, captured when an animation starts -----------
                const snap = () => ({ cs: state.charges.map((c) => ({ ...c })), tc: { ...state.testCharge }, sel: state.selectedId, next: state.nextId });
                const unsnap = () => {
                    if (!U) return;
                    state.charges = U.cs.map((c) => ({ ...c })); state.nextId = U.next; state.selectedId = U.sel;
                    Object.assign(state.testCharge, U.tc, { vx: 0, vz: 0 });
                    chargeMeshes.forEach((e) => { e.core.scale.setScalar(1); e.ring.scale.setScalar(1); e.badge.visible = true; });
                    syncChargeMarkers(); recomputeSurface(); syncTestChargeMarker();
                    U = null;
                };
                // Everything the animations need to know about your charges
                const buildCtx = () => {
                    const cs = U.cs, n = cs.length;
                    const np = cs.filter((c) => c.q >= 0).length, nn = n - np;
                    let cx = 0, cz = 0; cs.forEach((c) => { cx += c.x / n; cz += c.y / n; });
                    const ext = Math.max(0, ...cs.map((c) => Math.hypot(c.x - cx, c.y - cz)));
                    const main = cs.reduce((a, c) => (Math.abs(c.q) > Math.abs(a.q) + 1e-9 ? c : a), cs[0]); // strongest charge
                    let dir = [1, 0];
                    const others = cs.filter((c) => c !== main);
                    if (others.length) {
                        let ox = 0, oz = 0, w = 0;
                        others.forEach((c) => { const a = Math.abs(c.q) + 0.1; ox += c.x * a; oz += c.y * a; w += a; });
                        ox /= w; oz /= w;
                        const L = Math.hypot(main.x - ox, main.y - oz);
                        if (L > 0.3) dir = [(main.x - ox) / L, (main.y - oz) / L]; // away from the others: cleanest 1/r look
                    }
                    const fr = Math.min(2.4, Math.max(1, (ext + 8) / 11)); // zoom factor that frames all charges
                    const tc = U.tc.active ? [clampP(U.tc.x), clampP(U.tc.y)] : null;
                    return { cs, n, np, nn, cx, cz, ext, main, dir, fr, tc };
                };

                // Keeps a slider and the selected charge's value in step, both ways
                const bindSel = (id) => {
                    const el = $(id), c = sel();
                    el.disabled = !c;
                    if (!c) { S.sid = null; return null; }
                    const v = +el.value;
                    if (S.sid !== c.id) { S.sid = c.id; el.value = c.q.toFixed(1); S.sv = +el.value; S.cq = c.q; }
                    else if (v !== S.sv) { S.sv = v; S.cq = v; c.q = v; syncChargeMarkers(); recomputeSurface(); }
                    else if (c.q !== S.cq) { S.cq = c.q; el.value = c.q.toFixed(1); S.sv = +el.value; }
                    rd(id);
                    return c;
                };
                const NONE = 'No charges yet: press + or − at the bottom, then tap the sheet to place one.';

                // ---- Interactive steps (sliders, probes, readouts) ------------------------------
                // They work on whatever charges you have built; nothing is reset when you move between steps.
                                // ---- Detailed derivations shown in the Details sheet (one entry per step) ----
                const R = String.raw;
                const DERIV = [
                    { topic: 'The electrostatic potential of a point charge', s: [
                        [R`Start from Coulomb’s law`, R`<p>A source charge \(q\) pushes a test charge \(q_0\) at distance \(r\) with</p>\[\vec F=\frac{k\,q\,q_0}{r^{2}}\,\hat r,\qquad k=\frac{1}{4\pi\varepsilon_0}\]<p>Dividing out \(q_0\) gives the field, which belongs to \(q\) alone:</p>\[\vec E=\frac{\vec F}{q_0}=\frac{kq}{r^{2}}\,\hat r\]`],
                        [R`Work to bring \(q_0\) in from infinity`, R`<p>Move \(q_0\) slowly from \(\infty\) to radius \(r\). We must cancel the field’s force, so our force is \(-\vec F\), and \(d\vec l=dr'\,\hat r\):</p>\[W=-\int_{\infty}^{r}\vec F\cdot d\vec l=-kqq_0\int_{\infty}^{r}\frac{dr'}{r'^{2}}\]<p>The integral is elementary:</p>\[\int_{\infty}^{r}\frac{dr'}{r'^{2}}=\left[-\frac{1}{r'}\right]_{\infty}^{r}=-\frac{1}{r}\quad\Longrightarrow\quad W=\frac{kqq_0}{r}\]`],
                        [R`Divide out the test charge`, R`<p>The work is stored as potential energy, \(U=W\). Dividing by \(q_0\) removes the test charge:</p>\[V(r)=\frac{U}{q_0}=\frac{kq}{r}\]<p>\(V\) is one number per point (a scalar), and \(V\to0\) at infinity by construction.</p>`],
                        [R`Read the sign`, R`<p>If \(q>0\) then \(V>0\): a hill. If \(q<0\) then \(V<0\): a well. Doubling \(|q|\) doubles the height, and far away \(V\to0\), so the sheet flattens.</p>`],
                        [R`Sandbox version and the yellow marker`, R`<p>At \(r=0\) the formula blows up, so the sandbox softens it with \(\varepsilon=1.25\) and sets \(k=1\):</p>\[V=\frac{q}{\sqrt{r^{2}+\varepsilon^{2}}}\]<p>The marker sits at \(r=4\), so</p>\[V=\frac{q}{\sqrt{4^{2}+1.25^{2}}}=\frac{q}{\sqrt{17.5625}}\approx 0.239\,q\]<p>Sliding \(q\) through zero therefore carries the marker through zero.</p>`] ] },
                    { topic: R`Potential energy \(U=q_0V\) and the force on a test charge`, s: [
                        [R`Why divide by \(q_0\)?`, R`<p>Work done on the test charge is proportional to \(q_0\), so</p>\[U=q_0V\]<p>Doubling \(q_0\) doubles \(U\) but leaves \(V\) unchanged: \(V\) describes the source, \(U\) describes the pair.</p>`],
                        [R`Recover Coulomb’s force from energy`, R`<p>Force is the downhill slope of potential energy. With \(U=q_0kq/r\):</p>\[F=-\frac{dU}{dr}=-q_0kq\,\frac{d}{dr}\!\left(\frac{1}{r}\right)=\frac{kqq_0}{r^{2}}\]<p>This is exactly Coulomb’s law, so nothing was lost by switching to energy.</p>`],
                        [R`Force in terms of the field`, R`<p>Combining \(\vec F=q_0\vec E\) with the line above,</p>\[\vec E=-\frac{dV}{dr}\,\hat r\]<p>so the arrow points downhill, with length equal to the slope.</p>`],
                        [R`Release the +1 charge`, R`<p>With no friction, mechanical energy is conserved:</p>\[\tfrac12 m v^{2}+q_0V=\text{const}\;\Longrightarrow\;\tfrac12 m v^{2}=q_0\,(V_{\text{start}}-V)\]<p>The charge rolls downhill, trading potential energy for motion.</p>`] ] },
                    { topic: 'Building the surface from samples', s: [
                        [R`Pick a grid point`, R`<p>At a point \((x,z)\), the distance to charge \(i\) (at \((x_i,z_i)\)) is</p>\[r_i=\sqrt{(x-x_i)^{2}+(z-z_i)^{2}}\]`],
                        [R`Each charge’s contribution`, R`<p>Using the softened point-charge potential,</p>\[V_i=\frac{k\,q_i}{\sqrt{r_i^{2}+\varepsilon^{2}}}\]`],
                        [R`Add the contributions`, R`\[V(x,z)=\sum_{i=1}^{N}V_i=\sum_{i=1}^{N}\frac{k\,q_i}{\sqrt{r_i^{2}+\varepsilon^{2}}}\]`],
                        [R`Convert the number to a height`, R`<p>The dot is placed at height proportional to \(V\), smoothly capped so tall peaks stay on screen:</p>\[h\approx 2.2\,V\quad(\text{small }V),\qquad |h|\le h_{\max}\ \text{via}\ \tanh\]`],
                        [R`Repeat over the whole grid`, R`<p>The real sheet evaluates the same sum at every vertex:</p>\[161\times161=25{,}921\ \text{evaluations}\]<p>Few dots give a rough outline; many dots fill in the smooth surface.</p>`] ] },
                    { topic: 'Superposition: why potentials simply add', s: [
                        [R`Forces are linear`, R`<p>Coulomb forces from several charges add as vectors, so the net force on \(q_0\) is</p>\[\vec F_{\text{tot}}=\sum_i\vec F_i\]`],
                        [R`Integrate the sum`, R`<p>The work integral is linear too, so it splits into one piece per charge:</p>\[U=-\int_{\infty}^{P}\vec F_{\text{tot}}\cdot d\vec l=\sum_i\left(-\int_{\infty}^{P}\vec F_i\cdot d\vec l\right)=\sum_i U_i\]`],
                        [R`Divide by \(q_0\)`, R`\[V=\sum_i\frac{U_i}{q_0}=\sum_i\frac{kq_i}{r_i}\]<p>Each charge builds its own red or blue step, and the white stem is their total.</p>`],
                        [R`Worked example (default scene)`, R`<p>Charges \(+1.8\) at \((-3,0)\) and \(-1.8\) at \((3,0)\). At the origin both are at \(r=3\), and \(\sqrt{3^{2}+1.25^{2}}=3.25\):</p>\[V(0,0)=\frac{1.8}{3.25}-\frac{1.8}{3.25}=0\]<p>Equal and opposite charges cancel on their mid-plane.</p>`],
                        [R`Why one scalar sheet is enough`, R`<p>Adding \(V\) is plain arithmetic. Adding \(\vec E\) needs a vector sum, component by component:</p>\[\vec E=\sum_i\vec E_i=\Big(\sum_i E_{x,i},\ \sum_i E_{z,i}\Big)\]<p>So we sum numbers first and take the slope afterwards.</p>`] ] },
                    { topic: 'The electric field is the negative gradient of V', s: [
                        [R`A small step on the sheet`, R`<p>Moving by \(d\vec l=(dx,dz)\) changes the height by</p>\[dV=\frac{\partial V}{\partial x}\,dx+\frac{\partial V}{\partial z}\,dz=\nabla V\cdot d\vec l\]`],
                        [R`Compare with the energy change`, R`<p>The field does work \(q_0\vec E\cdot d\vec l\), which lowers \(U\): \(q_0\,dV=-q_0\,\vec E\cdot d\vec l\). Cancelling \(q_0\),</p>\[dV=-\vec E\cdot d\vec l\quad\Longrightarrow\quad\vec E=-\nabla V\]`],
                        [R`Check with a point charge`, R`<p>Let \(s=x^{2}+z^{2}+\varepsilon^{2}\), so \(V=kq\,s^{-1/2}\). Then</p>\[\frac{\partial V}{\partial x}=kq\left(-\tfrac12\right)s^{-3/2}(2x)=-\frac{kq\,x}{s^{3/2}}\]<p>and the same for \(z\), giving</p>\[\vec E=\frac{kq\,(x,\,z)}{(x^{2}+z^{2}+\varepsilon^{2})^{3/2}}\ \xrightarrow{\ \varepsilon\to0\ }\ \frac{kq}{r^{2}}\,\hat r\]<p>which is Coulomb’s field again.</p>`],
                        [R`Equipotentials`, R`<p>Along a contour \(V\) is constant, so</p>\[dV=0\;\Longrightarrow\;\vec E\cdot d\vec l=0\]<p>\(\vec E\) is perpendicular to every contour and points steeply downhill. Contour spacing \(\Delta s\) at voltage step \(\Delta V\) gives</p>\[|\vec E|\approx\frac{\Delta V}{\Delta s}\]<p>so closer lines mean a stronger field.</p>`] ] },
                    { topic: 'Potential difference and path independence', s: [
                        [R`Work along a path`, R`<p>To carry \(q_0\) from \(A\) to \(B\) we cancel the field’s force:</p>\[W_{A\to B}=-q_0\int_A^B\vec E\cdot d\vec l\]`],
                        [R`Use \(\vec E=-\nabla V\)`, R`\[W=q_0\int_A^B\nabla V\cdot d\vec l=q_0\int_A^B dV=q_0\,\big[V\big]_A^B\]<p>The integrand is an exact differential, so the integral depends on the end points only.</p>`],
                        [R`The result`, R`\[\Delta U=q_0\,(V_B-V_A)=q_0\,\Delta V\]`],
                        [R`Closed loops`, R`<p>If \(B=A\) then \(\Delta V=0\), hence</p>\[\oint\vec E\cdot d\vec l=0\;\Longrightarrow\;\nabla\times\vec E=0\]<p>by Stokes’ theorem. This also follows from \(\nabla\times\nabla V=0\). A detour therefore ends at the same \(\Delta V\).</p>`],
                        [R`Reading the sign`, R`<p>\(\Delta V>0\): climbing a hill costs work. \(\Delta V<0\): sliding down returns it.</p>`] ] },
                    { topic: 'The complete chain, from charge to energy', s: [
                        [R`Sources set the potential`, R`\[V(x,z)=\sum_i\frac{k\,q_i}{\sqrt{r_i^{2}+\varepsilon^{2}}}\]`],
                        [R`The sheet is a plot of \(V\)`, R`<p>Height is proportional to \(V\): hills for \(q>0\), wells for \(q<0\).</p>`],
                        [R`Slope gives the field`, R`\[\vec E=-\nabla V\]`],
                        [R`Differences give energy and force`, R`\[\Delta U=q_0\,\Delta V,\qquad\vec F=q_0\vec E\]`],
                        [R`Try it: scaling the charges`, R`<p>Everything is linear in the charges. Select a charge and drag its slider (or press <b>Delete</b>) to check:</p>\[q_i\to\lambda q_i\;\Longrightarrow\;V\to\lambda V,\quad\vec E\to\lambda\vec E,\quad\Delta U\to\lambda\,\Delta U\]`] ] }
                ];
                const LEARN = [
                    { big: R`A charge reshapes the space around it, like a heavy ball on a stretched trampoline.`, words: [R`Picture a stretched rubber sheet. A <b>positive</b> charge pushes it up into a hill; a <b>negative</b> charge pulls it down into a pit. The height of the sheet at any spot is the <b>potential</b> \(V\): the energy a unit charge would carry if you placed it right there.`, R`Far away the sheet is flat, so \(V\approx0\). Close to the charge it gets steep. Make the charge twice as big and the hill becomes twice as tall.`], key: R`Potential is height: \(V=\dfrac{kq}{r}\), tall near the charge and flat far away.` },
                    { big: R`A test charge on the hill feels a push, and the push is just how steep the hill is.`, words: [R`Place a small test charge \(q_0\) on the sheet. Like a marble on a slope, it wants to roll downhill. The energy it stores is \(U=q_0V\): the higher it sits, the more energy it holds.`, R`Let it go and that stored energy turns into motion. So there are two ways to say one thing: <b>energy is height</b>, and <b>force is slope</b>.`], key: R`Energy is height times the test charge: \(U=q_0V\). The force is the downhill slope.` },
                    { big: R`The computer builds the whole sheet by measuring the height one dot at a time.`, words: [R`For every dot on a grid it asks each charge, <i>how much do you raise this spot?</i>, and adds up the answers. Then the dot is lifted to that height.`, R`A few dots only sketch a rough outline. With many dots, the neighbours join up into a smooth surface. That is all the 3D sheet is: many tiny measurements of \(V\) placed side by side.`], key: R`The surface is just \(V\) measured at many points and joined up.` },
                    { big: R`Several charges? Just add their hills and pits together.`, words: [R`Each charge makes its own hill or pit, as if the others were not there. The real sheet is the sum of all of them: a hill plus a pit partly cancel, and two hills stack into a taller one.`, R`Heights are plain numbers, so adding them is easy. That is why we work with potential first: there are no arrows to add.`], key: R`Total potential is the sum of each charge’s potential: \(V=\sum_i V_i\).` },
                    { big: R`The field arrow points straight downhill, and is longer where the sheet is steeper.`, words: [R`Contour lines join points of equal height, just like on a hiking map. The field always crosses them at right angles, along the steepest way down.`, R`Where the lines crowd together the slope is steep, so the field is strong. Where they spread out, the ground is gentle and the field is weak.`], key: R`\(\vec E=-\nabla V\): the field is the steepness of the sheet, pointing downhill.` },
                    { big: R`Moving between two points costs the same energy, whichever route you take.`, words: [R`Think of climbing a hill. The energy you spend depends on how much higher you end up, not on the winding path you took. Walking along a contour line costs nothing, because you stay at the same height.`, R`In the picture, rings are equal-height lines. Arcs along a ring add zero; only the straight steps across rings change the energy.`], key: R`\(\Delta U=q_0\,(V_B-V_A)\): only the start and end heights matter.` },
                    { big: R`You now have the whole chain: charges make \(V\), the slope of \(V\) gives \(\vec E\), and differences in \(V\) give energy.`, words: [R`Everything here is <b>linear</b>. Double every charge and every height, every field arrow and every energy doubles too.`, R`Now play: add, resize and delete charges (or place a polygon), and watch the same simple rules work every time.`], key: R`Charges \(\to\) potential \(\to\) field \(\to\) energy: one chain, the same rules everywhere.` }
                ];
                const sec = (t, b) => `<section class='dt-sec'><h4 class='dt-t'><span class='dt-tt'>${t}</span></h4>${b}</section>`;
                const deriv = (i, s) => {
                    const L = LEARN[i], D = DERIV[i];
                    return `<section class='dt-hero'><small>Step ${i + 1} of ${steps.length}</small><h3>${s.t}</h3><p>${L.big}</p></section>`
                        + sec('The idea, in plain words', L.words.map((p) => `<p class='dt-p'>${p}</p>`).join(''))
                        + sec('See the geometry (drag the sliders)', geoHTML(geoSteps[i]))
                        + sec('What you see on screen', `<div class='dv-ov'>${s.det}</div>`)
                        + sec('The maths, step by step', `<div class='dv'><div class='dv-topic'><small>Derivation</small><h3>${D.topic}</h3></div>${D.s.map(([h, b], k, a) => `<section class='dv-card${k === a.length - 1 ? ' dv-res' : ''}'><h4 class='dv-h'><span class='dv-ht'>${h}</span></h4>${b}</section>`).join('')}</div>`)
                        + sec('Remember', `<div class='dt-key'>${L.key}</div>`);
                };
                const derivOld = (i, s) => `<div class="dv-ov">${s.det}</div><div class="dv"><div class="dv-topic"><small>Derivation · Step ${i + 1} of ${steps.length}</small><h3>${DERIV[i].topic}</h3></div>${DERIV[i].s.map(([h, b], k, a) => `<section class="dv-card${k === a.length - 1 ? ' dv-res' : ''}"><h4 class="dv-h"><span class="dv-ht">${h}</span></h4>${b}</section>`).join('')}</div>`;

                const steps = [
                    {
                        t: 'Charges bend the sheet',
                        line: 'Empty space is a flat sheet (V = 0); a charge q lifts it into a hill (+) or digs a well (−).',
                        det: `<p>Picture a stretchy sheet lying flat. Above every point of space we plot one number, the <b>electrostatic potential</b> \\(V\\), as a height. With no charges, \\(V=0\\) everywhere and the sheet stays flat.</p><p>A point charge \\(q\\) lifts the sheet into a hill if \\(q>0\\) and digs a well if \\(q<0\\). Larger \\(|q|\\) means a taller hill or a deeper well. The sheet is simply a picture of one number per point.</p><p>Click or drag a charge to select it, then slide its \\(q\\) through zero and watch the yellow marker (4 units from it) rise and fall. Sandbox units: distances are grid units and \\(k=1\\).</p>`,
                        ui: sl('q', 'Selected q', -4, 4, 0.1, 0),
                        setup() { view(0.7, 1.0, 26); S.l = mk(THREE.Line, 0xfde047, 2); S.o = orb(0xfde047, 0.28); S.sid = null; },
