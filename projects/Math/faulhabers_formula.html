mjx-container{color:#ffe08a;overflow-x:auto;overflow-y:hidden;max-width:100%;padding:4px 0}mjx-container svg{max-width:100%;height:auto}.c{min-width:0;overflow-wrap:anywhere}.tb{border-collapse:collapse;width:100%;font-size:12px}.tb td,.tb th{border:1px solid #8a6a00;padding:4px 8px;text-align:center;white-space:nowrap}.tb th{color:var(--gd)}.opt{display:block;width:100%;text-align:left;margin:14px 0;padding:18px 20px;border-radius:18px;min-width:0;background:linear-gradient(160deg,#16213b,#0f182b);box-shadow:0 0 22px rgba(255,193,7,.12)}.opt b{font-size:17px}.opt span{font-weight:400;color:var(--mu);font-size:13px;line-height:1.5}input::placeholder{color:#b9a76e;opacity:.85}.ttl{min-width:0;flex:1}#sc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#gf{min-width:0;padding:8px 10px;font-size:12px;white-space:nowrap}#nt{margin-top:6px}

<header><div class="ttl"><span class="dot"></span><span id="sc">FAULHABER’S FORMULA</span></div><button id="gf">Generate formulae</button><a class="back" href="/" aria-label="Back">Back</a><div id="bar"></div></header>

<script>
window.MathJax={tex:{inlineMath:[['$','$']]},svg:{fontCache:'global'},startup:{typeset:false}};
const q=s=>document.querySelector(s),W={};
const gcd=(a,b)=>{a=a<0n?-a:a;while(b){[a,b]=[b,a%b]}return a};
const fr=(n,d=1n)=>{if(d<0n){n=-n;d=-d}const g=gcd(n,d)||1n;return[n/g,d/g]};
const ad=(a,b)=>fr(a[0]*b[1]+b[0]*a[1],a[1]*b[1]),mu=(a,b)=>fr(a[0]*b[0],a[1]*b[1]);
const fs=a=>a[1]==1n?''+a[0]:a[0]+'/'+a[1];
const C=(n,k)=>{let r=1n;for(let i=1n;i<=BigInt(k);i++)r=r*(BigInt(n)-i+1n)/i;return r};
const B=[];const bern=m=>{while(B.length<=m){const k=B.length;let s=fr(0n);for(let j=0;j<k;j++)s=ad(s,mu(fr(C(k+1,j)),B[j]));B.push(k?mu(s,fr(-1n,BigInt(k+1))):fr(1n))}return B};
const fact=n=>{let r=1n;for(let i=2n;i<=BigInt(n);i++)r*=i;return r};
const R=(id,l,a,b,v)=>`<label>${l} = <b id="${id}v">${v}</b></label><input type="range" id="${id}" min="${a}" max="${b}" value="${v}">`;
const val=id=>{const v=+q('#'+id).value;q('#'+id+'v').textContent=v;return v};

W.w1=e=>{e.innerHTML=`<p><b>Try it:</b> pick $n$ and $p$ and watch the column of $x^p/p!$ appear.</p><div class="ctl">${R('n','n',1,9,4)}${R('p','p',0,5,2)}</div><div id="o"></div>`;
const u=()=>{const n=val('n'),p=val('p');let s=0n,h='';for(let k=1;k<=n;k++){const t=BigInt(k)**BigInt(p);s+=t;h+=`<span class="ch">${k}<sup>${p}</sup>=${t}</span>`}
q('#o').innerHTML=h+`<p>$S_{${p}}(${n})$ = <b>${s}</b> &nbsp;→&nbsp; coefficient of $x^{${p}}$ in $S(x)$ is ${s}/${p}! = <b>${fs(fr(s,fact(p)))}</b></p>`;tx(q('#o'))};e.oninput=u;u()};

W.w2=e=>{e.innerHTML=`<p><b>Preview:</b> the true curve $\\frac{x}{e^x-1}$ (gold) against its series truncated at $B_N$ (cream). The two agree only inside $|x|&lt;2\\pi$ (dashed).</p><div class="ctl">${R('t','N',1,24,4)}</div><canvas id="cv" width="640" height="340"></canvas>`;
const u=()=>{const N=val('t'),b=bern(N).map(f=>Number(f[0])/Number(f[1])),c=q('#cv'),g=c.getContext('2d'),w=640,h=340,X=x=>(x+8)/16*w,Y=y=>h-(y+2)/11*h;
g.clearRect(0,0,w,h);g.strokeStyle='#8a6a00';g.lineWidth=1;g.beginPath();g.moveTo(0,Y(0));g.lineTo(w,Y(0));g.moveTo(X(0),0);g.lineTo(X(0),h);g.stroke();
g.setLineDash([6,6]);g.beginPath();for(const s of[-1,1]){g.moveTo(X(s*2*Math.PI),0);g.lineTo(X(s*2*Math.PI),h)}g.stroke();g.setLineDash([]);
const L=(f,col,lw)=>{g.strokeStyle=col;g.lineWidth=lw;g.beginPath();for(let x=-8,i=0;x<=8.001;x+=.05,i++){const y=f(x);i?g.lineTo(X(x),Y(y)):g.moveTo(X(x),Y(y))}g.stroke()};
L(x=>x?x/Math.expm1(x):1,'#ffc107',3);L(x=>{let s=0,t=1;for(let j=0;j<=N;j++){s+=b[j]*t;t*=x/(j+1)}return s},'#fff3c4',1.6)};e.oninput=u;u()};

W.w3=e=>{e.innerHTML=`<div class="ctl">${R('m','m',1,14,6)}</div><div id="o"></div>`;
const u=()=>{const m=val('m'),b=bern(m);let s=fr(0n),h='';b.slice(0,m+1).forEach((f,j)=>{h+=`<span class="ch">B<sub>${j}</sub> = ${fs(f)}</span>`;s=ad(s,mu(fr(C(m+1,j)),f))});
q('#o').innerHTML=h+`<p>Check: $\\sum_{j=0}^{${m}}\\binom{${m+1}}{j}B_j$ = <span class="ok">${fs(s)}</span></p>`;tx(q('#o'))};e.oninput=u;u()};

W.w4=e=>{e.innerHTML=`<div class="ctl">${R('n','n',1,10,5)}${R('p','p',1,6,3)}</div><div id="o"></div>`;
const u=()=>{const n=val('n'),p=val('p'),b=bern(p);let s=fr(0n),h='';for(let j=0;j<=p;j++){const t=mu(mu(fr(C(p+1,j)),b[j]),fr(BigInt(n+1)**BigInt(p+1-j)));s=ad(s,t);h+=`<span class="ch">j=${j}: ${fs(t)}</span>`}
const f=mu(s,fr(1n,BigInt(p+1)));let d=0n;for(let k=1;k<=n;k++)d+=BigInt(k)**BigInt(p);
q('#o').innerHTML=h+`<p>Sum of terms = ${fs(s)}; ÷ ${p+1} = <b>${fs(f)}</b></p><p>Direct: $1^{${p}}+\\cdots+${n}^{${p}}$ = <b>${d}</b> &nbsp;<span class="ok">${fs(f)==''+d?'✓ equal':'✗'}</span></p>`;tx(q('#o'))};e.oninput=u;u()};

const r=String.raw,S=[
['I · Setup','The goal',r`<div class="c"><p>We want a closed form for the sum of the first $n$ positive $p$-th powers.</p>$$S_p(n)=1^p+2^p+3^p+\cdots+n^p=\sum_{k=1}^{n}k^p$$</div><div class="c"><p><b>Strategy:</b> pack every $S_p(n)$ into one function of $x$ (a generating function), find that function in closed form, then read the coefficients back out.</p></div>`],
['I · Setup','Taylor series of $e^{kx}$',r`<div class="c"><p>For any fixed $k$:</p>$$e^{kx}=1+\frac{kx}{1!}+\frac{k^2x^2}{2!}+\cdots=\sum_{p=0}^{\infty}k^p\,\frac{x^p}{p!}$$<p>The coefficient of $\frac{x^p}{p!}$ is exactly $k^p$, the quantity we want to add up.</p></div>`],
['II · Generating function','Stack the exponentials',r`<div class="c"><p>Let</p>$$S(x)=e^{x}+e^{2x}+e^{3x}+\cdots+e^{nx}$$<p>and expand every term with the series from step 2:</p>$$\begin{aligned}S(x)=&\ \left(1+\frac{x}{1!}+\frac{x^2}{2!}+\frac{x^3}{3!}+\cdots\right)\\&+\left(1+\frac{2x}{1!}+\frac{2^2x^2}{2!}+\frac{2^3x^3}{3!}+\cdots\right)\\&+\left(1+\frac{3x}{1!}+\frac{3^2x^2}{2!}+\frac{3^3x^3}{3!}+\cdots\right)\\&\ \ \vdots\\&+\left(1+\frac{nx}{1!}+\frac{n^2x^2}{2!}+\frac{n^3x^3}{3!}+\cdots\right)\end{aligned}$$</div>`],
['II · Generating function','Add the columns',r`<div class="c"><p>Add each column (same power of $x$):</p>$$\begin{aligned}S(x)=&(1+1+\cdots+1)+(1+2+\cdots+n)\,x\\&+\frac{1^2+2^2+\cdots+n^2}{2!}x^2+\frac{1^3+2^3+\cdots+n^3}{3!}x^3+\cdots\end{aligned}$$$$\therefore\ S(x)=\sum_{p=0}^{\infty}\left(\sum_{k=1}^{n}k^p\right)\frac{x^p}{p!}=\sum_{p=0}^{\infty}S_p(n)\,\frac{x^p}{p!}$$</div><div class="c w" id="w1"></div>`,'w1'],
['III · Closed form','Geometric series',r`<div class="c"><p>$S(x)$ is geometric: first term $e^x$, common ratio $e^x$, $n$ terms.</p>$$S(x)=e^{x}\left[\frac{e^{nx}-1}{e^{x}-1}\right]=\frac{e^{(n+1)x}-e^{x}}{e^{x}-1}$$<p>using $e^x\cdot e^{nx}=e^{(n+1)x}$.</p></div>`],
['III · Closed form','Add and subtract 1',r`<div class="c">$$S(x)=\frac{e^{(n+1)x}-1-e^{x}+1}{e^{x}-1}=\frac{e^{(n+1)x}-1}{e^{x}-1}-\frac{e^{x}-1}{e^{x}-1}$$$$S(x)=\frac{e^{(n+1)x}-1}{e^{x}-1}-1=F(x)-1$$<p>where we define $F(x)=\dfrac{e^{(n+1)x}-1}{e^{x}-1}$.</p></div>`],
['III · Closed form','Split $F(x)$ in two',r`<div class="c"><p>Multiply and divide by $x$:</p>$$F(x)=\frac{e^{(n+1)x}-1}{e^{x}-1}=\frac{e^{(n+1)x}-1}{x}\times\frac{x}{e^{x}-1}$$<p>We need the Taylor series of <b>each</b> factor, then we multiply them.</p></div>`],
['IV · Two Taylor series','First factor: derivatives',r`<div class="c"><p>Let $y=e^{(n+1)x}-1$. Differentiate repeatedly:</p>$$y'=(n+1)e^{(n+1)x},\quad y''=(n+1)^2e^{(n+1)x},\ \dots,\ y^{(m)}=(n+1)^m e^{(n+1)x}$$<p>At $x=0$: $y(0)=0$ and $e^{(n+1)\cdot0}=1$, so $y^{(m)}(0)=(n+1)^m$.</p>$$e^{(n+1)x}-1=\sum_{m=1}^{\infty}\frac{(n+1)^m x^m}{m!}$$</div>`],
['IV · Two Taylor series','First factor: divide by $x$',r`<div class="c"><p>Divide by $x$, then shift the index $m\to m+1$ so the sum starts at $0$:</p>$$\begin{aligned}\frac{e^{(n+1)x}-1}{x}&=\frac1x\sum_{m=1}^{\infty}\frac{(n+1)^mx^m}{m!}\\&=\frac1x\sum_{m=0}^{\infty}\frac{(n+1)^{m+1}x^{m+1}}{(m+1)!}\\&=\sum_{m=0}^{\infty}\frac{(n+1)^{m+1}x^{m}}{(m+1)!}\end{aligned}$$<p>As $x\to0$ this tends to $n+1$.</p></div>`],
['IV · Two Taylor series','Second factor: unknown constants',r`<div class="c"><p>$\frac{x}{e^x-1}$ is analytic at $0$ (it tends to $1$), so it has a Taylor series with some constant coefficients. Name them $B_j$:</p>$$\frac{x}{e^{x}-1}=\sum_{j=0}^{\infty}B_j\,\frac{x^j}{j!}$$<p>The $B_j$ are the <b>Bernoulli numbers</b>. The next steps compute them.</p></div><div class="c w" id="w2"></div>`,'w2'],
['V · Bernoulli numbers','Use the reciprocal',r`<div class="c"><p>Multiply the series by its reciprocal $\frac{e^x-1}{x}$:</p>$$1=\left(\frac{e^{x}-1}{x}\right)\times\left(\sum_{j=0}^{\infty}B_j\frac{x^j}{j!}\right)$$<p>Same computation as step 8 with $n+1$ replaced by $1$: $\frac{e^x-1}{x}=\sum_{k=0}^{\infty}\frac{x^k}{(k+1)!}$. So</p>$$1=\sum_{k=0}^{\infty}\frac{x^k}{(k+1)!}\times\sum_{j=0}^{\infty}B_j\frac{x^j}{j!}$$</div>`],
['V · Bernoulli numbers','Match coefficients',r`<div class="c"><p>The term in $x^m$ comes from $m=k+j$, i.e. $k=m-j$. The left side is the constant $1$, so for $m\ge1$ the coefficient of $x^m$ is zero:</p>$$\sum_{j=0}^{m}\frac{1}{(m-j+1)!}\cdot\frac{B_j}{j!}=0\ \Rightarrow\ \sum_{j=0}^{m}\frac{(m+1)!}{(m+1-j)!\,j!}B_j=0$$$$\boxed{\ \sum_{j=0}^{m}\binom{m+1}{j}B_j=0\ }$$<p>This is the recursive relation of the Bernoulli numbers.</p></div>`],
['V · Bernoulli numbers','The first values',r`<div class="c"><p>$m=0$ (the coefficient of $x^0$ is $1$): $\binom10B_0=1\Rightarrow\boxed{B_0=1}$</p><p>$m=1$: $\binom20B_0+\binom21B_1=0\Rightarrow1+2B_1=0\Rightarrow\boxed{B_1=-\tfrac12}$</p></div><div class="c w" id="w3"></div>`,'w3'],
['VI · Assembly','Multiply the series',r`<div class="c">$$F(x)=\sum_{m=0}^{\infty}\frac{(n+1)^{m+1}x^m}{(m+1)!}\times\sum_{j=0}^{\infty}\frac{B_j}{j!}x^j$$<p>Let $p=m+j$, so $m=p-j$. The coefficient of $x^p$ is</p>$$[x^p]\,F(x)=\sum_{j=0}^{p}\frac{(n+1)^{p-j+1}}{(p-j+1)!}\times\frac{B_j}{j!}$$</div>`],
['VI · Assembly','Compare with $S(x)$',r`<div class="c"><p>Since $S(x)=F(x)-1$, the $-1$ only changes the $x^0$ term. For every $p\ge1$ the coefficients agree, and the coefficient of $x^p$ in $S(x)$ is $\frac{S_p(n)}{p!}$:</p>$$\frac{S_p(n)}{p!}=\sum_{j=0}^{p}\frac{(n+1)^{p-j+1}}{(p-j+1)!}\times\frac{B_j}{j!}$$</div>`],
['VI · Assembly','Solve for $S_p(n)$',r`<div class="c"><p>Multiply by $p!$ and insert $\frac{p+1}{p+1}=1$:</p>$$S_p(n)=\sum_{j=0}^{p}\frac{p!}{(p-j+1)!}(n+1)^{p-j+1}\frac{B_j}{j!}\times\frac{p+1}{p+1}$$<p>Since $p!\,(p+1)=(p+1)!$:</p>$$S_p(n)=\frac1{p+1}\sum_{j=0}^{p}\frac{(p+1)!}{(p+1-j)!\,j!}B_j(n+1)^{p+1-j}$$</div><div class="c fin">$$S_p(n)=\frac{1}{p+1}\sum_{j=0}^{p}\binom{p+1}{j}B_j\,(n+1)^{p+1-j}$$</div>`],
['VI · Assembly','Faulhaber’s formula',r`<div class="c fin"><p>For any $n,p\in\mathbb{Z}^+$, $1^p+2^p+\cdots+n^p$ is</p>$$\frac{1}{p+1}\sum_{j=0}^{p}\binom{p+1}{j}B_j\,(n+1)^{p+1-j}$$<p>where $\sum_{j=0}^{m}\binom{m+1}{j}B_j=0$ for all $m\in\mathbb{Z}^+$ and $B_0=1$. In logic form:</p>$$\begin{aligned}&\Big(B_0=1\ \wedge\ \forall m\in\mathbb{Z}^+,\ \sum_{j=0}^{m}\tbinom{m+1}{j}B_j=0\Big)\\&\Rightarrow\forall n,p\in\mathbb{Z}^+,\ \sum_{k=1}^{n}k^p=\frac1{p+1}\sum_{j=0}^{p}\tbinom{p+1}{j}B_j(n+1)^{p+1-j}\end{aligned}$$</div><div class="c w" id="w4"></div>`,'w4'],
['VII · Tables','Bernoulli numbers $B_0$ to $B_{10}$',r`<div class="c"><p>Every value comes from the recursion of step 12: $B_m=-\frac{1}{m+1}\sum_{j=0}^{m-1}\binom{m+1}{j}B_j$. Slide $m$ to see one value built from the earlier ones. Odd $B_j$ vanish for $j\ge3$.</p></div><div class="c w" id="wt0"></div>`,'wt0'],
['VII · Tables','How each $B_j$ enters $S_p(n)$',r`<div class="c"><p>Each row is one Bernoulli number. Its contribution to $S_p(n)$ is $\frac1{p+1}\binom{p+1}{j}B_j\,(n+1)^{p+1-j}$. Expand every $(n+1)^m$ in powers of $n$ and the coefficients appear.</p></div><div class="c w" id="wt1"></div>`,'wt1'],
['VII · Tables','All ten formulas, $p=1$ to $10$',r`<div class="c"><p>Every line below is the formula of step 17 with $p=1,\dots,10$, expanded in powers of $n$ from the Bernoulli numbers in the first table.</p></div><div class="c fin" id="wt2"></div>`,'wt2'],
['IX · Generator','Generate the formula for any $p$',r`<div class="c" id="wt3"></div>`,'wt3']];
const bf=N=>bern(N).map(f=>Number(f[0])/Number(f[1])),ex=Math.exp,sm=(n,p)=>{let s=0n;for(let k=1;k<=n;k++)s+=BigInt(k)**BigInt(p);return s};
const tay=(a,c,d,M,x)=>{let s=0,f=1;for(let t=0;t<=M+d;t++){if(t)f*=t;if(t>=c)s+=a**t*x**(t-d)/f}return s};
const z=x=>Math.abs(x)<1e-9?1e-9:x,Ac=(n,x)=>(ex((n+1)*z(x))-1)/z(x),Fc=(n,x)=>(ex((n+1)*z(x))-1)/(ex(z(x))-1),Sc=(n,x)=>{let s=0;for(let k=1;k<=n;k++)s+=ex(k*x);return s},rg=n=>[...Array(n)].map((_,i)=>i);
function G(e,o){e.innerHTML=`<p>${o.h}</p><div class="ctl">${o.s.map((s,i)=>R('s'+i,...s)).join('')}</div><canvas width="640" height="300"></canvas><div id="nt"></div>`;
const g=e.querySelector('canvas').getContext('2d'),w=640,h=300;
const u=()=>{const v=o.s.map((_,i)=>val('s'+i));g.clearRect(0,0,w,h);g.lineWidth=1;g.strokeStyle='#8a6a00';g.fillStyle='#b9a76e';g.font='13px monospace';
if(o.b){const{l,a}=o.b(v),neg=Math.min(...a)<0,y0=neg?h/2:h-30,m=Math.max(...a.map(Math.abs))||1,k=(neg?h/2-24:h-60)/m,bw=w/a.length;g.beginPath();g.moveTo(0,y0);g.lineTo(w,y0);g.stroke();
a.forEach((y,i)=>{g.fillStyle=y>=0?'#ffc107':'#fff3c4';g.fillRect(i*bw+bw*.15,y0-y*k,bw*.7,y*k);g.fillStyle='#b9a76e';g.fillText(l[i],i*bw+bw/2-4,h-8)})}
else{const[x0,x1]=o.x,[y0,y1]=o.y,X=x=>(x-x0)/(x1-x0)*w,Y=y=>h-(y-y0)/(y1-y0)*h;g.beginPath();g.moveTo(0,Y(0));g.lineTo(w,Y(0));g.moveTo(X(0),0);g.lineTo(X(0),h);g.stroke();
o.f(v).forEach(([c,lw,fn])=>{g.strokeStyle=c;g.lineWidth=lw;g.beginPath();for(let i=0;i<=240;i++){const x=x0+(x1-x0)*i/240,y=Math.max(y0-9,Math.min(y1+9,fn(x)));i?g.lineTo(X(x),Y(y)):g.moveTo(X(x),Y(y))}g.stroke()})}
