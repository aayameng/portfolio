                                if (S.pts) { G.remove(S.pts); S.pts.geometry.dispose(); S.pts.material.dispose(); }
                                const pos = new Float32Array(n * n * 3), col = new Float32Array(n * n * 3); let k = 0; S.hh = [];
                                for (let i = 0; i < n; i++) for (let j = 0; j < n; j++, k++) {
                                    const x = C.cx - half + 2 * half * i / (n - 1), z = C.cz - half + 2 * half * j / (n - 1), h = H(x, z);
                                    pos.set([x, 0, z], k * 3); col.set(h >= 0 ? [0.98, 0.44, 0.52] : [0.38, 0.64, 0.98], k * 3); S.hh.push(h);
                                }
                                const g = new THREE.BufferGeometry();
                                g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3));
                                S.pts = new THREE.Points(g, reg(dotMat(n < 10 ? 0.9 : n < 20 ? 0.6 : 0.42), 0.95));
                                S.pts.renderOrder = 5; S.pts.frustumCulled = false; G.add(S.pts); S.n = n;
                            },
                            tick(t) {
                                state.charges.forEach((c, i) => scaleCharge(c.id, Math.max(0.001, sg(t, 0.3 + 0.25 * i, 1.4 + 0.25 * i))));
                                const ph = t >= t0[2] ? 2 : t >= t0[1] ? 1 : t >= t0[0] ? 0 : -1;
                                if (ph !== S.ph && ph >= 0) { S.ph = ph; this.build([7, 13, 25][ph]); }
                                if (S.pts) {
                                    const n = S.n, Y = S.pts.geometry.attributes.position;
                                    for (let k = 0; k < n * n; k++) Y.setY(k, S.hh[k] * ez((t - t0[S.ph] - 0.9 * Math.floor(k / n) / (n - 1)) / 1.1));
                                    Y.needsUpdate = true;
                                }
                                const u = sg(t, 14, 18), show = t > 14;
                                surfaceMesh.material.opacity = 0.06 + 0.16 * sg(t, 4, 12) + 0.2 * u; // sheet becomes visible as the dots appear
                                deformationGridLines.visible = show; contourLines.visible = show; contourLines.material.opacity = 0.35 * u;
                            }
                        };
                    },
                    // 4. Superposition: stacked contributions land on the surface
                    (C) => {
                        const n = C.n, ax = Math.max(7.5, C.ext + 3.5), az = Math.max(4.5, C.ext * 0.7 + 2.5);
                        const terms = n === 1 ? 'V₁' : n === 2 ? 'V₁ + V₂' : n === 3 ? 'V₁ + V₂ + V₃' : `V₁ + V₂ + … + V${sub(n)}`;
                        const tx = n === 1 ? 'V=V_1' : n === 2 ? 'V=V_1+V_2' : n === 3 ? 'V=V_1+V_2+V_3' : `V=V_1+V_2+\\dots+V_{${n}}`;
                        return {
                            len: 21,
                            cam: [[0, 0.5, 1.1, 25, 0, 0, 0], [3.5, 0.7, 1.0, 10, 0, 0, 1], [8, 1.1, 0.95, 9, 0, 0, 1], [12, 1.5, 1.0, 18, 0, 0, 0.3], [17, 1.9, 1.15, 26, 0, 0, 0], [21, 2.2, 1.15, 28, 0, 0, 0]],
                            foc: () => S.o.position,
                            cap: [
                                [0.6, n > 1 ? `With your ${n} charges, every spot feels all of them at the same time.` : 'Every spot feels the charge. Add more charges and their potentials will pile up.'],
                                [4.0, 'Each charge makes its own potential at the probe: red lifts up (positive), blue pushes down (negative).'],
                                [8.0, n > 1 ? `Stack the pieces end to end: the top is the total V = ${terms} (the white line).` : 'The white line is the total potential V at the probe.'],
                                [13.0, 'Potentials are just numbers, so they simply add, however many charges there are.'],
                                [17.5, 'That is why a single sheet can describe any number of charges.']],
                            eq: [[4.5, 'V_i=\\dfrac{k\\,q_i}{r_i}'], [8.4, tx], [13.4, 'V=\\sum_i V_i']],
                            setup() {
                                S.ls = state.charges.map(() => mk(THREE.Line, 0xfb7185, 2));
                                S.sum = mk(THREE.Line, 0xffffff, 2); S.o = orb(0xffffff, 0.24); S.tr = mk(THREE.Line, 0xffffff, 90, 0.7); S.h = [];
                            },
                            tick(t) {
                                const x = C.cx + ax * Math.sin(0.4 * t), z = C.cz + az * Math.sin(0.65 * t + 0.8); let cum = 0;
                                S.ls.forEach((l, i) => {
                                    const c = state.charges[i];
                                    const v = c.q / Math.sqrt((x - c.x) ** 2 + (z - c.y) ** 2 + 1.5625), h = K * v;
                                    put(l, [[x, cum, z], [x, cum + h, z]]); l.material.color.set(v >= 0 ? 0xfb7185 : 0x60a5fa); cum += h;
                                });
                                put(S.sum, [[x + 0.25, 0, z], [x + 0.25, cum, z]]);
                                const y = H(x, z); S.o.position.set(x, y, z); trail(S.tr, S.h, [x, y + 0.1, z], 90);
                            }
                        };
                    },
                    // 5. Slope is force; equipotentials; a +1 charge rolls downhill (from your Test charge if you placed one)
                    (C) => {
                        const own = !!C.tc, p = C.tc || [clampP(C.cx + 8), clampP(C.cz + 6)];
                        const rolls = own ? 'Your +1 test charge is let go from where you put it, and it slides downhill.'
                            : C.np && C.nn ? 'Drop a +1 charge and it rolls downhill: away from the hills, toward the wells.'
                            : C.np ? 'Drop a +1 charge and it rolls downhill, away from the hills (like charges repel).'
                            : 'Drop a +1 charge and it rolls downhill into the wells (opposite charges attract).';
                        const gr = 14 * Math.min(1.7, C.fr), sp = 2 * Math.min(1.7, C.fr);
                        return {
                            len: 24,
                            cam: [[0, 0.8, 1.15, 30, 0, 0, 0], [3, 0.6, 1.0, 16, 0, 0, 1], [7, 0.3, 0.7, 22, 0, 0, 0.3], [11, 0.2, 0.6, 11, 0, 0, 0], [15, 0.1, 0.25, 26, 0, 0, 0], [19, 0, 0.08, 22, 0, 0, 0], [24, 0, 0.08, 24, 0, 0, 0]],
                            foc: () => new THREE.Vector3(state.testCharge.x, 0, state.testCharge.y),
                            cap: [[0.6, 'Look at the slope of the sheet: a charge placed on it wants to slide downhill.'], [3.0, rolls], [7.5, 'The arrows show the downhill push at every spot: the electric field E = −∇V (minus the slope of V).'], [11.5, 'Steeper slope means longer arrows: a stronger push.'], [15.0, 'The pale lines join points at equal height. They are called equipotentials, like contour lines on a map.'], [19.0, 'Arrows always cross those lines at right angles, because sliding along a line is neither up nor down.']],
                            eq: [[7.8, '\\vec{E}=-\\nabla V'], [11.8, 'E_x=-\\dfrac{\\partial V}{\\partial x}'], [19.4, '\\vec{E}\\perp\\{V=c\\}']],
                            setup() {
                                S.ar = mk(THREE.LineSegments, 0xfbbf24, 1014, 0.95); S.tr = mk(THREE.Line, 0xfff7ae, 80, 0.85); S.tr.visible = false; S.h = []; S.d = false;
                                Object.assign(state.testCharge, { active: false, x: p[0], y: p[1], vx: 0, vz: 0 });
                            },
                            tick(t) {
                                field(S.ar, gr * sg(t, 1, 5), 1, C.cx, C.cz, sp);
                                contourLines.material.opacity = 0.35 + 0.5 * sg(t, 2, 6) + 0.08 * Math.sin(t * 2);
                                if (!S.d && t > 3) { S.d = true; S.tr.visible = true; drop(p[0], p[1]); }
                                if (S.d && state.testCharge.active) { const c = state.testCharge; trail(S.tr, S.h, [c.x, H(c.x, c.y) + 0.25, c.y], 80); }
                            }
                        };
                    },
                    // 6. Work between two points is path independent (points chosen around your strongest charge)
                    (C) => {
                        const m = C.main, base = Math.atan2(C.dir[1], C.dir[0]);
                        let best = null; // pick the start/end pair with the clearest climb
                        for (let k = 0; k < 12; k++) {
                            const a = base + k * Math.PI / 6, b = a + 1.92;
                            const A0 = [m.x + 11 * Math.cos(a), m.y + 11 * Math.sin(a)], B0 = [m.x + 3.8 * Math.cos(b), m.y + 3.8 * Math.sin(b)];
                            const dv0 = V(B0[0], B0[1]) - V(A0[0], A0[1]);
                            if (!best || Math.abs(dv0) > Math.abs(best.dv) + 1e-9) best = { A: A0, B: B0, dv: dv0 };
                        }
                        const A = best.A, B = best.B, dv = best.dv, va = V(A[0], A[1]), vb = V(B[0], B[1]);
                        const ab = [B[0] - A[0], B[1] - A[1]], L = Math.hypot(ab[0], ab[1]) || 1, mid = [(A[0] + B[0]) / 2, (A[1] + B[1]) / 2];
                        let pd = [-ab[1] / L, ab[0] / L];
                        if (pd[0] * (mid[0] - m.x) + pd[1] * (mid[1] - m.y) < 0) pd = [-pd[0], -pd[1]]; // detour bulges away from the charge
                        const P1 = (s) => [A[0] + ab[0] * s, A[1] + ab[1] * s];
                        const P2 = (s) => { const p = P1(s), w = 6 * Math.sin(Math.PI * s); return [p[0] + pd[0] * w, p[1] + pd[1] * w]; };
                        return {
                            len: 26,
                            cam: [[0, 0.3, 1.1, 28, 0, 0, 0], [2, 0.6, 1.0, 14, 0, 0, 1], [6.5, 0.9, 1.0, 16, 0, 0, 1], [8, 1.0, 0.95, 12, B[0] - C.cx, B[1] - C.cz, 0], [10.5, 1.3, 1.0, 15, 0, 0, 1], [15.5, 1.6, 0.95, 26, 0, 0, 0], [21, 1.8, 1.05, 30, 0, 0, 0], [26, 2.0, 1.1, 28, 0, 0, 0]],
                            foc: () => S.c.position,
                            cap: [
                                [0.6, 'Now carry a +1 charge from the green point A to the orange point B.'],
                                [2.2, dv >= 0 ? 'Going uphill costs work, and the work you do equals how much V rises.' : 'Going downhill gives energy back: the work done equals the change in V (negative here).'],
                                [7.2, 'The gold bar is the change: ΔV = V_B − V_A, the work needed for each unit of charge.'],
                                [10.2, 'Now take the long way round, along the pink path...'],
                                [15.5, '...and the change is exactly the same. Only the start and end matter, not the route.'],
                                [20.0, 'So the work per unit charge is ΔV, and a full loop gains or loses nothing.']],
                            eq: [[7.4, '\\Delta V=V_B-V_A'], [9.0, `V_B-V_A=${f2(vb)}-(${f2(va)})=${f2(dv)}`], [12.0, 'W=q_0\\,\\Delta V'], [19.8, '\\oint \\vec{E}\\cdot d\\vec{\\ell}=0']],
                            setup() {
                                S.pa = mk(THREE.Line, 0xe2e8f0, 41, 0.85); S.pb = mk(THREE.Line, 0xf472b6, 41, 0.85); S.gh = mk(THREE.Line, 0x94a3b8, 2, 0.6);
                                S.A = orb(0x4ade80); S.B = orb(0xfb923c); S.c = orb(0xfbbf24, 0.26); S.m = mk(THREE.Line, 0xfde047, 2); S.br = mk(THREE.Line, 0xfde047, 2);
                            },
                            tick(t) {
                                const ln = (P) => Array.from({ length: 41 }, (_, i) => { const p = P(i / 40); return [p[0], H(p[0], p[1]) + 0.15, p[1]]; });
                                put(S.pa, ln(P1)); put(S.pb, ln(P2));
                                const hA = H(A[0], A[1]), hB = H(B[0], B[1]);
                                S.A.position.set(A[0], hA + 0.3, A[1]); S.B.position.set(B[0], hB + 0.3, B[1]);
                                const p = t < 7.8 ? P1(sg(t, 2, 7)) : t < 9.8 ? P1(1 - sg(t, 7.8, 9.8)) : P2(sg(t, 10, 15));
                                const hp = H(p[0], p[1]); S.c.position.set(p[0], hp + 0.3, p[1]);
                                put(S.m, [[p[0], hA, p[1]], [p[0], hp, p[1]]]);
                                S.gh.visible = t > 6; put(S.gh, [[A[0], hA, A[1]], [B[0], hA, B[1]]]);
                                S.br.visible = t > 7; put(S.br, [[B[0], hA, B[1]], [B[0], hB, B[1]]]);
                            }
                        };
                    },
                    // 7. Finale
                    (C) => {
                        const own = !!C.tc, p = C.tc || [clampP(C.cx - 8), clampP(C.cz - 6)], s = C.n > 1 ? 's' : '';
                        const gr = 16 * Math.min(1.7, C.fr), sp = 2 * Math.min(1.7, C.fr);
                        return {
                            len: 21,
                            cam: [[0, 2.0, 1.15, 30, 0, 0, 0], [5, 2.6, 1.0, 22, 0, 0, 0], [9, 3.2, 0.9, 40, 0, 0, 0], [14, 4.0, 1.05, 28, 0, 0, 0], [21, 4.8, 1.12, 34, 0, 0, 0]],
                            cap: [[1.0, `Your ${C.n} charge${s} set the potential V at every point: add up their kq/r.`], [4.5, 'V is drawn as height, which gives a surface of hills and wells.'], [8.0, 'The slope of that surface is the push on a charge: E = −∇V.'], [11.5, 'The climb between two points is the work per unit charge: ΔV.'], [15.5, 'Hills, wells, slopes and heights: that is electrostatic potential. Try dragging a charge!']],
                            eq: [[1.0, 'V=\\sum_i\\dfrac{k\\,q_i}{r_i}'], [8.2, '\\vec{E}=-\\nabla V'], [11.8, '\\Delta U=q_0\\,\\Delta V']],
                            setup() {
                                S.ar = mk(THREE.LineSegments, 0xfbbf24, 1014, 0.7); S.d = false;
                                Object.assign(state.testCharge, { active: false, x: p[0], y: p[1], vx: 0, vz: 0 });
                            },
                            tick(t) {
                                field(S.ar, gr * sg(t, 0.5, 4), 0.8, C.cx, C.cz, sp);
                                contourLines.material.opacity = 0.6 + 0.1 * Math.sin(t * 1.6);
                                if (!S.d && t > 1.5) { S.d = true; drop(p[0], p[1]); }
                            }
                        };
                    }
                ];

                const eqEl = $('eq'), capEl = $('cap'), veil = $('veil'), sheet = $('g-modal'), dock = $('g-dock');
                // Equations for the scene that is about to play (some contain numbers from your charges)
                const buildEq = (s) => {
                    eqEl.innerHTML = '';
                    const d = document.createElement('div'); d.className = 'sc';
                    eqLines = s.eq.map((e) => { const l = document.createElement('div'); l.className = 'ln'; l.textContent = '\\(\\displaystyle ' + e[1] + '\\)'; d.appendChild(l); return l; });
                    eqEl.appendChild(d);
                    ready = false;
                    const tok = ++eqTok;
                    const run = () => {
                        const M = window.MathJax;
                        if (M && M.typesetPromise) M.typesetPromise([eqEl]).then(() => { if (tok === eqTok) ready = true; }).catch(() => {});
                        else setTimeout(run, 250);
                    };
                    run();
                };
                const tex = (el, n = 0) => {
                    const M = window.MathJax;
                    if (M && M.typesetPromise && M.startup && M.startup.promise) { if (el.getClientRects().length) M.startup.promise = M.startup.promise.then(() => { if (M.typesetClear) M.typesetClear([el]); return M.typesetPromise([el]); }).catch((e) => console.warn('MathJax:', e)); }
                    else if (n < 40) setTimeout(() => tex(el, n + 1), 250);
                };
                const camAt = (keys, t) => {
                    let i = 0;
                    while (i < keys.length - 2 && t > keys[i + 1][0]) i++;
                    const a = keys[i], b = keys[i + 1], u = Math.min(1, Math.max(0, (t - a[0]) / (b[0] - a[0]))), w = 0.5 * u + 0.5 * ez(u);
                    return a.slice(1, 7).map((v, k) => (v || 0) + ((b[k + 1] || 0) - (v || 0)) * w);
                };

                // ---- Modes ---------------------------------------------------------------------
                const placeSheet = () => { sheet.style.bottom = (window.innerHeight - dock.getBoundingClientRect().top + 10) + 'px'; };
                const openM = () => { polyEl().classList.add('hidden'); sheet.classList.remove('hidden'); placeSheet(); tex(sheet); };
                const closeM = () => { sheet.classList.add('hidden'); };
                // ---- Collapsible bottom dock ----
                let dockCollapsed = false;
                const applyDock = () => {
                    dock.classList.toggle('collapsed', dockCollapsed);
                    $('dock-toggle').setAttribute('aria-expanded', String(!dockCollapsed));
                    $('dock-toggle').setAttribute('aria-label', dockCollapsed ? 'Expand controls' : 'Collapse controls');
                    if (dockCollapsed) { polyEl().classList.add('hidden'); }
                    placeSheet();
                };
                $('dock-toggle').onclick = () => { dockCollapsed = !dockCollapsed; applyDock(); };
                // an animation needs the Stop button, so open the dock whenever one starts
                new MutationObserver(() => { if (document.body.classList.contains('film') && dockCollapsed) { dockCollapsed = false; applyDock(); } }).observe(document.body, { attributes: true, attributeFilter: ['class'] });
                applyDock();
                const leaveFilm = () => {
                    film = false; filmActive = false; userCam = false; guideRender = null; sc = null; ctx = null;
                    document.body.classList.remove('film');
                    scene.fog = null; dust.visible = false; camera.clearViewOffset(); fitView();
                    eqLines.forEach((el) => el.classList.remove('on', 'dim')); eqEl.innerHTML = ''; eqLines = [];
                    capEl.style.opacity = 0; capK = -2; $('g-anim').innerHTML = '&#9654; Animate';
                    unsnap(); syncPlacementButtons();
                };
                let playAll = false; // true while 'Play all' is running every step back to back
                const go = (i, quiet) => {
                    if (i < 0 || i >= steps.length) return;
                    const replay = film; // moving between steps while an animation plays keeps it playing
                    if (film) leaveFilm();
                    clearG(); restore(); S = {}; cur = i;
                    const s = steps[i];
                    s.setup();
                    $('g-controls').innerHTML = s.ui;
                    if (s.bind) s.bind();
                    $('g-line').innerHTML = s.line;
                    $('g-mtitle').textContent = `${i + 1}/${steps.length} · ${s.t}`;
                    $('g-mbody').innerHTML = deriv(i, s); bindGeo($('g-mbody')); $('g-scroll').scrollTop = 0;
                    $('g-prev').disabled = i === 0;
                    $('g-next').disabled = i === steps.length - 1;
                    tex(sheet);
                    if (!quiet) showToast(`${i + 1}/${steps.length} · ${s.t}`, 2200);
                    if (replay) startFilm();
                };
                const startFilm = () => {
                    if (!state.charges.length) {
                        showToast('Add a + or − charge first, then press Animate.');
                        ['add-pos-btn', 'add-neg-btn'].forEach((id) => $(id).animate([{ transform: 'scale(1)' }, { transform: 'scale(1.18)' }, { transform: 'scale(1)' }], { duration: 450, iterations: 2 }));
                        return;
                    }
                    closeM(); state.placementMode = 'none'; syncPlacementButtons();
                    U = snap(); ctx = buildCtx(); sc = scenes[cur](ctx); // the scene is built from the charges you made
                    state.testCharge.active = false; state.testCharge.vx = state.testCharge.vz = 0; syncTestChargeMarker();
                    film = true; filmActive = true; T = 0; userCam = false; S = {}; capK = -2;
                    document.body.classList.add('film'); $('g-anim').innerHTML = '&#9632; Stop';
                    scene.fog = fog; dust.visible = true; guideRender = comp ? () => comp.render() : null;
                    fitView(); veil.style.transition = ''; veil.style.opacity = 1;
                    clearG(); restore(); buildEq(sc); sc.setup();
                };
                const stopFilm = () => {
                    playAll = false;
                    leaveFilm();
                    veil.style.transition = 'none'; veil.style.opacity = 1; void veil.offsetWidth;
                    veil.style.transition = 'opacity .7s ease'; veil.style.opacity = 0;
                    setTimeout(() => { veil.style.transition = ''; }, 800);
                    go(cur, true);
                };

                $('g-prev').onclick = () => go(cur - 1);
                $('g-next').onclick = () => go(cur + 1);
                $('g-anim').onclick = () => (film ? stopFilm() : startFilm());
                $('g-anim-all').onclick = () => {
                    if (film) { stopFilm(); return; }
                    go(0, true); playAll = true; startFilm();
                    if (!film) playAll = false; // nothing to animate yet (no charges)
                };
                $('g-details').onclick = () => (sheet.classList.contains('hidden') ? openM() : closeM());
                $('g-close').onclick = closeM;
                window.addEventListener('wheel', () => { userCam = true; }, { passive: true });
                window.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') closeM();
                    else if (e.target.tagName !== 'INPUT') { if (e.key === 'ArrowRight') go(cur + 1); else if (e.key === 'ArrowLeft') go(cur - 1); }
                });

                // Keep the Details sheet just above the button bar
                new ResizeObserver(() => { if (!sheet.classList.contains('hidden')) placeSheet(); }).observe(dock);
                window.addEventListener('resize', () => { if (!sheet.classList.contains('hidden')) placeSheet(); });

                guideTickFn = (dt) => {
                    try {
                        if (!film) {
                            syncMagnitudeControls(); paintRanges(); const r = steps[cur].tick(dt);
                            if (r !== S.r) { S.r = r; $('g-read').textContent = r; }
                            return;
                        }
                        T += dt;
                        const out = sc.len - T;
                        if (T >= sc.len) { if (playAll && cur < steps.length - 1) go(cur + 1); else stopFilm(); return; }
                        if (pointerState.mode === 'orbit' || pointerState.mode === 'pan') userCam = true;
                        if (!userCam) {
                            const c = camAt(sc.cam, T);
                            c[2] *= ctx.fr; c[3] += ctx.cx; c[4] += ctx.cz; // frame all of your charges
                            const f = sc.foc ? c[5] : 0, fp = f ? sc.foc() : null;
                            cameraRig.theta = c[0]; cameraRig.phi = c[1]; cameraRig.radius = c[2];
                            cameraRig.target.set(c[3] * (1 - f) + (fp ? fp.x * f : 0), fp ? fp.y * f : 0, c[4] * (1 - f) + (fp ? fp.z * f : 0));
                            applyCameraSpherical();
                        }
                        sc.tick(T, dt);
                        const alpha = ez(T / 0.8) * ez(out / 0.8);
                        MT.forEach((m) => { m[0].opacity = m[1] * alpha; });
                        veil.style.opacity = Math.max(1 - ez(T / 0.9), 1 - ez(out / 0.8));
                        dust.rotation.y += dt * 0.012;
                        let ci = -1;
                        sc.cap.forEach((c, i) => { if (T >= c[0]) ci = i; });
                        if (out < 0.7) ci = -1;
                        if (cur * 100 + ci !== capK) {
                            capK = cur * 100 + ci; capEl.style.opacity = 0; capTxt = ci >= 0 ? sc.cap[ci][1] : '';
                            setTimeout(() => { if (film) { capEl.textContent = capTxt; capEl.style.opacity = capTxt ? 1 : 0; } }, 450);
                        }
                        if (ready) {
                            let last = -1;
                            eqLines.forEach((el, li) => { const on = T >= sc.eq[li][0] && out > 0.7; el.classList.toggle('on', on); if (on) last = li; });
                            eqLines.forEach((el, li) => el.classList.toggle('dim', li < last - 1));
                        }
                    } catch (err) { console.error('Guide tick failed:', err); }
                };
                go(0, true);
            }

            window.onload = function () {
                try {
                    initThree();
                    bindUI();
                    attachEvents();
                    initGuide();
                    animate();
                } catch (err) {
                    console.error('Failed to initialize scalar surface:', err);
                }
            };
        })();
    </script>
</body>
</html>
