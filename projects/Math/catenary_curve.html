<style>
:root{color-scheme:dark;--gold:#ffca28;--cyan:#4dd0e1;--pink:#ff5c93;--green:#69f0ae;--mut:#8b9bb4;--tech:'Share Tech Mono',monospace;--ui:'Rajdhani',sans-serif;box-sizing:border-box}

background:radial-gradient(ellipse at 50% 30%,#12305a 0%,#081a35 45%,#030a18 100%)}
#cv,#css{position:absolute;inset:0}#cv{z-index:1}#css{z-index:2;pointer-events:none}
.nav{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) 26px 18px;pointer-events:none}

#dock{position:absolute;z-index:10;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));width:min(92%,380px);padding:14px;transition:opacity .6s,transform .6s}
#btn-derivation{width:100%;padding:14px;font:700 .95rem var(--ui);letter-spacing:5px;text-transform:uppercase;color:#1a1200;background:linear-gradient(135deg,#ffe082,#ffb300);border:0;border-radius:10px;cursor:pointer;box-shadow:0 0 24px rgba(255,202,40,.45);transition:.25s}

body:not(.tight) .eq div{background:rgba(0,0,0,.34);border:1px solid rgba(255,202,40,.2);border-radius:12px;padding:10px 12px}

.tabs{display:flex;gap:6px;margin:0 0 14px;padding:4px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid rgba(120,170,220,.2)}
.tabs[hidden]{display:none}

.tabs button:hover{color:var(--gold)}
.tabs button.on{background:linear-gradient(135deg,#ffe082,#ffb300);color:#1a1200;box-shadow:0 0 14px rgba(255,202,40,.4)}

<body>
<div class="nav"><h1 class="title">Catenary Curve<small>y = a·cosh(x / a)</small></h1><a class="back" href="/" aria-label="Back to home"><span aria-hidden="true">‹</span><span class="bl"> Back</span></a></div>
<div id="cv"></div><div id="css"></div>
<div class="bar" id="bt"></div><div class="bar" id="bb"></div>
<div id="gp" class="glass"><canvas id="gc"></canvas></div>

<div id="ul" class="pole-ui" onpointerdown="event.stopPropagation()"><span id="vl">15.0</span><div class="sw"><input type="range" id="sl" min="5" max="25" step="0.5" value="15"></div></div>
<div id="ur" class="pole-ui" onpointerdown="event.stopPropagation()"><span id="vr">12.0</span><div class="sw"><input type="range" id="sr" min="5" max="25" step="0.5" value="12"></div></div>

<div id="dock" class="glass"><button id="btn-derivation">Derivation</button><div class="hint">drag poles’ sliders · orbit to explore</div></div>

<div id="card" class="glass">
  <div class="k" id="ck"></div><h2 id="ct"></h2><div class="tabs" id="tabs" hidden><button data-t="0">Graph</button><button data-t="1">Exponential form</button></div>
  <div class="eq" id="ce"></div><div class="txt" id="cx"></div>
</div>
<div id="nav"><button id="bp" aria-label="Previous step">‹<span class="lb"> Prev</span></button><div class="dots" id="dots"></div><button id="bn" aria-label="Next step"><span class="lb">Next </span>›</button><button id="bx" aria-label="Exit">✕</button></div>

<script>
const cont=document.getElementById('cv');
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x051024,0.008);
const camera=new THREE.PerspectiveCamera(45,(innerWidth||1)/(innerHeight||1),0.1,1000);
const HOME_P=new THREE.Vector3(-15,15,30),HOME_T=new THREE.Vector3(0,5,0);
const homeF=()=>{const a=camera.aspect;return isFinite(a)&&a>0?Math.max(1,Math.min(2.6,1.3/a)):1};
function homeP(){return HOME_T.clone().addScaledVector(HOME_P.clone().sub(HOME_T),homeF())}
let lastF=homeF();
camera.position.copy(homeP());
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
cont.appendChild(renderer.domElement);
const cssR=new THREE.CSS3DRenderer();cssR.setSize(innerWidth,innerHeight);document.getElementById('css').appendChild(cssR.domElement);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.05;controls.maxPolarAngle=Math.PI/2-.05;controls.target.copy(HOME_T);

scene.add(new THREE.AmbientLight(0xffffff,.6));
const dl=new THREE.DirectionalLight(0x4dd0e1,.9);dl.position.set(10,20,10);scene.add(dl);
const fl=new THREE.DirectionalLight(0xffca28,.5);fl.position.set(-10,10,-10);scene.add(fl);

// environment
const grid=new THREE.GridHelper(80,80,0x2a5a8c,0x0d2744);grid.position.y=.01;grid.material.transparent=true;grid.material.opacity=.55;scene.add(grid);
(function(){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');
const g=x.createRadialGradient(128,128,0,128,128,128);g.addColorStop(0,'rgba(40,110,170,.55)');g.addColorStop(.5,'rgba(15,45,85,.35)');g.addColorStop(1,'rgba(3,10,22,0)');
x.fillStyle=g;x.fillRect(0,0,256,256);
const m=new THREE.Mesh(new THREE.PlaneGeometry(110,110),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));
m.rotation.x=-Math.PI/2;scene.add(m);
const n=500,p=new Float32Array(n*3);
for(let i=0;i<n;i++){const r=90+Math.random()*60,t=Math.random()*6.28,u=Math.random()*1.3;p[i*3]=r*Math.cos(t)*Math.cos(u);p[i*3+1]=r*Math.sin(u)+5;p[i*3+2]=r*Math.sin(t)*Math.cos(u)}
const gg=new THREE.BufferGeometry();gg.setAttribute('position',new THREE.BufferAttribute(p,3));
scene.add(new THREE.Points(gg,new THREE.PointsMaterial({color:0xbfe9ff,size:.9,fog:false,transparent:true,opacity:.8})))})();

function mkPole(x){
 const g=new THREE.Group();g.position.set(x,0,0);
 const wood=new THREE.MeshStandardMaterial({color:0x6b4a3a,roughness:.8,metalness:.1});
 const gold=new THREE.MeshStandardMaterial({color:0xffca28,roughness:.25,metalness:.85,emissive:0x2a1d00});
 const ins=new THREE.MeshStandardMaterial({color:0xeaf6ff,emissive:0x4dd0e1,emissiveIntensity:.6,roughness:.3});
 const b=new THREE.Mesh(new THREE.BoxGeometry(2.5,5,2.5),gold);b.position.y=2.5;g.add(b);
 const post=new THREE.Mesh(new THREE.CylinderGeometry(.3,.4,1,16),wood);g.add(post);
 const cb=new THREE.Group();cb.add(new THREE.Mesh(new THREE.BoxGeometry(4,.4,.4),wood));
 [-1.8,0,1.8].forEach(px=>{const i=new THREE.Mesh(new THREE.CylinderGeometry(.1,.15,.4,12),ins);i.position.set(px,.4,0);cb.add(i)});
 g.add(cb);
 return{group:g,set(h){const ph=Math.max(.1,h-5);post.scale.y=ph;post.position.y=5+ph/2;cb.position.y=h-.4}};
}
const LP=mkPole(-12.5),RP=mkPole(12.5);scene.add(LP.group,RP.group);
const lUI=new THREE.CSS3DObject(document.getElementById('ul'));lUI.scale.setScalar(.04);LP.group.add(lUI);
const rUI=new THREE.CSS3DObject(document.getElementById('ur'));rUI.scale.setScalar(.04);RP.group.add(rUI);

// catenary maths: y = a cosh((x-x0)/a)+c through (-12.5,h1),(12.5,h2), vertex kept above ground
function cat(h1,h2){
 for(let a=9;a<300;a+=.5){
  const s=Math.sinh(25/(2*a)),x0=-a*Math.asinh((h2-h1)/(2*a*s)),c=h1-a*Math.cosh((-12.5-x0)/a);
  if(c+a>=.5)return{a,x0,c,y:x=>a*Math.cosh((x-x0)/a)+c};
 }
}
let hL=15,hR=12,pts=[],cable=null,glow=null,glowK=0;
const cMat=new THREE.MeshBasicMaterial({color:0xffca28});
const gMat=new THREE.MeshBasicMaterial({color:0xffb300,transparent:true,opacity:.14,depthWrite:false,blending:THREE.AdditiveBlending});
function rebuild(){
 LP.set(hL);RP.set(hR);
 const f=cat(hL,hR);pts=[];
 for(let i=0;i<=100;i++){const x=-12.5+i*.25;pts.push(new THREE.Vector3(x,f.y(x),0))}
 const cu=new THREE.CatmullRomCurve3(pts);
 [cable,glow].forEach(m=>{if(m){m.geometry.dispose();scene.remove(m)}});
 cable=new THREE.Mesh(new THREE.TubeGeometry(cu,120,.15,8),cMat);
 glow=new THREE.Mesh(new THREE.TubeGeometry(cu,120,.5,8),gMat);
 scene.add(cable,glow);
}
rebuild();
const pulses=[];
for(let i=0;i<6;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.2,12,12),new THREE.MeshBasicMaterial({color:0xfff3c0}));m.userData.u=i/6;scene.add(m);pulses.push(m)}

const sl=document.getElementById('sl'),sr=document.getElementById('sr');
sl.oninput=e=>{hL=+e.target.value;vl.textContent=hL.toFixed(1);rebuild()};
sr.oninput=e=>{hR=+e.target.value;vr.textContent=hR.toFixed(1);rebuild()};

// ---------- cinematic derivation ----------
const $=id=>document.getElementById(id);
const r=String.raw,M=s=>r`\(\displaystyle ${s}\)`;
let D=null,labels=[],step=-1,tw=null,ht=null,active=false,tab=0;

function sprite(txt,color,pos){
 const el=document.createElement('div');el.className='lbl';el.textContent=txt;el.style.color=color;el.style.borderColor=color;el.style.opacity=0;
 const o=new THREE.CSS3DSprite(el);o.scale.setScalar(.03);o.position.copy(pos);o.visible=false;labels.push(el);return o;
}
function arrow(dir,org,len,col){const a=new THREE.ArrowHelper(dir.clone().normalize(),org,len,col,.7,.4);a.visible=false;return a}
function mkPoly(p){const g=new THREE.BufferGeometry();g.setFromPoints(p);const idx=[];for(let i=1;i<p.length-1;i++)idx.push(0,i,i+1);g.setIndex(idx);return g}
function bar(a,b,col,r){const d=b.clone().sub(a),L=d.length(),m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,L,6),new THREE.MeshBasicMaterial({color:col}));m.position.copy(a).add(b).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());return m}
function build(g){
 D=new THREE.Group();const it=D.userData.it={};
 const V=new THREE.Vector3(0,g.vy,0),xs=6,P=new THREE.Vector3(xs,g.f.y(xs),0);
 const sp=[];for(let i=0;i<=30;i++){const x=xs*i/30;sp.push(new THREE.Vector3(x,g.f.y(x),0))}
 it.seg=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(sp),40,.3,8),new THREE.MeshBasicMaterial({color:0x69f0ae}));
 const ball=(p,c)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(.2,16,16),new THREE.MeshBasicMaterial({color:c}));m.position.copy(p);return m};
 it.vp=ball(V,0x4dd0e1);it.pp=ball(P,0xff5c93);
 const Vf=3*Math.sinh(xs/g.a),T=new THREE.Vector3(3,Vf,0),mid=new THREE.Vector3(3,g.f.y(3),0);
