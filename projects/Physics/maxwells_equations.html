<script>
setTimeout(()=>document.body.classList.add('ready'),5000);
(()=>{
let ovOpen=false;const T=THREE,TAU=Math.PI*2,E=0xffb454,B=0x52d6ff,S=0xffe6f0;
const R=new T.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio||1,2));R.setClearColor(0,0);R.autoClear=false;
const gt=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),r=x.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.25,'rgba(255,255,255,.5)');r.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=r;x.fillRect(0,0,64,64);return new T.CanvasTexture(c)})();
const P=(n,c,s,o=1)=>{const g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(new Float32Array(n*3),3));const p=new T.Points(g,new T.PointsMaterial({color:c,size:s,map:gt,transparent:true,opacity:o,depthWrite:false,blending:T.AdditiveBlending}));p.frustumCulled=false;return p};
const L=(a,c,o)=>{const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(a,3));return new T.LineSegments(g,new T.LineBasicMaterial({color:c,transparent:true,opacity:o,blending:T.AdditiveBlending,depthWrite:false}))};
const ring=(r,y,n=96)=>{const a=[];for(let i=0;i<n;i++){const u=i/n*TAU,v=(i+1)/n*TAU;a.push(r*Math.cos(u),y,r*Math.sin(u),r*Math.cos(v),y,r*Math.sin(v))}return a};
const ball=(r,o)=>new T.LineSegments(new T.WireframeGeometry(new T.SphereGeometry(r,24,14)),new T.LineBasicMaterial({color:S,transparent:true,opacity:o,blending:T.AdditiveBlending,depthWrite:false}));
const disc=(r,y,c)=>{const d=new T.Mesh(new T.CircleGeometry(r,48),new T.MeshBasicMaterial({color:c,transparent:true,opacity:0,side:T.DoubleSide,depthWrite:false,blending:T.AdditiveBlending}));d.rotation.x=Math.PI/2;d.position.y=y;return d};
const mkpatch=(g,col)=>{const pp=P(1,col,.16,0),ln=L([0,0,0,0,0,0],col,0);g.add(pp,ln);return(x,y,z,nx,ny,nz,o)=>{pp.material.opacity=o;ln.material.opacity=o;let a=pp.geometry.attributes.position;a.setXYZ(0,x,y,z);a.needsUpdate=true;a=ln.geometry.attributes.position;a.setXYZ(0,x,y,z);a.setXYZ(1,x+nx,y+ny,z+nz);a.needsUpdate=true}};
const tx=s=>window.MathJax&&MathJax.tex2svg?MathJax.tex2svg(s).outerHTML:s;
const sprite=(txt,col,sz,badge)=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
 if(badge){x.beginPath();x.arc(64,64,52,0,TAU);x.fillStyle='rgba(4,6,13,.78)';x.fill();x.lineWidth=7;x.strokeStyle=col;x.shadowColor=col;x.shadowBlur=14;x.stroke()}
 x.font='700 '+(txt.length>1?48:badge?84:88)+'px Newsreader,Georgia,serif';x.textAlign='center';x.textBaseline='middle';x.fillStyle=col;x.shadowColor=col;x.shadowBlur=badge?4:10;x.fillText(txt,64,badge?68:70);
 const s=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c),transparent:true,depthTest:false,depthWrite:false}));s.scale.set(sz,sz,1);return s};
const tsp=(tex,col,h)=>{const s=new T.Sprite(new T.SpriteMaterial({transparent:true,opacity:0,depthTest:false,depthWrite:false}));s.visible=false;
 if(!(window.MathJax&&MathJax.tex2svg))return s;
 const sv=MathJax.tex2svg(tex).querySelector('svg'),vb=sv.getAttribute('viewBox').split(' ').map(Number),H=110,W=Math.max(8,Math.round(H*vb[2]/vb[3])),c=document.createElement('canvas');c.width=W+40;c.height=H+40;
 sv.setAttribute('width',W);sv.setAttribute('height',H);sv.setAttribute('xmlns','http://www.w3.org/2000/svg');sv.removeAttribute('style');
 const str=new XMLSerializer().serializeToString(sv).replace(/currentColor/g,col),map=new T.CanvasTexture(c),im=new Image();
 im.onload=()=>{const x=c.getContext('2d');x.shadowColor=col;x.shadowBlur=16;x.drawImage(im,20,20,W,H);map.needsUpdate=true};
 im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(str);
 s.material.map=map;s.material.needsUpdate=true;s.scale.set(h*c.width/c.height,h,1);return s};
const mkLabs=(g,sp)=>{const it=sp.map(([k,tex,col,h,a])=>{const s=tsp(tex,col,h);g.add(s);return[k,s,a]});return w=>it.forEach(([k,s,a])=>{const o=Math.min(1,w(k)*1.15);s.visible=o>.02;if(s.visible){s.material.opacity=o;const p=a();s.position.set(p[0],p[1],p[2])}})};
const cells=[...document.querySelectorAll('.cell')],scenes=[];
const mk=(i,build)=>{const s=new T.Scene(),g=new T.Group();g.position.y=.4;s.add(g);const cam=new T.PerspectiveCamera(42,1,.1,50);cam.position.set(0,.2,5.6);cam.lookAt(0,0,0);const o={el:cells[i],box:cells[i].querySelector('.eqs'),s,g,cam,act:new Set(),w:{}};o.wf=k=>o.w[k]||0;o.u=build(g);scenes.push(o)};

/* I — ∇·E = ρ/ε₀ */
mk(0,g=>{
 const N=56,d=[],seg=[];
 for(let i=0;i<N;i++){const y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),a=i*2.39996323;d.push([r*Math.cos(a),y,r*Math.sin(a)])}
 d.forEach(v=>seg.push(v[0]*.15,v[1]*.15,v[2]*.15,v[0]*1.6,v[1]*1.6,v[2]*1.6));
 const fl=L(seg,E,.22),gs=ball(1,.07),halo=P(1,E,1.5,.45),core=P(1,S,.5);g.add(fl,gs,halo,core);g.add(sprite('+','#ffd08a',.42,true));const pa=mkpatch(g,S);
 const k=4,p=P(N*k,E,.06);g.add(p);
 const dn=140,dp=P(dn,S,.04,0),db=[...Array(dn)].map(()=>{const u=Math.random()*TAU,v=Math.acos(2*Math.random()-1),r=.2+Math.cbrt(Math.random())*1.4;return[r*Math.sin(v)*Math.cos(u),r*Math.cos(v),r*Math.sin(v)*Math.sin(u)]});g.add(dp);
 let ph=0;
 return(t,dt,w)=>{
  fl.material.opacity=.22+.5*w('E');gs.material.opacity=.07+.25*w('div')+.5*w('sph')+.12*w('sph')*Math.sin(t*5);
  p.material.size=.06+.05*w('E')+.03*w('div')+.04*w('flux');
  {const u=t*.6,nx=Math.cos(u)*.8,ny=Math.sin(u*.7)*.6,nz=Math.sin(u)*.8,nl=Math.hypot(nx,ny,nz);pa(nx/nl,ny/nl,nz/nl,nx/nl*.4,ny/nl*.4,nz/nl*.4,.95*w('dA'))}
  core.material.size=.5+.6*w('rho')+.1*w('rho')*Math.sin(t*5);halo.material.size=1.5+1.6*w('rho');halo.material.opacity=.45+.4*w('rho');
  dp.material.opacity=.7*w('eps0');
  ph+=dt*(.22+.3*w('div'));
  let a=p.geometry.attributes.position,j=0;
  for(let i=0;i<N;i++)for(let m=0;m<k;m++){const r=.15+((ph+m/k+i*.137)%1)*1.45;a.setXYZ(j++,d[i][0]*r,d[i][1]*r,d[i][2]*r)}a.needsUpdate=true;
  a=dp.geometry.attributes.position;db.forEach((v,i)=>a.setXYZ(i,v[0]+.05*Math.sin(t*.7+i),v[1]+.05*Math.cos(t*.6+i*1.3),v[2]+.05*Math.sin(t*.5+i*.7)));a.needsUpdate=true}
});

/* II — ∇·B = 0 */
mk(1,g=>{
 const Ls=[.5,.85,1.2,1.55],nf=12,lp=[],seg=[];
 const pt=(l,th,ph)=>{const r=l*Math.sin(th)**2;return[r*Math.sin(th)*Math.cos(ph),r*Math.cos(th),r*Math.sin(th)*Math.sin(ph)]};
 Ls.forEach(l=>{for(let f=0;f<nf;f++){const ph=f/nf*TAU+l;lp.push([l,ph]);let q=pt(l,.001,ph);for(let i=1;i<=60;i++){const n=pt(l,i/60*Math.PI,ph);seg.push(...q,...n);q=n}}});
 const ll=L(seg,B,.2),sp=ball(.8,.04),k=3,p=P(lp.length*k,B,.055);g.add(ll,sp,P(1,B,1.2,.4),p);const pa=mkpatch(g,S);
 return(t,dt,w)=>{
  ll.material.opacity=.2+.5*w('B');p.material.size=.055+.05*w('B');
  sp.material.opacity=.04+.4*w('sph')+.15*w('sph')*Math.sin(t*4);
  {const u=t*.6,nx=Math.cos(u)*.8,ny=Math.sin(u*.7)*.6,nz=Math.sin(u)*.8,nl=Math.hypot(nx,ny,nz);pa(nx/nl*.8,ny/nl*.8,nz/nl*.8,nx/nl*.4,ny/nl*.4,nz/nl*.4,.95*w('dA'))}
  const a=p.geometry.attributes.position;let j=0;
  lp.forEach(([l,ph],i)=>{for(let m=0;m<k;m++){const f=(t*.1+m/k+i*.071)%1;a.setXYZ(j++,...pt(l,Math.PI*(1-f),ph))}});
  a.needsUpdate=true}
});

/* III — ∇×E = −∂B/∂t */
mk(2,g=>{
 const ys=[-.8,0,.8],rs=[.6,1,1.4],n=22,seg=[];
 ys.forEach(y=>rs.forEach(r=>seg.push(...ring(r,y))));
 const rl=L(seg,E,.14),lq=L(ring(1,0),E,0),sd=disc(1,0,B),pa=mkpatch(g,E);
 const col=[];for(let i=0;i<8;i++){const a=i/8*TAU,x=.28*Math.cos(a),z=.28*Math.sin(a);col.push(x,-1.5,z,x,1.5,z)}
 const cl=L(col,B,.2),bp=P(60,B,.06),ep=P(ys.length*rs.length*n,E,.06);g.add(rl,lq,sd,cl,bp,ep);
 const mg=new T.Group(),mm=(c,y)=>{const m=new T.Mesh(new T.BoxGeometry(.34,.5,.34),new T.MeshBasicMaterial({color:c,transparent:true,opacity:.5,side:T.DoubleSide,depthWrite:false,blending:T.AdditiveBlending}));m.position.y=y;return m};mg.add(mm(0xff7a9a,.25),mm(0x6fa8ff,-.25));g.add(mg);
 const bs=[...Array(60)].map(()=>({a:Math.random()*TAU,r:Math.sqrt(Math.random())*.28,y:Math.random()*3-1.5}));
 const es=[];ys.forEach(y=>rs.forEach(r=>{for(let m=0;m<n;m++)es.push({y,r,a:m/n*TAU})}));let ang=0;
 return(t,dt,w)=>{const c=Math.cos(t*.9),s=Math.sin(t*.9);mg.position.y=-1.15+.55*s;
  rl.material.opacity=.06+.22*Math.abs(c)+.45*w('ring');lq.material.opacity=.9*w('lp');sd.material.opacity=.22*w('disc')+.06*w('disc')*Math.sin(t*4);ang+=c*dt*1.1;pa(Math.cos(ang),0,Math.sin(ang),-Math.sin(ang)*.35,0,Math.cos(ang)*.35,.95*w('dl'));
  cl.material.opacity=.08+.3*Math.abs(s)*(1+1.5*w('pulse'))+.35*w('col');
  ep.material.size=.06+.05*w('ep');bp.material.size=.06+.05*w('bp')+.03*w('pulse');
  let a=bp.geometry.attributes.position;
  bs.forEach((o,i)=>{o.y+=s*dt*.9;if(o.y>1.5)o.y-=3;if(o.y<-1.5)o.y+=3;a.setXYZ(i,o.r*Math.cos(o.a),o.y,o.r*Math.sin(o.a))});a.needsUpdate=true;
  a=ep.geometry.attributes.position;
  es.forEach((o,i)=>{o.a+=c*dt*1.1;a.setXYZ(i,o.r*Math.cos(o.a),o.y,o.r*Math.sin(o.a))});a.needsUpdate=true}
});

/* IV — ∇×B = μ₀J + μ₀ε₀ ∂E/∂t */
mk(3,g=>{
 const wire=L([0,-1.75,0,0,-.55,0,0,.55,0,0,1.75,0],S,.55),pl=[],ds=[];g.add(wire);
 [-.55,.55].forEach(y=>{const r=L(ring(.95,y,72),S,.45);pl.push(r);const d=new T.Mesh(new T.CircleGeometry(.95,48),new T.MeshBasicMaterial({color:S,transparent:true,opacity:.05,side:T.DoubleSide,depthWrite:false,blending:T.AdditiveBlending}));d.rotation.x=Math.PI/2;d.position.y=y;ds.push(d);g.add(r,d)});
 const rg=[[-1.2,.45],[-1.2,.8],[0,1.25],[0,.85],[1.2,.45],[1.2,.8]],m=20,seg=[];
 rg.forEach(([y,r])=>seg.push(...ring(r,y)));
 const bl=L(seg,B,.2),bp=P(rg.length*m,B,.06),jp=P(36,S,.07),ep=P(48,E,.06),rI=L(ring(.8,-1.2),B,0),rE=L(ring(.85,0),B,0),dI=disc(.8,-1.2,S),dE=disc(.85,0,E);g.add(bl,bp,jp,ep,rI,rE,dI,dE);
 const es=[...Array(48)].map(()=>({u:Math.random(),a:Math.random()*TAU,r:Math.sqrt(Math.random())*.8}));
 return(t,dt,w)=>{
  bl.material.opacity=.2+.5*w('bring');bp.material.size=.06+.05*w('bp')+.03*w('bring');jp.material.size=.07+.05*w('jp');ep.material.size=.06+.05*w('ep');
  wire.material.opacity=.55+.4*w('jp')+.4*w('wire');rI.material.opacity=.9*w('rimI');rE.material.opacity=.9*w('rimE');dI.material.opacity=.2*w('diskI');dE.material.opacity=.2*w('diskE');pl.forEach(r=>r.material.opacity=.45+.45*w('plates'));ds.forEach(d=>d.material.opacity=.05+.2*w('plates'));
  let a=bp.geometry.attributes.position,j=0;
  rg.forEach(([y,r])=>{for(let i=0;i<m;i++){const q=-t*.9+i/m*TAU;a.setXYZ(j++,r*Math.cos(q),y,r*Math.sin(q))}});a.needsUpdate=true;
  a=jp.geometry.attributes.position;
  for(let i=0;i<36;i++){const f=(t*.3+(i%18)/18)%1;a.setXYZ(i,0,i<18?-1.75+f*1.2:.55+f*1.2,0)}a.needsUpdate=true;
  a=ep.geometry.attributes.position;
  es.forEach((o,i)=>a.setXYZ(i,o.r*Math.cos(o.a),-.55+((t*.25+o.u)%1)*1.1,o.r*Math.sin(o.a)));a.needsUpdate=true}
});

/* detailed explanations for the expanded view, same keys as DEF.
   mo(meaning, inTheScene, keyRelation): text may contain $inline math$ and **bold**; keyRelation is display LaTeX */
const rw=String.raw,mo=(m,s,f)=>({m,s,f});
const MORE=[{
 div:mo(rw`The divergence $\nabla\!\cdot$ asks, at one point: **is the field spreading out from here, or converging into here?** It totals the field leaving a tiny box around the point, per unit volume. Positive means a **source** (field lines begin), negative a **sink** (lines end), zero means lines simply pass through.`,
  rw`Field lines start on the amber positive charges and end on the cyan negative ones. The label $\nabla\!\cdot\mathbf E>0$ marks a spot where lines begin; in empty space between the charges the lines just flow through.`,
  rw`\nabla\!\cdot\mathbf E=\frac{\partial E_x}{\partial x}+\frac{\partial E_y}{\partial y}+\frac{\partial E_z}{\partial z}`),
 E:mo(rw`A vector at every point giving the **force per unit charge**: the push a +1 C test charge would feel. Its direction is the way a positive charge would be pushed and its length is the strength. A point charge makes a field that falls off as $1/r^2$.`,
  rw`The amber lines are $\mathbf E$. Each one leaves a positive charge and ends on a negative one; where lines crowd together the field is stronger.`,
  rw`\mathbf F=q\,\mathbf E,\qquad \mathbf E=\frac{1}{4\pi\varepsilon_0}\frac{q}{r^2}\,\hat{\mathbf r}`),
 eq:mo(rw`The equals sign is the physics. How much the field spreads out at a point is **not independent**: it is fixed entirely by the charge density right there. Charge here means spreading here; no charge means no net spreading, whatever happens elsewhere.`,
  rw`Lines begin only inside the charge clouds. Between the clouds, as many lines enter any small region as leave it, so the divergence there is zero.`),
 rho:mo(rw`**Charge per unit volume** at a point. A diffuse cloud has a $\rho$ that varies from place to place, while a point charge is an infinitely sharp spike. Positive $\rho$ is a source of field lines and negative $\rho$ a sink. Adding up $\rho$ over a region gives the total charge in it.`,
  rw`The glowing dust around each charge is $\rho$: denser, brighter dust means more charge in that volume.`,
  rw`Q_{\mathrm{enc}}=\int_V\rho\,dV`),
 eps0:mo(rw`A constant of nature that sets **how strongly charge produces field** in empty space. Its small value means even a little charge makes a large field. It also ties electricity to light through $c^2=1/(\mu_0\varepsilon_0)$.`,
  rw`It is the scale factor between charge and flux, so it does not move. The scene uses units where $1/4\pi\varepsilon_0=1$, so a charge $q$ sends out $4\pi q$ units of flux.`,
  rw`\frac{1}{4\pi\varepsilon_0}\approx 8.99\times10^{9}\ \mathrm{N\,m^2/C^2}`),
 thm:mo(rw`Add up the tiny local outflows $\nabla\!\cdot\mathbf E$ throughout a volume and you get exactly the **total field passing out through its skin**. That is why the local law (a statement at each point) and the global law (a statement about a whole surface) are the same law.`,
  rw`The left side lives inside the lumpy surface $S$ and the right side on its skin. The surface glows amber where field leaves and cyan where it enters.`,
  rw`\int_V(\nabla\!\cdot\mathbf E)\,dV=\oint_S\mathbf E\cdot d\mathbf A`),
 oint:mo(rw`The circle on the integral sign says $S$ is a **closed surface**, with a clear inside and outside, like a balloon. Cut $S$ into small patches, work out $\mathbf E\cdot d\mathbf A$ for each one, and add them all up.`,
  rw`$S$ can be any shape. An outside charge orbits it: watch the amber exit points and cyan entry points shift, while their net stays tied to what is inside.`,
  rw`\oint_S\mathbf E\cdot d\mathbf A\approx\sum_{\text{patches}}\mathbf E\cdot\Delta\mathbf A`),
 dot:mo(rw`The dot product keeps only the part of $\mathbf E$ that points **through** the patch: $E\,dA\cos\theta$. Field sliding along the surface ($\theta=90^\circ$) contributes nothing. Going out counts as positive and coming in as negative.`,
  rw`On each sampled patch the white arrow is $d\mathbf A$, the amber arrow is $\mathbf E$, and the pale arrow is the piece of $\mathbf E$ along $d\mathbf A$: the part that counts.`,
  rw`\mathbf E\cdot d\mathbf A=E\,dA\cos\theta`),
 dA:mo(rw`A tiny patch of the surface written as a **vector**: its length is the patch's area and its direction is the outward normal, perpendicular to the surface and pointing away from the inside. One symbol carries both size and orientation.`,
  rw`The short white arrows on $S$ are $d\mathbf A$. They always point outward, however the surface bends.`,
  rw`d\mathbf A=\hat{\mathbf n}\,dA`),
 eq2:mo(rw`Total flux out of $S$ equals the **enclosed charge divided by $\varepsilon_0$**, and nothing else matters. A charge outside $S$, however strong, sends as much flux in as out, so it cancels. Reshape $S$ as you like: the answer changes only when a charge crosses the surface.`,
  rw`Amber dots mark where lines exit $S$ and cyan dots where they enter. The net exit count follows the charge inside, while the orbiting outside charge adds equal exits and entries.`,
  rw`\oint_S\mathbf E\cdot d\mathbf A=\frac{Q_{\mathrm{enc}}}{\varepsilon_0}`),
 Q:mo(rw`The sum of every charge strictly **inside** $S$: positives add and negatives subtract. Charges outside contribute nothing to the net flux, even if they sit right beside the surface.`,
  rw`Several positive and negative charges sit inside $S$ and their net sets the flux. The two charges outside are ignored.`,
  rw`Q_{\mathrm{enc}}=\sum_{\text{inside}}q_i=\int_V\rho\,dV`)
},{
 div:mo(rw`The same divergence operation, now applied to $\mathbf B$: do magnetic field lines **start or end** at this point? For $\mathbf B$ the answer is always no.`,
  rw`Every line in the scene is a closed loop: through the magnet, out of one end, round the outside and back in. None begins or ends, so the divergence is zero everywhere.`,
  rw`\nabla\!\cdot\mathbf B=\frac{\partial B_x}{\partial x}+\frac{\partial B_y}{\partial y}+\frac{\partial B_z}{\partial z}=0`),
 B:mo(rw`The magnetic field bends moving charges and turns compass needles. The force $q\mathbf v\times\mathbf B$ is always sideways to the motion, so it **steers but never speeds up** a charge. It is measured in tesla (T).`,
  rw`The lines are the field of a bar magnet, modeled as a stack of current loops so that it is exactly divergence-free. The iron filings behind it line up along $\mathbf B$.`,
  rw`\mathbf F=q\,\mathbf v\times\mathbf B`),
 eq:mo(rw`No point in space is a source or a sink of $\mathbf B$. Compare Gauss's law for $\mathbf E$, where the right side is the charge density $\rho/\varepsilon_0$: here there is no magnetic charge to put there.`,
  rw`Lines of $\mathbf E$ begin and end on charges. Lines of $\mathbf B$ never begin or end.`),
 zero:mo(rw`The right side is exactly $0$ because **no magnetic monopole** (an isolated N or S pole) has ever been found. Cut a magnet in half and you get two smaller magnets, each with both poles. A discovered monopole would turn this $0$ into a magnetic charge density.`,
  rw`The N and S ends of the magnet are not sources. Inside the magnet the lines run from S to N, then close their loops outside.`),
 thm:mo(rw`If $\nabla\!\cdot\mathbf B=0$ at every point inside a volume, the **total flux through its skin must be zero** too. The local statement (no sources) and the global statement (flux in equals flux out) are one and the same.`,
  rw`The lumpy surface $S$ wraps one end of the magnet. It glows pink where $\mathbf B$ leaves and cyan where $\mathbf B$ enters.`,
  rw`\int_V(\nabla\!\cdot\mathbf B)\,dV=\oint_S\mathbf B\cdot d\mathbf A=0`),
 oint:mo(rw`Add $\mathbf B\cdot d\mathbf A$ over every patch of a **closed** surface. Because field lines form closed loops, whatever flux leaves through one part of $S$ must come back in through another.`,
  rw`Pink dots show where lines leave $S$ and cyan dots where they re-enter. Every line that leaves has to return.`,
  rw`\oint_S\mathbf B\cdot d\mathbf A\approx\sum_{\text{patches}}\mathbf B\cdot\Delta\mathbf A`),
 dot:mo(rw`Only the part of $\mathbf B$ that points **through** the patch counts: $B\,dA\cos\theta$. Field running along the surface adds nothing. Out is positive and in is negative.`,
  rw`On each sampled patch the white arrow is $d\mathbf A$, the cyan arrow is $\mathbf B$, and the pink arrow is the part of $\mathbf B$ along $d\mathbf A$.`,
  rw`\mathbf B\cdot d\mathbf A=B\,dA\cos\theta`),
 dA:mo(rw`A tiny patch of the surface written as a **vector**: its length is the patch's area and its direction is the outward normal, pointing away from the inside.`,
  rw`The short white arrows on $S$ are $d\mathbf A$, all pointing outward.`,
  rw`d\mathbf A=\hat{\mathbf n}\,dA`),
 eq2:mo(rw`Flux in equals flux out for **any** closed surface: around the N pole, around the S pole, around the whole magnet, or in empty space. It is the statement that field lines have no loose ends.`,
  rw`Lines cross $S$ in both directions: some leave around the magnet's end and others come back in. The totals always balance.`,
  rw`\oint_S\mathbf B\cdot d\mathbf A=0`)
},{
 curl:mo(rw`Curl measures how much a field **swirls** around a point. Picture a tiny paddle wheel placed there: if the field pushes harder on one side than the other, the wheel spins. Here it asks whether $\mathbf E$ circulates, and the equation says it does exactly when $\mathbf B$ is changing.`,
  rw`The small paddle wheels spin because $\mathbf E$ circulates around the magnet's axis. Their spin direction flips when the magnet reverses, because $\mathbf B$ switches from rising to falling.`,
  rw`(\nabla\times\mathbf E)_z=\frac{\partial E_y}{\partial x}-\frac{\partial E_x}{\partial y}`),
 E:mo(rw`This $\mathbf E$ is not like the field of static charges. It forms **closed loops** around the changing $\mathbf B$, and it is what pushes current round a wire loop that has no battery. It exerts the usual force $q\mathbf E$ on charges.`,
  rw`The amber arrows circle the magnet's axis, growing with distance from it near the middle and fading like $1/r$ far outside.`,
  rw`\mathbf F=q\,\mathbf E\quad\text{with}\quad\oint\mathbf E\cdot d\mathbf l\neq0`),
 eq:mo(rw`The swirl of $\mathbf E$ at a point equals the **rate of change** of $\mathbf B$ there, with a minus sign. A steady magnet, however strong, induces nothing: only change does.`,
  rw`$\mathbf E$ is strongest mid-stroke, when the magnet moves fastest and $\mathbf B$ changes fastest. It vanishes at the ends of the stroke, where the magnet momentarily stops.`),
 minus:mo(rw`The minus sign is **Lenz's law**: the induced field drives a current whose own magnetic field opposes the change that caused it. If $\mathbf B$ is growing upward, the induced current tries to make a field pointing downward. Without the sign, energy conservation would fail.`,
  rw`When the magnet moves toward the loop the amber arrows circulate one way, and when it moves away they reverse. Each time they oppose the change.`),
 partial:mo(rw`$\partial\mathbf B/\partial t$ means: stand still at one spot and ask **how fast $\mathbf B$ is changing in time** there. The curly $\partial$ signals that $\mathbf B$ also depends on position, but only time is being varied.`,
  rw`The cyan field lines travel with the magnet, so the field at the loop swells as it approaches and fades as it leaves. $\partial\mathbf B/\partial t$ is how quickly that strength is changing at any instant.`,
  rw`\frac{\partial\mathbf B}{\partial t}=\lim_{\Delta t\to0}\frac{\mathbf B(t+\Delta t)-\mathbf B(t)}{\Delta t}`),
 B:mo(rw`The magnetic field threading the loop. It is made by the bar magnet (pink N pole, blue S pole), runs along the axis, and is strong near the magnet and weak far from it.`,
  rw`Cyan lines run through the magnet and loop back round the outside. They travel with it, so the field through the loop swells and fades as the magnet moves.`),
 t:mo(rw`Faraday's law links $\mathbf E$ at one moment to how $\mathbf B$ is changing at that same moment. The magnet here swings smoothly toward the loop and back, so $\mathbf B$ at the loop rises, peaks, falls and rises again in a regular cycle.`,
  rw`By default the magnet makes one round trip every two seconds (0.5 Hz).`),
 thm:mo(rw`Zoom out from many tiny paddle wheels to one big loop: the swirls inside **cancel in pairs**, leaving only the circulation round the edge. So the total curl over a surface $S$ equals the circulation of the field round its boundary $C$.`,
  rw`The gold ring is the loop $C$, and the faint cyan disc inside it is the surface $S$ that it bounds.`,
  rw`\int_S(\nabla\times\mathbf E)\cdot d\mathbf A=\oint_C\mathbf E\cdot d\mathbf l`),
 ointC:mo(rw`Walk once round the loop $C$ and, at each step, add the part of $\mathbf E$ pointing along your direction of travel. A non-zero total means $\mathbf E$ pushes charge around the loop: an **electromotive force** (EMF), measured in volts.`,
  rw`The amber bulb on the ring glows brighter as the loop voltage grows, and amber dots drift round the ring as current.`,
  rw`\mathcal E=\oint_C\mathbf E\cdot d\mathbf l`),
 dot:mo(rw`The dot product appears twice. On the left, $\mathbf E\cdot d\mathbf l$ keeps the part of $\mathbf E$ **along** the path; on the right, $\mathbf B\cdot d\mathbf A$ keeps the part of $\mathbf B$ **through** the surface.`,
  rw`The induced $\mathbf E$ is tangent to the ring, so every step along $C$ counts in full, while $\mathbf B$ runs straight through the disc.`,
  rw`\mathbf E\cdot d\mathbf l=E\,dl\cos\theta\qquad \mathbf B\cdot d\mathbf A=B\,dA\cos\theta`),
 dl:mo(rw`A tiny step along $C$, written as a vector pointing the way you walk. Its direction also fixes $d\mathbf A$ by the **right-hand rule**: curl your fingers along $C$ and your thumb points along the positive normal.`,
  rw`The white arrows on the ring are $d\mathbf l$.`,
  rw`d\mathbf l=\hat{\mathbf t}\,dl`),
 eq2:mo(rw`Loop voltage equals minus the rate of change of the **magnetic flux** through the loop. This is Faraday's law of induction, the principle behind generators, transformers and induction cooktops.`,
  rw`The faster the flux changes, the brighter the bulb. When the magnet turns around the flux is momentarily steady and the bulb dims.`,
  rw`\mathcal E=\oint_C\mathbf E\cdot d\mathbf l=-\frac{d\Phi_B}{dt}`),
 ddt:mo(rw`The rate of change of the total flux. It is written $d/dt$ rather than $\partial/\partial t$ because once you integrate over the surface the dependence on position is gone. Moving or reshaping the loop would change the flux too, and this covers that as well.`,
  rw`Here the loop's area is fixed, so only the strength of $\mathbf B$ makes the flux change.`,
  rw`\frac{d\Phi_B}{dt}`),
 intS:mo(rw`Add $\mathbf B\cdot d\mathbf A$ over the open disc $S$ spanned by the loop to get the **magnetic flux** $\Phi_B$: a count of how many field lines thread the loop. Its unit is the weber (1 Wb = 1 T$\cdot$m$^2$).`,
  rw`The cyan disc inside the ring is $S$. The magnet's field lines pass through it, more of them when the magnet is close.`,
  rw`\Phi_B=\int_S\mathbf B\cdot d\mathbf A=BA\quad(\mathbf B\perp\text{loop, uniform})`),
 dA:mo(rw`A tiny patch of the open surface $S$, written as a vector along its normal. Which of the two normals counts as positive is decided by the right-hand rule, using the direction of $C$.`,
  rw`The white arrows on the disc are $d\mathbf A$, all pointing up.`,
  rw`d\mathbf A=\hat{\mathbf n}\,dA`)
},{
 curl:mo(rw`Does $\mathbf B$ **circulate** around this point? Ampère found that it circulates around an electric current. Maxwell added a second cause: a **changing electric field** also makes $\mathbf B$ circulate.`,
  rw`Cyan rings circle the wire and also circle through the gap between the plates, where there is no wire.`,
  rw`\nabla\times\mathbf B=\mu_0\Big(\mathbf J+\varepsilon_0\frac{\partial\mathbf E}{\partial t}\Big)`),
 B:mo(rw`The magnetic field circling the current. Outside a thin wire it falls off as $1/r$. In the gap between the plates it grows with radius out to the plate edge and then falls as $1/r$.`,
  rw`The cyan arrows ring the wire and the gap, and they reverse together as the AC current reverses.`,
  rw`B=\frac{\mu_0 I}{2\pi r}\quad(\text{long straight wire})`),
 eq:mo(rw`Two independent sources of circulating $\mathbf B$ **add together**: the conduction current of charges flowing in a wire, and the displacement current of a changing electric field. Either one alone is enough to make $\mathbf B$ swirl.`,
  rw`In the wire only $\mathbf J$ is present. In the gap no charge flows, but $\mathbf E$ is changing, and $\mathbf B$ circulates all the same.`),
 mu0:mo(rw`A constant setting **how strongly current produces magnetic field** in vacuum, the magnetic counterpart of $\varepsilon_0$. Together they fix the speed of light, which is why light is an electromagnetic wave.`,
  rw`It is a scale factor, so nothing animates. It multiplies both the pink current term and the amber changing-field term.`,

const DER=[
{t:'s',pid:'start',b:'Start',k:'E B',h:'Start from Maxwell in empty space',m:rw`Far from any charge or current, set $\rho=0$ and $\mathbf J=0$. Four laws remain. The last two form a loop: the curl of E is fed by the change of B, and the curl of B by the change of E. To isolate one field, curl its own law, then let the other law turn the curl into a time derivative.`,f:rw`\begin{aligned}\nabla\!\cdot\mathbf E&=0&\nabla\!\times\mathbf E&=-\frac{\partial\mathbf B}{\partial t}\\[4pt]\nabla\!\cdot\mathbf B&=0&\nabla\!\times\mathbf B&=\mu_0\varepsilon_0\frac{\partial\mathbf E}{\partial t}\end{aligned}`,i:rw`Faraday and Ampère–Maxwell swap one field for the other (E1, E3, B1, B3). The two Gauss laws each remove one term (E5, B5).`},
{t:'e',pid:'e',b:'E1',k:'E lE',h:'Take the curl of Faraday’s law',m:rw`Both sides of $\nabla\!\times\mathbf E=-\partial_t\mathbf B$ are vectors at every point, so we may apply the same operation to both. Apply the curl again.`,f:rw`\nabla\!\times(\nabla\!\times\mathbf E)=\nabla\!\times\Big(-\frac{\partial\mathbf B}{\partial t}\Big)`,i:rw`Two curls in a row give **two space derivatives of E**, which is exactly what $\nabla^2\mathbf E$ is made of. On the right the curl of B now appears, and Ampère–Maxwell can rewrite that in terms of E. One move prepares both sides.`},
{t:'e',pid:'e',b:'E2',k:'E B',h:'Swap space and time derivatives',m:rw`For smooth fields the order of differentiation does not matter, so $\partial/\partial t$ comes out of the curl and takes the minus sign with it.`,f:rw`\nabla\!\times\Big(-\frac{\partial\mathbf B}{\partial t}\Big)=-\frac{\partial}{\partial t}\big(\nabla\!\times\mathbf B\big)`,v:['Check in components',rw`Take the x-component. The middle step swaps $\partial_y\partial_t$ for $\partial_t\partial_y$ (mixed partial derivatives are equal). The y and z components work the same way.`,rw`[\nabla\!\times\partial_t\mathbf B]_x=\partial_y\partial_tB_z-\partial_z\partial_tB_y=\partial_t\big(\partial_yB_z-\partial_zB_y\big)=\partial_t(\nabla\!\times\mathbf B)_x`],i:rw`It makes no difference whether you first see how B curls and then how fast that curl changes, or first see how fast B changes and then take its curl. Space derivatives only look at space, the time derivative only at time.`},
{t:'e',pid:'e',b:'E3',k:'E B pr',h:'Insert Ampère–Maxwell',m:rw`In empty space $\nabla\!\times\mathbf B=\mu_0\varepsilon_0\,\partial_t\mathbf E$. Substitute it, and take the constants out of the time derivative.`,f:rw`\begin{aligned}\nabla\!\times(\nabla\!\times\mathbf E)&=-\frac{\partial}{\partial t}\Big(\mu_0\varepsilon_0\frac{\partial\mathbf E}{\partial t}\Big)\\&=-\mu_0\varepsilon_0\frac{\partial^2\mathbf E}{\partial t^2}\end{aligned}`,i:rw`B has now vanished from the story. It was only a go-between: changing B makes E (Faraday), changing E makes B (Ampère–Maxwell), and one trip round the loop returns E’s own second time derivative. Maxwell’s displacement-current term is essential here: without it $\nabla\!\times\mathbf B$ would be zero in empty space and there would be no wave.`},
{t:'e',pid:'e',b:'E4',k:'E lam',h:'Expand the curl of a curl',m:rw`Use the vector identity below, valid for any smooth vector field, with $\mathbf A=\mathbf E$.`,f:rw`\nabla\!\times(\nabla\!\times\mathbf E)=\nabla(\nabla\!\cdot\mathbf E)-\nabla^{2}\mathbf E`,v:['Proof of the identity, x-component',rw`Expand each curl, regroup (mixed partials commute again), then add and subtract $\partial_x^2A_x$. The y and z components follow by symmetry.`,rw`\begin{aligned}[\nabla\!\times(\nabla\!\times\mathbf A)]_x&=\partial_y(\partial_xA_y-\partial_yA_x)-\partial_z(\partial_zA_x-\partial_xA_z)\\&=\partial_x(\partial_yA_y+\partial_zA_z)-(\partial_y^{2}+\partial_z^{2})A_x\\&=\partial_x(\partial_xA_x+\partial_yA_y+\partial_zA_z)-(\partial_x^{2}+\partial_y^{2}+\partial_z^{2})A_x\\&=\partial_x(\nabla\!\cdot\mathbf A)-\nabla^{2}A_x\end{aligned}`],i:rw`The Laplacian $\nabla^2$ adds up the curvature of a field in every direction: negative at a crest, positive in a trough. The identity splits a double swirl into a fan-out part, $\nabla(\nabla\!\cdot\mathbf E)$, and a pure curvature part.`},
{t:'e',pid:'e',b:'E5',k:'E lam',h:'Use Gauss’s law',m:rw`Gauss’s law gives $\nabla\!\cdot\mathbf E=0$ in empty space, so the gradient of it is zero too.`,f:rw`\nabla\!\times(\nabla\!\times\mathbf E)=\nabla(\underbrace{\nabla\!\cdot\mathbf E}_{0})-\nabla^{2}\mathbf E=-\nabla^{2}\mathbf E`,i:rw`With no charges, E has no sources or sinks, so all of its variation is swirl. For a pure swirl the curl of the curl is just minus the curvature. This same fact later forces E to be transverse.`},
{t:'e',pid:'e',b:'E6',k:'E pr lam',h:'Set the two results equal',m:rw`E3 and E5 are two expressions for $\nabla\!\times(\nabla\!\times\mathbf E)$. Equate them and cancel the common minus sign.`,key:1,f:rw`\begin{aligned}-\nabla^{2}\mathbf E&=-\mu_0\varepsilon_0\frac{\partial^2\mathbf E}{\partial t^2}\\[6pt]\boxed{\;\nabla^{2}\mathbf E=\mu_0\varepsilon_0\frac{\partial^2\mathbf E}{\partial t^2}\;}\end{aligned}`,i:rw`Read it as a sentence: how E bends in space equals how E accelerates in time, with $\mu_0\varepsilon_0$ as the exchange rate. At a crest the curvature is negative, so the acceleration points down: each point is pulled back toward zero by its neighbours, like a mass on a spring. The two minus signs (Lenz’s law and the identity) cancel. Had only one flipped, disturbances would grow exponentially instead of travelling.`},
{t:'b',pid:'b',b:'B1',k:'B lB',h:'Take the curl of Ampère–Maxwell',m:rw`Apply the curl to both sides of $\nabla\!\times\mathbf B=\mu_0\varepsilon_0\,\partial_t\mathbf E$.`,f:rw`\nabla\!\times(\nabla\!\times\mathbf B)=\nabla\!\times\Big(\mu_0\varepsilon_0\frac{\partial\mathbf E}{\partial t}\Big)`,i:rw`Same idea as E1 with the roles swapped: a double space derivative of B on the left, and on the right the curl of E, which Faraday’s law can rewrite in terms of B.`},
{t:'b',pid:'b',b:'B2',k:'E B',h:'Swap space and time derivatives',m:rw`The constants and $\partial/\partial t$ come out of the curl, for the same reason as in E2.`,f:rw`\nabla\!\times\Big(\mu_0\varepsilon_0\frac{\partial\mathbf E}{\partial t}\Big)=\mu_0\varepsilon_0\frac{\partial}{\partial t}\big(\nabla\!\times\mathbf E\big)`,i:rw`Space and time derivatives commute, so “how E curls, then how fast” equals “how fast, then how E curls”.`},
{t:'b',pid:'b',b:'B3',k:'E B pr',h:'Insert Faraday’s law',m:rw`Replace $\nabla\!\times\mathbf E$ by $-\partial_t\mathbf B$.`,f:rw`\begin{aligned}\nabla\!\times(\nabla\!\times\mathbf B)&=\mu_0\varepsilon_0\frac{\partial}{\partial t}\Big(-\frac{\partial\mathbf B}{\partial t}\Big)\\&=-\mu_0\varepsilon_0\frac{\partial^2\mathbf B}{\partial t^2}\end{aligned}`,i:rw`The loop closes the other way round: now E is the go-between and B’s own second time derivative returns. The minus sign again comes from Lenz’s law, which is why both fields end up with the same sign.`},
{t:'b',pid:'b',b:'B4',k:'B lam',h:'Expand the curl of a curl',m:rw`The identity proved in E4 holds for every smooth vector field, so it holds for $\mathbf B$.`,f:rw`\nabla\!\times(\nabla\!\times\mathbf B)=\nabla(\nabla\!\cdot\mathbf B)-\nabla^{2}\mathbf B`,i:rw`The same split into a fan-out part and a curvature part.`},
{t:'b',pid:'b',b:'B5',k:'B lam',h:'Use Gauss’s law for magnetism',m:rw`$\nabla\!\cdot\mathbf B=0$, so the gradient term vanishes.`,f:rw`\nabla\!\times(\nabla\!\times\mathbf B)=\nabla(\underbrace{\nabla\!\cdot\mathbf B}_{0})-\nabla^{2}\mathbf B=-\nabla^{2}\mathbf B`,i:rw`Unlike $\nabla\!\cdot\mathbf E=0$, which needs empty space, $\nabla\!\cdot\mathbf B=0$ holds everywhere because magnetic charges do not exist. B has no fan-out part at all.`},
{t:'b',pid:'b',b:'B6',k:'B pr lam',h:'Set the two results equal',m:rw`B3 and B5 both equal $\nabla\!\times(\nabla\!\times\mathbf B)$. Equate them and cancel the minus sign.`,key:1,f:rw`\begin{aligned}-\nabla^{2}\mathbf B&=-\mu_0\varepsilon_0\frac{\partial^2\mathbf B}{\partial t^2}\\[6pt]\boxed{\;\nabla^{2}\mathbf B=\mu_0\varepsilon_0\frac{\partial^2\mathbf B}{\partial t^2}\;}\end{aligned}`,i:rw`The identical equation. E and B obey the same law, so they travel together at the same speed, each one sustaining the other with no charges nearby.`},
{t:'s',pid:'read',b:'R1',k:'pp k lk',h:'Match the standard wave equation',m:rw`A shape $f(x-vt)$ slides along $+x$ at speed $v$. The chain rule shows which equation it obeys.`,f:rw`\frac{\partial^2 f}{\partial x^2}=f'',\quad\frac{\partial^2 f}{\partial t^2}=v^{2}f''\;\Rightarrow\;\frac{\partial^2 f}{\partial x^2}=\frac{1}{v^{2}}\frac{\partial^2 f}{\partial t^2}`,i:rw`So the number in front of the time derivative is $1/v^2$. Comparing with E6 and B6, $1/v^2=\mu_0\varepsilon_0$.`},
{t:'s',pid:'read',b:'R2',k:'pp k lk',h:'Read off the speed',m:rw`Solve for $v$ and put in the measured constants.`,key:1,f:rw`v=\frac{1}{\sqrt{\mu_0\varepsilon_0}}=\frac{1}{\sqrt{(1.2566\times10^{-6})(8.854\times10^{-12})}}=2.998\times10^{8}\ \mathrm{m/s}=c`,v:['Units check',rw`The newtons, amperes and coulombs cancel and leave seconds squared per metre squared, so $1/\sqrt{\mu_0\varepsilon_0}$ really is a speed.`,rw`\mu_0\varepsilon_0=\frac{\mathrm N}{\mathrm A^{2}}\cdot\frac{\mathrm C^{2}}{\mathrm N\,\mathrm m^{2}}=\frac{\mathrm s^{2}}{\mathrm m^{2}}`],i:rw`Nothing in the derivation mentioned light. $\mu_0$ comes from magnets and currents and $\varepsilon_0$ from charges and capacitors, yet together they give the measured speed of light. Maxwell concluded that light is an electromagnetic wave.`},
{t:'s',pid:'read',b:'R3',l:'Reading it',k:'E B',h:'What the result does and does not say',m:rw`Each of the three components of E and of B obeys the same scalar equation, six in all. But these second-order equations are only consequences of Maxwell’s laws. A real wave must also satisfy the four first-order laws, and those tie E and B together: perpendicular to each other and to the direction of travel, in step, with $E=cB$.`,f:rw`\frac{\partial^2E_x}{\partial x^2}+\frac{\partial^2E_x}{\partial y^2}+\frac{\partial^2E_x}{\partial z^2}=\mu_0\varepsilon_0\frac{\partial^2E_x}{\partial t^2}\quad(\text{and likewise }E_y,E_z,B_x,B_y,B_z)`},
{t:'s',pid:'read',b:'Sum',l:'In one line',k:'E B pp',h:'The whole derivation',m:rw`Each equation is one chain: curl, swap, substitute the other law, expand, use Gauss.`,key:1,f:rw`\begin{aligned}-\nabla^{2}\mathbf E&=\nabla\!\times(\nabla\!\times\mathbf E)=-\frac{\partial}{\partial t}(\nabla\!\times\mathbf B)=-\mu_0\varepsilon_0\frac{\partial^2\mathbf E}{\partial t^2}\\-\nabla^{2}\mathbf B&=\nabla\!\times(\nabla\!\times\mathbf B)=\mu_0\varepsilon_0\frac{\partial}{\partial t}(\nabla\!\times\mathbf E)=-\mu_0\varepsilon_0\frac{\partial^2\mathbf B}{\partial t^2}\end{aligned}`}];
