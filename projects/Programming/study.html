<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Responsive PDF Viewer</title>

  <!-- Load Inter font and Tailwind CSS CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Load PDF.js cleanly with reliable multi-CDN fallback -->
  <script>
    (function () {
      const sources = [
        {
          lib: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js',
          worker: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js',
        },
        {
          lib: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
          worker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
        },
        {
          lib: 'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js',
          worker: 'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js',
        },
      ];

      function attachLib(workerUrl) {
        const lib = window.pdfjsLib || window['pdfjs-dist/build/pdf'];
        if (lib && typeof lib.getDocument === 'function') {
          try {
            if (lib.GlobalWorkerOptions) {
              lib.GlobalWorkerOptions.workerSrc = workerUrl;
            }
          } catch (e) {
            console.warn('Could not set PDF.js workerSrc:', e);
          }
          window.pdfjsLib = lib;
          window.__pdfjsWorkerUrl = workerUrl;
          window.__pdfjsReady = true;
          return true;
        }
        return false;
      }

      function tryLoadSource(index) {
        if (window.pdfjsLib && typeof window.pdfjsLib.getDocument === 'function') {
          window.__pdfjsReady = true;
          return;
        }
        if (index >= sources.length) {
          window.__pdfjsReady = true;
          window.__pdfjsFailed = true;
          return;
        }
        const current = sources[index];
        const script = document.createElement('script');
        script.src = current.lib;
        script.async = true;
        script.onload = function () {
          if (!attachLib(current.worker)) {
            tryLoadSource(index + 1);
          }
        };
        script.onerror = function () {
          tryLoadSource(index + 1);
        };
        document.head.appendChild(script);
      }

      tryLoadSource(0);
    })();
  </script>

  <!-- Configure Tailwind to use Inter and system-aware styling -->
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          boxShadow: {
            'doc': '0 12px 36px -8px rgba(15, 23, 42, 0.12), 0 4px 12px -4px rgba(15, 23, 42, 0.06)',
            'float': '0 8px 24px -6px rgba(15, 23, 42, 0.08)',
          },
        },
      },
    };
  </script>

  <style>
    /* Subtle custom scrollbar for smooth bidirectional document reading */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.45);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.65);
    }

    #page-wrapper {
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    /* 5-Page Set Completion Badge Keyframes */
    @keyframes setCompleteCardIn {
      0% {
        opacity: 0;
        transform: scale(0.84);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes setCompleteRingPulse {
      0% {
        transform: scale(0.82);
        opacity: 0.75;
      }
      100% {
        transform: scale(1.65);
        opacity: 0;
      }
    }

    @keyframes setCompleteHaloFloat {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.06);
      }
    }

    @keyframes setCompleteCheckPop {
      0% {
        transform: scale(0.35) rotate(-14deg);
        opacity: 0;
      }
      65% {
        transform: scale(1.12) rotate(3deg);
        opacity: 1;
      }
      100% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    .set-complete-card-anim {
      animation: setCompleteCardIn 0.48s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .set-complete-ring-anim {
      animation: setCompleteRingPulse 1.8s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    .set-complete-ring-anim-delayed {
      animation: setCompleteRingPulse 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s infinite;
    }

    .set-complete-halo-anim {
      animation: setCompleteHaloFloat 2.4s ease-in-out infinite;
    }

    .set-complete-check-anim {
      animation: setCompleteCheckPop 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.08s both;
    }

    /* Full-Screen Animated Hydration (5m -> 10s timer) & Rest (30m -> 5m timer) Keyframes */
    @keyframes reminderOverlayIn {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }

    @keyframes reminderOverlayOut {
      0% {
        opacity: 1;
      }
      100% {
        opacity: 0;
      }
    }

    @keyframes reminderCardIn {
      0% {
        opacity: 0;
        transform: translateY(20px) scale(0.92);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes fullWaveSlideLeft {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-50%);
      }
    }

    @keyframes fullWaveSlideRight {
      0% {
        transform: translateX(-50%);
      }
      100% {
        transform: translateX(0);
      }
    }

    @keyframes fullScreenBubbleFloat {
      0% {
        transform: translateY(105vh) scale(0.65);
        opacity: 0;
      }
      15% {
        opacity: 0.75;
      }
      85% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(-15vh) scale(1.15);
        opacity: 0;
      }
    }

    @keyframes waterRippleExpand {
      0% {
        transform: scale(0.75);
        opacity: 0.8;
      }
      100% {
        transform: scale(1.9);
        opacity: 0;
      }
    }

    @keyframes waterDropletBob {
      0%, 100% {
        transform: translateY(0px) scale(1);
      }
      50% {
        transform: translateY(-6px) scale(1.05);
      }
    }

    @keyframes waterWaveFlow {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-50%);
      }
    }

    @keyframes waterBubbleRise {
      0% {
        transform: translateY(6px) scale(0.6);
        opacity: 0;
      }
      40% {
        opacity: 0.9;
      }
      100% {
        transform: translateY(-14px) scale(1.1);
        opacity: 0;
      }
    }

    @keyframes fullScreenBreathePulse {
      0%, 100% {
        transform: scale(0.82);
        opacity: 0.32;
      }
      50% {
        transform: scale(1.38);
        opacity: 0.62;
      }
    }

    @keyframes restStarTwinkle {
      0%, 100% {
        opacity: 0.2;
        transform: scale(0.85);
      }
      50% {
        opacity: 0.95;
        transform: scale(1.25);
      }
    }

    @keyframes restAuroraDrift {
      0%, 100% {
        transform: translate(-4%, -3%) scale(1);
      }
      50% {
        transform: translate(4%, 3%) scale(1.12);
      }
    }

    @keyframes breakRaysSpin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes breakIconFloat {
      0%, 100% {
        transform: translateY(0px) rotate(-2deg);
      }
      50% {
        transform: translateY(-6px) rotate(2deg);
      }
    }

    .reminder-overlay-in {
      animation: reminderOverlayIn 0.35s ease-out forwards;
    }

    .reminder-overlay-out {
      animation: reminderOverlayOut 0.28s ease-in forwards;
    }

    .reminder-card-in {
      animation: reminderCardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .full-wave-layer-1 {
      animation: fullWaveSlideLeft 6s linear infinite;
    }

    .full-wave-layer-2 {
      animation: fullWaveSlideRight 9s linear infinite;
    }

    .full-wave-layer-3 {
      animation: fullWaveSlideLeft 12s linear infinite;
    }

    .fs-bubble {
      position: absolute;
      bottom: 0;
      border-radius: 9999px;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.85), rgba(186, 230, 253, 0.25));
      border: 1px solid rgba(255, 255, 255, 0.45);
      animation: fullScreenBubbleFloat var(--dur, 6s) ease-in var(--delay, 0s) infinite;
      pointer-events: none;
    }

    .water-ripple-1 {
      animation: waterRippleExpand 2.2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    .water-ripple-2 {
      animation: waterRippleExpand 2.2s cubic-bezier(0.16, 1, 0.3, 1) 0.75s infinite;
    }

    .water-droplet-bob {
      animation: waterDropletBob 2.6s ease-in-out infinite;
    }

    .water-wave-flow {
      animation: waterWaveFlow 2.4s linear infinite;
    }

    .water-bubble-1 {
      animation: waterBubbleRise 2s ease-in-out infinite;
    }

    .water-bubble-2 {
      animation: waterBubbleRise 2.4s ease-in-out 0.8s infinite;
    }

    .fs-breathe-ring-1 {
      animation: fullScreenBreathePulse 8s ease-in-out infinite;
    }

    .fs-breathe-ring-2 {
      animation: fullScreenBreathePulse 8s ease-in-out 2s infinite;
    }

    .fs-aurora-drift {
      animation: restAuroraDrift 12s ease-in-out infinite;
    }

    .fs-star {
      position: absolute;
      border-radius: 9999px;
      background: #fef3c7;
      box-shadow: 0 0 10px rgba(253, 224, 71, 0.75);
      animation: restStarTwinkle var(--dur, 3.6s) ease-in-out var(--delay, 0s) infinite;
      pointer-events: none;
    }

    .break-rays-spin {
      animation: breakRaysSpin 20s linear infinite;
    }

    .break-icon-float {
      animation: breakIconFloat 3.4s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-white text-slate-900 font-sans antialiased selection:bg-indigo-100 selection:text-indigo-900">
  <div id="viewer-app" class="min-h-[100dvh] w-full bg-white flex flex-col relative">
    <!-- Top-Left Study Sets Drawer Button (Reader View Only, offset below mobile camera cutout) -->
    <button
      id="open-sets-drawer-btn"
      type="button"
      title="Open Study Sets & Options"
      aria-label="Open Study Sets and Options"
      class="hidden fixed left-3 sm:left-5 top-[max(2.15rem,calc(env(safe-area-inset-top)+1.15rem))] z-40 p-2.5 rounded-full bg-white/90 hover:bg-white text-slate-700 hover:text-slate-900 border border-slate-200/85 shadow-sm backdrop-blur-sm transition cursor-pointer touch-manipulation"
    >
      <svg class="w-4 h-4 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h10M4 18h16" />
      </svg>
    </button>

    <!-- Top-Right Floating Controls (Offset safely below mobile front camera cutout) -->
    <div class="fixed right-3 sm:right-5 top-[max(2.15rem,calc(env(safe-area-inset-top)+1.15rem))] z-40 flex items-center gap-2">
      <!-- Fullscreen Toggle Button (Shown inside PDF Reader) -->
      <button
        id="top-right-fullscreen-btn"
        type="button"
        title="Toggle Fullscreen"
        aria-label="Toggle Fullscreen"
        class="hidden p-2.5 rounded-full bg-white/90 hover:bg-white text-slate-700 hover:text-slate-900 border border-slate-200/85 shadow-sm backdrop-blur-sm transition cursor-pointer touch-manipulation"
      >
        <svg id="fullscreen-enter-icon" class="w-4 h-4 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4h4M20 8V4h-4M4 16v4h4M20 16v4h-4" />
        </svg>
        <svg id="fullscreen-exit-icon" class="hidden w-4 h-4 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" />
        </svg>
      </button>

      <!-- Back Button -->
      <button
        id="top-right-back-btn"
        type="button"
        title="Back"
        aria-label="Back"
        class="p-2.5 rounded-full bg-white/90 hover:bg-white text-slate-700 hover:text-slate-900 border border-slate-200/85 shadow-sm backdrop-blur-sm transition cursor-pointer touch-manipulation"
      >
        <svg class="w-4 h-4 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
      </button>
    </div>

    <!-- Non-Blocking Status / Error Banner (Offset below camera cutout) -->
    <div
      id="status-banner"
      role="alert"
      class="hidden fixed left-1/2 -translate-x-1/2 top-[max(4.75rem,calc(env(safe-area-inset-top)+3.75rem))] z-[80] w-[calc(100%-2rem)] max-w-md rounded-2xl bg-slate-900/95 text-white px-4 py-3 shadow-xl border border-slate-700/80 backdrop-blur-md flex items-center justify-between gap-3"
    >
      <span id="status-message" class="text-xs sm:text-sm font-medium leading-snug"></span>
      <button
        id="dismiss-status-btn"
        type="button"
        aria-label="Dismiss notification"
        class="p-1 rounded-lg text-slate-300 hover:text-white hover:bg-white/10 transition cursor-pointer shrink-0"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Periodic Full-Screen Animated Study Reminder Overlay (5m -> 10s Water / 30m -> 5m Rest) -->
    <div
      id="study-reminder-toast"
      role="dialog"
      aria-modal="true"
      aria-live="polite"
      aria-labelledby="study-reminder-title"
      class="hidden fixed inset-0 z-[120] w-full h-[100dvh] overflow-hidden flex flex-col items-center justify-center px-6 pt-[max(2.5rem,calc(env(safe-area-inset-top)+1.25rem))] pb-[max(2rem,calc(env(safe-area-inset-bottom)+1.25rem))] select-none reminder-overlay-in"
    >
      <!-- FULL-SCREEN WATER ANIMATION LAYER (10 Seconds) -->
      <div
        id="water-fullscreen-bg"
        aria-hidden="true"
        class="hidden absolute inset-0 bg-gradient-to-b from-sky-500 via-blue-600 to-indigo-950 overflow-hidden"
      >
        <!-- Sunlit Top Water Caustic Shimmer -->
        <div class="absolute -top-24 inset-x-0 h-72 bg-gradient-to-b from-cyan-200/35 via-sky-300/15 to-transparent blur-2xl"></div>

        <!-- Rising Full-Screen Water Waves Container -->
        <div
          id="water-fill-level"
          style="height: 38%; transition: height 0.95s linear;"
          class="absolute inset-x-0 bottom-0 w-full pointer-events-none"
        >
          <!-- Back Wave Layer -->
          <svg
            class="full-wave-layer-3 absolute -top-14 left-0 w-[200%] h-20 text-cyan-300/25"
            viewBox="0 0 1440 120"
            preserveAspectRatio="none"
          >
            <path
              fill="currentColor"
              d="M0,64 C180,110 360,15 540,64 C720,110 900,15 1080,64 C1260,110 1350,40 1440,64 L1440,120 L0,120 Z"
            />
          </svg>
          <!-- Middle Wave Layer -->
          <svg
            class="full-wave-layer-2 absolute -top-10 left-0 w-[200%] h-16 text-sky-300/35"
            viewBox="0 0 1440 120"
            preserveAspectRatio="none"
          >
            <path
              fill="currentColor"
              d="M0,48 C240,95 480,5 720,48 C960,95 1200,5 1440,48 L1440,120 L0,120 Z"
            />
          </svg>
          <!-- Front Wave Layer -->
          <svg
            class="full-wave-layer-1 absolute -top-7 left-0 w-[200%] h-14 text-cyan-200/45"
            viewBox="0 0 1440 120"
            preserveAspectRatio="none"
          >
            <path
              fill="currentColor"
              d="M0,72 C180,20 360,115 540,72 C720,20 900,115 1080,72 C1260,20 1350,90 1440,72 L1440,120 L0,120 Z"
            />
          </svg>
          <!-- Deep Water Body Fill -->
          <div class="w-full h-full bg-gradient-to-b from-cyan-400/35 via-blue-700/55 to-indigo-950/85 backdrop-blur-[1px]"></div>
        </div>

        <!-- Full-Screen Floating Bubbles -->
        <span class="fs-bubble w-3 h-3 left-[10%]" style="--dur: 5.2s; --delay: 0s;"></span>
        <span class="fs-bubble w-5 h-5 left-[22%]" style="--dur: 6.8s; --delay: 1.1s;"></span>
        <span class="fs-bubble w-2.5 h-2.5 left-[35%]" style="--dur: 4.9s; --delay: 0.4s;"></span>
        <span class="fs-bubble w-6 h-6 left-[48%]" style="--dur: 7.4s; --delay: 1.8s;"></span>
        <span class="fs-bubble w-3.5 h-3.5 left-[62%]" style="--dur: 5.6s; --delay: 0.7s;"></span>
        <span class="fs-bubble w-5 h-5 left-[75%]" style="--dur: 6.4s; --delay: 2.1s;"></span>
        <span class="fs-bubble w-3 h-3 left-[88%]" style="--dur: 5.1s; --delay: 1.4s;"></span>
        <span class="fs-bubble w-4 h-4 left-[16%]" style="--dur: 6.1s; --delay: 2.6s;"></span>
        <span class="fs-bubble w-3.5 h-3.5 left-[81%]" style="--dur: 5.8s; --delay: 0.3s;"></span>
      </div>

      <!-- FULL-SCREEN REST ANIMATION LAYER (5 Minutes) -->
      <div
        id="rest-fullscreen-bg"
        aria-hidden="true"
        class="hidden absolute inset-0 bg-gradient-to-b from-slate-950 via-indigo-950 to-purple-950 overflow-hidden"
      >
        <!-- Soft Drifting Twilight Aurora -->
        <div class="fs-aurora-drift absolute -inset-16 bg-[radial-gradient(circle_at_30%_25%,rgba(251,191,36,0.22),transparent_50%),radial-gradient(circle_at_75%_70%,rgba(168,85,247,0.28),transparent_55%),radial-gradient(circle_at_50%_50%,rgba(56,189,248,0.16),transparent_60%)]"></div>

        <!-- Full-Screen Slow Breathing Concentric Halos -->
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
          <div class="fs-breathe-ring-1 w-[75vmin] h-[75vmin] rounded-full border border-amber-200/20 bg-gradient-to-tr from-amber-400/10 via-rose-400/10 to-indigo-400/10 blur-md"></div>
        </div>
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
          <div class="fs-breathe-ring-2 w-[105vmin] h-[105vmin] rounded-full border border-purple-200/15 bg-indigo-400/5 blur-lg"></div>
        </div>

        <!-- Calm Twilight Stars -->
        <span class="fs-star w-1.5 h-1.5 top-[14%] left-[18%]" style="--dur: 3.4s; --delay: 0.2s;"></span>
        <span class="fs-star w-2 h-2 top-[22%] left-[78%]" style="--dur: 4.2s; --delay: 1.1s;"></span>
        <span class="fs-star w-1 h-1 top-[32%] left-[12%]" style="--dur: 2.9s; --delay: 0.7s;"></span>
        <span class="fs-star w-1.5 h-1.5 top-[18%] left-[52%]" style="--dur: 3.9s; --delay: 1.6s;"></span>
        <span class="fs-star w-2 h-2 top-[72%] left-[20%]" style="--dur: 4.5s; --delay: 0.5s;"></span>
        <span class="fs-star w-1.5 h-1.5 top-[78%] left-[82%]" style="--dur: 3.7s; --delay: 1.9s;"></span>
        <span class="fs-star w-1 h-1 top-[64%] left-[88%]" style="--dur: 3.1s; --delay: 0.9s;"></span>
        <span class="fs-star w-1.5 h-1.5 top-[82%] left-[44%]" style="--dur: 4.1s; --delay: 2.3s;"></span>
      </div>

      <!-- CENTERED FULL-SCREEN CONTENT & LIVE COUNTDOWN RING -->
      <div
        id="study-reminder-card"
        class="reminder-card-in relative z-10 w-full max-w-sm flex flex-col items-center text-center gap-6 text-white"
      >
        <!-- Top Status Pill -->
        <span
          id="study-reminder-badge"
          class="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full text-xs font-semibold tracking-wide bg-white/15 text-white border border-white/25 backdrop-blur-md shadow-sm"
        >
          5 Minute Check-In
        </span>

        <!-- Circular Countdown Progress Ring + Animated Icon -->
        <div class="relative flex items-center justify-center w-44 h-44 sm:w-48 sm:h-48">
          <svg class="absolute inset-0 w-full h-full -rotate-90 drop-shadow-lg" viewBox="0 0 120 120" aria-hidden="true">
            <circle
              cx="60"
              cy="60"
              r="54"
              fill="rgba(255,255,255,0.08)"
              stroke="rgba(255,255,255,0.2)"
              stroke-width="5"
            />
            <circle
              id="reminder-ring-progress"
              cx="60"
              cy="60"
              r="54"
              fill="none"
              stroke="#ffffff"
              stroke-width="5.5"
              stroke-linecap="round"
              stroke-dasharray="339.292"
              stroke-dashoffset="0"
              style="transition: stroke-dashoffset 0.95s linear;"
            />
          </svg>

          <!-- Animated Drink Water Visual (10 Seconds) -->
          <div id="water-reminder-visual" class="hidden relative flex flex-col items-center justify-center">
            <span class="water-ripple-1 absolute -inset-4 rounded-full border-2 border-cyan-200/60" aria-hidden="true"></span>
            <span class="water-ripple-2 absolute -inset-4 rounded-full border border-white/45" aria-hidden="true"></span>
            <div class="water-droplet-bob relative flex h-16 w-16 items-center justify-center rounded-full bg-white/20 backdrop-blur-md border border-white/40 text-white shadow-lg">
              <svg class="w-9 h-9" viewBox="0 0 36 36" fill="none" aria-hidden="true">
                <defs>
                  <clipPath id="droplet-clip">

      /**
       * Lightweight IndexedDB persistence for PDF ArrayBuffers so saved textbooks
       * open immediately in fullscreen even after reloading the page.
       */
      function openPdfIdb() {
        return new Promise((resolve) => {
          if (!window.indexedDB) {
            resolve(null);
            return;
          }
          try {
            const req = window.indexedDB.open(IDB_NAME, 1);
            req.onupgradeneeded = () => {
              const db = req.result;
              if (!db.objectStoreNames.contains(IDB_STORE)) {
                db.createObjectStore(IDB_STORE);
              }
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => resolve(null);
          } catch (_) {
            resolve(null);
          }
        });
      }

      async function savePdfBinaryToIDB(bookId, arrayBuffer) {
        if (!bookId || !arrayBuffer) return;
        const db = await openPdfIdb();
        if (!db) return;
        try {
          const tx = db.transaction(IDB_STORE, 'readwrite');
          tx.objectStore(IDB_STORE).put(arrayBuffer.slice(0), bookId);
        } catch (_) {
          // Ignore quota or sandboxed IndexedDB restrictions
        }
      }

      async function getPdfBinaryFromIDB(bookId) {
        if (!bookId) return null;
        const db = await openPdfIdb();
        if (!db) return null;
        return new Promise((resolve) => {
          try {
            const tx = db.transaction(IDB_STORE, 'readonly');
            const req = tx.objectStore(IDB_STORE).get(bookId);
            req.onsuccess = () => resolve(req.result || null);
            req.onerror = () => resolve(null);
          } catch (_) {
            resolve(null);
          }
        });
      }

      async function deletePdfBinaryFromIDB(bookId) {
        if (!bookId) return;
        const db = await openPdfIdb();
        if (!db) return;
        try {
          const tx = db.transaction(IDB_STORE, 'readwrite');
          tx.objectStore(IDB_STORE).delete(bookId);
        } catch (_) {
          // Ignore errors
        }
      }

      /**
       * Checks whether the browser is currently displaying the app in fullscreen mode.
       */
      function isDocumentFullscreen() {
        return Boolean(
          document.fullscreenElement ||
          document.webkitFullscreenElement ||
          document.msFullscreenElement
        );
      }

      /**
       * Updates the top-right fullscreen & top-left drawer button visibility and icon states.
       */

        const inReader = state.step === 3;
        if (els.topRightFullscreenBtn) {

      /**
       * Requests browser fullscreen mode to hide browser tabs and navigation chrome.
       * Queues a one-time gesture fallback if an OS file dialog consumed transient activation.
       */
      function enterAppFullscreen() {
        updateReaderTopButtonsUI();
        if (isDocumentFullscreen()) {
          state.pendingFullscreenOnGesture = false;
          return;
        }

        const targets = [document.documentElement, document.body, els.canvasView].filter(Boolean);
        let invoked = false;

        for (let i = 0; i < targets.length; i += 1) {
          const el = targets[i];
          try {
            let promise = null;
            if (typeof el.requestFullscreen === 'function') {
              promise = el.requestFullscreen({ navigationUI: 'hide' });
            } else if (typeof el.webkitRequestFullscreen === 'function') {
              promise = el.webkitRequestFullscreen();
            } else if (typeof el.msRequestFullscreen === 'function') {
              promise = el.msRequestFullscreen();
            } else {
              continue;
            }

            invoked = true;
            if (promise && typeof promise.then === 'function') {
              promise
                .then(() => {
                  state.pendingFullscreenOnGesture = false;
                  updateReaderTopButtonsUI();
                })
                .catch(() => {
                  if (state.step === 3) {
                    state.pendingFullscreenOnGesture = true;
                  }
                });
            } else {
              state.pendingFullscreenOnGesture = false;
            }
            break;
          } catch (_) {
            // Try next candidate element
          }
        }

        if (!invoked && state.step === 3) {
          state.pendingFullscreenOnGesture = true;
        }
      }

      /**
       * Exits browser fullscreen mode if currently active.
       */
      function exitAppFullscreen() {
        state.pendingFullscreenOnGesture = false;
        if (!isDocumentFullscreen()) {
          updateReaderTopButtonsUI();
          return;
        }

        try {
          if (typeof document.exitFullscreen === 'function') {
            document.exitFullscreen().catch(() => {});
          } else if (typeof document.webkitExitFullscreen === 'function') {
            document.webkitExitFullscreen();
          } else if (typeof document.msExitFullscreen === 'function') {
            document.msExitFullscreen();
          }
        } catch (_) {
          // Ignore fullscreen exit errors
        }
        updateReaderTopButtonsUI();
      }

      /**
       * Waits until PDF.js finishes loading from CDN (with backup injection fallback).
       */
      function waitForPdfJs(timeoutMs = 15000) {
        const existingLib = window.pdfjsLib || window['pdfjs-dist/build/pdf'];
        if (existingLib && typeof existingLib.getDocument === 'function') {
          window.pdfjsLib = existingLib;
          return Promise.resolve(existingLib);
        }

        return new Promise((resolve, reject) => {
          const startedAt = Date.now();
          let injectedBackup = false;

          const intervalId = setInterval(() => {
            const lib = window.pdfjsLib || window['pdfjs-dist/build/pdf'];
            if (lib && typeof lib.getDocument === 'function') {
              clearInterval(intervalId);
              window.pdfjsLib = lib;
              resolve(lib);
              return;
            }

            if (!injectedBackup && (window.__pdfjsFailed || Date.now() - startedAt > 3500)) {
              injectedBackup = true;
              const backup = document.createElement('script');
              backup.src = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
              backup.async = true;
              backup.onload = () => {
                const loaded = window.pdfjsLib || window['pdfjs-dist/build/pdf'];
                if (loaded && loaded.GlobalWorkerOptions) {
                  loaded.GlobalWorkerOptions.workerSrc =
                    'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
                }
              };
              document.head.appendChild(backup);
            }

            if (Date.now() - startedAt >= timeoutMs) {
              clearInterval(intervalId);
              reject(new Error('PDF engine could not load. Please check your internet connection and retry.'));
            }
          }, 60);
        });
      }

      /**
       * Reads a File object into an ArrayBuffer with a FileReader fallback for older WebViews.
       */
      function readFileAsArrayBuffer(file) {
        if (!file) {
          return Promise.reject(new Error('No file was selected.'));
        }
        if (typeof file.arrayBuffer === 'function') {
          return file.arrayBuffer().catch(() => readWithFileReader(file));
        }
        return readWithFileReader(file);
      }

      function readWithFileReader(file) {
        return new Promise((resolve, reject) => {
          try {
            const reader = new FileReader();
            reader.onload = () => {
              if (reader.result instanceof ArrayBuffer) {
                resolve(reader.result);
              } else {
                reject(new Error('Unable to read PDF file contents.'));
              }
            };
            reader.onerror = () => {
              reject(new Error('Failed to read the selected file from your device.'));
            };
            reader.readAsArrayBuffer(file);
          } catch (err) {
            reject(err);
          }
        });
      }

      /**
       * Checks whether raw bytes look like a PDF document (supports leading whitespace/BOM).
       */
      function looksLikePdfBytes(bytes) {
        if (!bytes || bytes.length < 5) return false;
        const scanLen = Math.min(bytes.length, 4096);
        let headerText = '';
        for (let i = 0; i < scanLen; i += 1) {
          headerText += String.fromCharCode(bytes[i]);
        }
        return headerText.indexOf('%PDF-') !== -1;
      }

      /**
       * Generates a lightweight JPEG cover page thumbnail from page 1 of a PDFDocumentProxy.
       */
      async function generateCoverThumbnail(pdfDoc, bookId) {
        if (!pdfDoc || typeof pdfDoc.getPage !== 'function') return null;
        if (bookId && state.coverCacheByKey && state.coverCacheByKey[bookId]) {
          return state.coverCacheByKey[bookId];
        }

        try {
          const coverPage = await pdfDoc.getPage(1);
          const unscaled = coverPage.getViewport({ scale: 1 });
          const targetWidth = 112;
          const scale = Math.max(0.1, Math.min(1.0, targetWidth / Math.max(1, unscaled.width)));
          const viewport = coverPage.getViewport({ scale });

          const thumbCanvas = document.createElement('canvas');
          thumbCanvas.width = Math.max(1, Math.round(viewport.width));
          thumbCanvas.height = Math.max(1, Math.round(viewport.height));
          const thumbCtx = thumbCanvas.getContext('2d', { alpha: false });

          thumbCtx.fillStyle = '#ffffff';
          thumbCtx.fillRect(0, 0, thumbCanvas.width, thumbCanvas.height);

          await coverPage.render({
            canvasContext: thumbCtx,
            viewport,
          }).promise;

          if (typeof coverPage.cleanup === 'function') {
            coverPage.cleanup();
          }

          const dataUrl = thumbCanvas.toDataURL('image/jpeg', 0.78);
          if (bookId) {
            if (!state.coverCacheByKey) state.coverCacheByKey = {};
            state.coverCacheByKey[bookId] = dataUrl;
          }
          return dataUrl;
        } catch (err) {
          console.warn('Could not render textbook cover thumbnail:', err);
          return null;
        }
      }

      /**
       * Loads saved textbook metadata (including compact cover thumbnails) from localStorage safely.
       */
      function loadSavedTextbooksFromStorage() {
        try {
          const raw = window.localStorage.getItem(STORAGE_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return [];
          parsed.forEach((b) => {
            if (b && b.id && b.coverDataUrl) {
              state.coverCacheByKey[b.id] = b.coverDataUrl;
            }
          });
          return parsed;
        } catch (err) {
          console.warn('Could not read saved textbooks:', err);
          return [];
        }
      }

      /**
       * Saves lightweight textbook metadata & compact cover thumbnails to localStorage,
       * gracefully trimming older cover data URLs if storage quota is ever reached.
       */
      function saveTextbooksToStorage() {
        const list = (Array.isArray(state.textbooks) ? state.textbooks : []).slice(0, 20);
        const buildPayload = (maxCovers) =>
          list.map((b, idx) => ({
            id: b.id,
            title: b.title,
            filePath: b.filePath,
            totalPages: b.totalPages || 0,
            startPage: b.startPage || 1,
            pagesToStudy: b.pagesToStudy || 5,
            lastReadPage: b.lastReadPage || b.startPage || 1,
            studiedPages: b.studiedPages || 0,
            elapsedSeconds: b.elapsedSeconds || 0,
            updatedAt: b.updatedAt || Date.now(),
            coverDataUrl:
              idx < maxCovers
                ? b.coverDataUrl || (state.coverCacheByKey && state.coverCacheByKey[b.id]) || null
                : null,
          }));

        try {
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify(buildPayload(15)));
        } catch (_) {
          try {
            window.localStorage.setItem(STORAGE_KEY, JSON.stringify(buildPayload(5)));
          } catch (err) {
            try {
              window.localStorage.setItem(STORAGE_KEY, JSON.stringify(buildPayload(0)));
            } catch (finalErr) {
              console.warn('Could not persist saved textbooks:', finalErr || err);
            }
          }
        }
      }

      /**
       * Formats elapsed seconds into MM:SS or HH:MM:SS.
       */
      function formatDuration(totalSeconds) {
        const sec = Math.max(0, Math.floor(Number(totalSeconds) || 0));
        const hours = Math.floor(sec / 3600);
        const minutes = Math.floor((sec % 3600) / 60);
        const seconds = sec % 60;
        const mm = String(minutes).padStart(2, '0');
        const ss = String(seconds).padStart(2, '0');
        if (hours > 0) {
          return `${String(hours).padStart(2, '0')}:${mm}:${ss}`;
        }
        return `${mm}:${ss}`;
      }

      /**
       * Computes a responsive scale factor for fitting a PDF page inside the viewport stage
       * or applying user-requested zoom levels smoothly.
       */
      function computeScale(page) {
        if (!page || typeof page.getViewport !== 'function') {
          return state.zoom || 1.0;
        }

        const unscaled = page.getViewport({ scale: 1, rotation: state.rotation || 0 });
        const pageW = Math.max(1, unscaled.width);
        const pageH = Math.max(1, unscaled.height);
        state.basePageWidth = pageW;
        state.basePageHeight = pageH;

        const wrapperRect = els.pageWrapper ? els.pageWrapper.getBoundingClientRect() : null;
        const rawW = wrapperRect && wrapperRect.width > 40 ? wrapperRect.width : window.innerWidth;
        const rawH = wrapperRect && wrapperRect.height > 40 ? wrapperRect.height : Math.max(240, window.innerHeight - 110);

        const availW = Math.max(180, rawW - 24);
        const availH = Math.max(180, rawH - 24);

        const fitScale = Math.max(0.25, Math.min(3.5, Math.min(availW / pageW, availH / pageH)));
        state.baseFitScale = fitScale;

        if (state.fitFullPage) {
          state.zoom = 1.0;
          return Number(fitScale.toFixed(4));
        }

        const multiplier = Math.max(0.5, Math.min(4.0, Number(state.zoom) || 1.0));
        return Number((fitScale * multiplier).toFixed(4));
      }

      /**
       * Updates zoom readout labels in the bottom bar.
       */
      function updateZoomUI() {
        const pct = Math.round((state.fitFullPage ? 1 : (state.zoom || 1)) * 100);
        if (els.bottomZoomLabel) {
          els.bottomZoomLabel.textContent = state.fitFullPage ? 'Fit' : `${pct}%`;
        }
      }

      /**
       * Applies smooth, glitch-free focal zoom: updates CSS dimensions instantaneously at 60fps
       * and debounces high-DPI offscreen PDF.js re-rasterization so the canvas never flashes.
       */
      function setZoomLevel(nextZoom, options = {}) {
        const clamped = Math.max(0.5, Math.min(4.0, Number(nextZoom) || 1.0));
        const isFit = Boolean(options.fit) || Math.abs(clamped - 1.0) < 0.015;

        const prevScale =
          (state.baseFitScale || 1) * (state.fitFullPage ? 1.0 : (state.zoom || 1.0));

        state.fitFullPage = isFit;
        state.fitToWidth = false;
        state.zoom = isFit ? 1.0 : clamped;
        updateZoomUI();

        if (!state.pdfDoc || !els.canvas || !els.pageWrapper || !state.basePageWidth || !state.basePageHeight) {
          if (state.pdfDoc) {
            renderPage(state.currentPage);
          }
          return;
        }

        const nextScale = (state.baseFitScale || 1) * (state.fitFullPage ? 1.0 : state.zoom);
        const ratio = prevScale > 0 ? nextScale / prevScale : 1;

        const wrapper = els.pageWrapper;
        const rect = wrapper.getBoundingClientRect();
        const focalX = typeof options.focalX === 'number' ? options.focalX : rect.width / 2;
        const focalY = typeof options.focalY === 'number' ? options.focalY : rect.height / 2;

        const contentX = wrapper.scrollLeft + focalX;
        const contentY = wrapper.scrollTop + focalY;

        const newCssW = Math.max(1, Math.round(state.basePageWidth * nextScale));
        const newCssH = Math.max(1, Math.round(state.basePageHeight * nextScale));

        if (state.zoomRafId) {
          cancelAnimationFrame(state.zoomRafId);
        }

        state.zoomRafId = requestAnimationFrame(() => {
          state.zoomRafId = null;
          els.canvas.style.width = `${newCssW}px`;
          els.canvas.style.height = `${newCssH}px`;

          if (isFit) {
            wrapper.scrollLeft = 0;
            wrapper.scrollTop = 0;
          } else {
            wrapper.scrollLeft = Math.max(0, contentX * ratio - focalX);
            wrapper.scrollTop = Math.max(0, contentY * ratio - focalY);
          }
        });

        clearTimeout(state.zoomRenderTimer);
        state.zoomRenderTimer = setTimeout(() => {
          if (state.pdfDoc && state.step === 3) {
            renderPage(state.currentPage, { isZoomRefinement: true });
          }
        }, 160);
      }

      /**
       * Returns a high-DPI supersampling multiplier bounded safely for desktop & mobile GPUs.
       */
      function getHighQualityRenderMultiplier(cssWidth, cssHeight) {
        const deviceDpr = window.devicePixelRatio || 1;
        const targetDpr = Math.min(3.0, Math.max(2.0, deviceDpr * 1.5));
        const maxEdge = 4096;
        const maxPixels = 12500000;

        const edgeBound = Math.min(
          maxEdge / Math.max(1, cssWidth),
          maxEdge / Math.max(1, cssHeight)
        );
        const areaBound = Math.sqrt(
          maxPixels / Math.max(1, cssWidth * cssHeight)
        );

        return Math.max(1, Math.min(targetDpr, edgeBound, areaBound));
      }

      /**
       * Splits a page range [startPage, endPage] into sequential sets of up to 5 pages.
       */
      function buildFivePageSets(startPage, endPage) {
        const sets = [];
        const s = Math.max(1, parseInt(startPage, 10) || 1);
        const e = Math.max(s, parseInt(endPage, 10) || s);

        for (let cursor = s; cursor <= e; cursor += 5) {
          const setEnd = Math.min(e, cursor + 4);
          const pages = [];
          for (let p = cursor; p <= setEnd; p += 1) {
            pages.push(p);
          }
          sets.push({
            start: cursor,
            end: setEnd,
            pages,
          });
        }
        return sets;
      }

      /**
       * Finds which 5-page study set contains a given page number, or -1 if outside sets.
       */
      function findSetIndexForPage(pageNum) {
        const sets = Array.isArray(state.pageSets) ? state.pageSets : [];
        for (let i = 0; i < sets.length; i += 1) {
          if (pageNum >= sets[i].start && pageNum <= sets[i].end) {
            return i;
          }
        }
        return -1;
      }

      const RING_CIRCUMFERENCE = 2 * Math.PI * 54;
      let reminderCountdownInterval = null;
      let reminderFinishTimeout = null;
      let resumeStudyAfterReminder = false;

      /**
       * Updates the circular SVG progress ring and countdown label during a wellness break.
       */
      function updateReminderCountdownUI(remainingSec, totalSec, mode) {
        if (els.studyReminderCountdown) {
          els.studyReminderCountdown.textContent = formatDuration(remainingSec);
        }
        if (els.reminderRingProgress) {
          const safeTotal = Math.max(1, totalSec);
          const fraction = Math.max(0, Math.min(1, remainingSec / safeTotal));
          els.reminderRingProgress.style.strokeDasharray = String(RING_CIRCUMFERENCE);
          els.reminderRingProgress.style.strokeDashoffset = String(
            RING_CIRCUMFERENCE * (1 - fraction)
          );
        }
        if (mode === 'water' && els.waterFillLevel) {
          const progress = 1 - Math.max(0, Math.min(1, remainingSec / Math.max(1, totalSec)));
          const heightPct = Math.round(36 + progress * 52);
          els.waterFillLevel.style.height = `${heightPct}%`;
        }
        if (mode === 'rest' && els.studyReminderSubcue) {
          const cycleSec = remainingSec % 8;
          els.studyReminderSubcue.textContent =
            cycleSec >= 4 ? 'Breathe in slowly...' : 'Exhale gently and relax your eyes...';
        }
      }

      /**
       * Starts a full-screen wellness countdown (10s for Drink Water, 5m = 300s for Rest).
       */
      function startFullScreenReminderTimer(totalSec, mode) {
        clearInterval(reminderCountdownInterval);
        clearTimeout(reminderFinishTimeout);
        reminderCountdownInterval = null;
        reminderFinishTimeout = null;

        resumeStudyAfterReminder = Boolean(state.timerRunning);
        if (state.timerRunning) {
          state.timerRunning = false;
          updateTimerUI();
        }

        let remaining = totalSec;
        updateReminderCountdownUI(remaining, totalSec, mode);

        reminderCountdownInterval = setInterval(() => {
          remaining -= 1;
          if (remaining <= 0) {
            clearInterval(reminderCountdownInterval);
            reminderCountdownInterval = null;
            updateReminderCountdownUI(0, totalSec, mode);
            reminderFinishTimeout = setTimeout(() => {
              hideStudyReminder();
            }, 400);
          } else {
            updateReminderCountdownUI(remaining, totalSec, mode);
          }
        }, 1000);
      }

      /**
       * Smoothly dismisses the full-screen reminder overlay and resumes the study timer.
       */
      function hideStudyReminder() {
        clearInterval(reminderCountdownInterval);
        clearTimeout(reminderFinishTimeout);
        reminderCountdownInterval = null;
        reminderFinishTimeout = null;

        if (resumeStudyAfterReminder && state.step === 3) {
          resumeStudyAfterReminder = false;
          state.timerRunning = true;
          state.lastTickAt = Date.now();
          updateTimerUI();
        } else {
          resumeStudyAfterReminder = false;
        }

        if (!els.studyReminderToast || els.studyReminderToast.classList.contains('hidden')) return;
        els.studyReminderToast.classList.remove('reminder-overlay-in');
        els.studyReminderToast.classList.add('reminder-overlay-out');
        setTimeout(() => {
          if (els.studyReminderToast) {
            els.studyReminderToast.classList.add('hidden');
            els.studyReminderToast.classList.remove('reminder-overlay-out');
          }
        }, 250);
      }

      /**
       * Resets and optionally starts the study timer interval (with 5m water & 30m break reminders).
       */
      function resetStudyTimer(autoStart = true) {
        if (state.timerIntervalId) {
          clearInterval(state.timerIntervalId);
          state.timerIntervalId = null;
        }
        state.elapsedSeconds = 0;
        state.lastWaterReminderMinute = 0;
        state.lastWalkReminderMinute = 0;
        state.timerRunning = Boolean(autoStart);
        state.lastTickAt = Date.now();
        updateTimerUI();

        state.timerIntervalId = setInterval(() => {
          if (!state.timerRunning || state.step !== 3) {
            state.lastTickAt = Date.now();
            return;
          }
          const now = Date.now();
          const prev = state.lastTickAt || now;
          const deltaSec = Math.max(1, Math.floor((now - prev) / 1000));
          state.lastTickAt = now;
          state.elapsedSeconds = (state.elapsedSeconds || 0) + deltaSec;
          updateTimerUI();

          const elapsedMinutes = Math.floor(state.elapsedSeconds / 60);
          if (
            elapsedMinutes > 0 &&
            elapsedMinutes % 30 === 0 &&
            elapsedMinutes !== state.lastWalkReminderMinute
          ) {
            state.lastWalkReminderMinute = elapsedMinutes;
            state.lastWaterReminderMinute = elapsedMinutes;
            triggerBreakReminder();
          } else if (
            elapsedMinutes > 0 &&
            elapsedMinutes % 5 === 0 &&
            elapsedMinutes !== state.lastWaterReminderMinute
          ) {
            state.lastWaterReminderMinute = elapsedMinutes;
            triggerWaterReminder();
          }
        }, 1000);
      }

      /**
       * Updates saved textbook progress metadata & cover thumbnail in memory and localStorage.
       */
      function upsertTextbookRecord(customRecord = null, skipHomeRender = false) {
        if (!Array.isArray(state.textbooks)) {
          state.textbooks = [];
        }

        if (customRecord && customRecord.id) {
          const idx = state.textbooks.findIndex((b) => b.id === customRecord.id);
          const existing = idx >= 0 ? state.textbooks[idx] : null;
          const merged = {
            ...(existing || {}),
            ...customRecord,
            coverDataUrl:
              customRecord.coverDataUrl ||
              (existing && existing.coverDataUrl) ||
              (state.coverCacheByKey && state.coverCacheByKey[customRecord.id]) ||
              null,
          };
          if (idx >= 0) {
            state.textbooks[idx] = merged;
          } else {
            state.textbooks.unshift(merged);
          }
          saveTextbooksToStorage();
          if (!skipHomeRender) renderHomeTextbooks();
          return;
        }

        if (!state.pdfDoc || !state.fileName) return;

        const bookId = state.activeTextbookId || `${state.filePath || state.fileName}::${state.totalPages || 0}`;
        state.activeTextbookId = bookId;

        const existingIdx = state.textbooks.findIndex((b) => b.id === bookId);
        const existing = existingIdx >= 0 ? state.textbooks[existingIdx] : null;
        const startPage = state.rangeStart || (existing && existing.startPage) || 1;
        const currentPage = state.currentPage || startPage;
        const studiedPages = Math.max(
          existing ? existing.studiedPages || 0 : 0,
          Math.max(0, currentPage - startPage + 1)
        );

        const updatedRecord = {
          id: bookId,
          title: state.fileName,
          filePath: state.filePath || state.fileName,
          totalPages: state.totalPages || (existing && existing.totalPages) || 0,
          startPage,
          pagesToStudy:
            (els.pagesToStudyInput && parseInt(els.pagesToStudyInput.value, 10)) ||
            (existing && existing.pagesToStudy) ||
            5,
          lastReadPage: currentPage,
          studiedPages,
          elapsedSeconds: Math.max(existing ? existing.elapsedSeconds || 0 : 0, state.elapsedSeconds || 0),
          coverDataUrl:
            (existing && existing.coverDataUrl) ||
            (state.coverCacheByKey && state.coverCacheByKey[bookId]) ||
            null,
          updatedAt: Date.now(),
        };

        if (existingIdx >= 0) {
          state.textbooks[existingIdx] = { ...existing, ...updatedRecord };
        } else {
          state.textbooks.unshift(updatedRecord);
        }

        saveTextbooksToStorage();
        if (!skipHomeRender) {
          renderHomeTextbooks();
        }
      }

      /**
       * Opens a saved textbook from memory or IndexedDB immediately into fullscreen,
       * or prompts file re-selection with saved page range if not cached locally.
       */
      async function openSavedTextbook(book) {
        if (!book) return;
        hideStatus();
        enterAppFullscreen();

        const typedStart = els.startPageInput ? parseInt(String(els.startPageInput.value).trim(), 10) : NaN;
        const typedCount = els.pagesToStudyInput ? parseInt(String(els.pagesToStudyInput.value).trim(), 10) : NaN;

        const defaultStart = Math.max(1, parseInt(book.lastReadPage || book.startPage || 1, 10) || 1);
        const defaultCount = Math.max(1, parseInt(book.pagesToStudy || 5, 10) || 5);

        const chosenStart =
          state.userCustomStart && Number.isFinite(typedStart) && typedStart >= 1
            ? typedStart
            : defaultStart;
        const chosenCount =
          state.userCustomCount && Number.isFinite(typedCount) && typedCount >= 1
            ? typedCount
            : defaultCount;

        if (els.startPageInput) els.startPageInput.value = String(chosenStart);
        if (els.pagesToStudyInput) els.pagesToStudyInput.value = String(chosenCount);

        let cachedSource = state.pdfSourcesByKey && state.pdfSourcesByKey[book.id];
        if (!cachedSource) {
          cachedSource = await getPdfBinaryFromIDB(book.id);
          if (cachedSource) {
            state.pdfSourcesByKey[book.id] = cachedSource;
          }
        }

        if (cachedSource) {
          loadPdfData(cachedSource, book.title || 'Textbook.pdf', {
            filePath: book.filePath || book.title,
            startPageOverride: chosenStart,
            pagesToStudyOverride: chosenCount,
          });
          return;
        }

        state.pendingResumeBook = {
          id: book.id,
          title: book.title,
          resumePage: chosenStart,
          pagesToStudy: chosenCount,
        };

        if (els.fileInput) {
          try {
            els.fileInput.click();
          } catch (_) {
            // Ignore blocked programmatic click on restricted WebViews
          }
        }
        showStatus(`Select "${book.title || 'your PDF'}" to resume at page ${chosenStart} (${chosenCount} pages).`);
      }

      /**
       * Shows the study session completion dialog when reaching the final planned page.
       */
      function showSessionCompleteModal() {
        if (!els.sessionCompleteModal) return;
        const studiedCount = Math.max(1, (state.rangeEnd || 1) - (state.rangeStart || 1) + 1);
        if (els.sessionCompleteTitle) {
          els.sessionCompleteTitle.textContent = `${studiedCount} ${studiedCount === 1 ? 'Page' : 'Pages'} Completed`;
        }
        if (els.sessionCompleteText) {
          els.sessionCompleteText.textContent = `You finished pages ${state.rangeStart}–${state.rangeEnd} in ${formatDuration(state.elapsedSeconds || 0)}.`;
        }
        els.sessionCompleteModal.classList.remove('hidden');
      }

       * Hides the study session completion dialog.
       */
      function hideSessionCompleteModal() {
        if (!els.sessionCompleteModal) return;
        els.sessionCompleteModal.classList.add('hidden');
      }

      /**
       * Continues studying the next consecutive batch of pages right after the current range.
       */
      function startNextStudyBatch() {
        hideSessionCompleteModal();
        if (!state.pdfDoc) return;

        const batchSize = Math.max(
          1,
          (els.pagesToStudyInput && parseInt(els.pagesToStudyInput.value, 10)) ||
            Math.max(1, (state.rangeEnd || 1) - (state.rangeStart || 1) + 1)
        );
        const total = state.totalPages || 1;
        if ((state.rangeEnd || 1) >= total) {
          returnToHomeScreen();
          return;
        }

        const nextStart = Math.min(total, (state.rangeEnd || 1) + 1);
        const nextEnd = Math.min(total, nextStart + batchSize - 1);

        state.rangeStart = nextStart;
        state.rangeEnd = nextEnd;
        state.pageSets = buildFivePageSets(nextStart, nextEnd);
        state.completedSets = {};
        state.visitedPages = {};
        state.congratulatedSets = {};
        state.activeSetIndex = 0;

        if (els.startPageInput) els.startPageInput.value = String(nextStart);
        if (els.pagesToStudyInput) els.pagesToStudyInput.value = String(batchSize);

        renderTopSetsStrip();
        renderDrawerSetCards();
        renderPage(nextStart);
      }

      /**
       * Marks the active page as visited and checks if its 5-page study set has been completed.
       */
      function checkSetCompletion(pageNum) {
        if (!state.visitedPages) state.visitedPages = {};
        state.visitedPages[pageNum] = true;

        const setIdx = findSetIndexForPage(pageNum);
        if (setIdx === -1) return;

        state.activeSetIndex = setIdx;
        const setObj = state.pageSets[setIdx];
        if (!setObj) return;

        const allVisited = setObj.pages.every((p) => Boolean(state.visitedPages[p]));
        if (allVisited && !(state.completedSets && state.completedSets[setIdx])) {
          if (!state.completedSets) state.completedSets = {};
          state.completedSets[setIdx] = true;
          renderTopSetsStrip();
          renderDrawerSetCards();
          celebrateFivePageCompletion(setIdx, setObj);
        }
      }
