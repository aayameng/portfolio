#defs .ex{padding:10px 14px;border-radius:12px;background:rgba(255,223,134,.07);border:1px dashed rgba(255,223,134,.4)}
#defs .fig{margin:14px auto;max-width:650px;padding:8px;border:1px solid rgba(225,241,210,.17);border-radius:15px;background:linear-gradient(145deg,rgba(17,48,39,.78),rgba(5,18,14,.88));box-shadow:0 12px 30px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.06)}
#defs .fig svg{width:100%;height:auto;display:block;border:1px solid rgba(225,241,210,.13);border-radius:10px;overflow:hidden;shape-rendering:geometricPrecision;text-rendering:geometricPrecision}
#defs .fig figcaption{margin:8px 4px 2px;color:#c3d9c2;font-size:12px;line-height:1.55;font-weight:500;text-align:center}
#defs .fig text{font-family:Inter,"SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;font-weight:650;font-style:normal;letter-spacing:.12px;text-rendering:geometricPrecision;paint-order:stroke fill;stroke:rgba(4,17,13,.42);stroke-width:.65px;stroke-linejoin:round}
#defs .alt{display:block;margin:14px auto 0;border:1px solid rgba(224,239,214,.34);border-radius:999px;background:linear-gradient(180deg,rgba(159,233,168,.15),rgba(255,255,255,.06));color:#e9f1de;padding:9px 18px;font:750 10px system-ui;letter-spacing:.13em;text-transform:uppercase;cursor:pointer;box-shadow:0 5px 15px rgba(0,0,0,.18)}
#defs .fig.f3{max-width:700px}#defs .f3 canvas{width:100%;height:auto;aspect-ratio:8/5;display:block;border:1px solid rgba(225,241,210,.2);border-radius:11px;touch-action:pan-y;cursor:grab;background:#1b333b;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}#defs .f3 canvas:active{cursor:grabbing}#defs .f3 figcaption b{color:var(--c)}
@media(max-width:600px){#defs .card{padding:14px 12px}#defs .stp{padding:10px 10px}#defs .stp p,#defs .res p,#defs .ex{font-size:12.5px}#defs .fig{padding:5px;margin:10px auto}#defs .fig figcaption{font-size:11px}#defs .mjx-container[display="true"]{font-size:88%}}
#back{position:fixed;z-index:10;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));
