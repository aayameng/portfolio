        document.getElementById('btn-exit').addEventListener('click', exitAnimMode);

        window.addEventListener('resize', onWindowResize, false);

        // --- Raycasting ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const tooltip = document.getElementById('tooltip');

        window.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(rootMarkersGroup.children, true);

            if (intersects.length > 0) {
                const r = intersects[0].object.userData.root;
                let text = "";
                if (Math.abs(r.im) < 0.0001) {
                    text = `${r.re.toFixed(2)}`;
                } else {
                    const sign = r.im > 0 ? '+' : '-';
                    text = `${r.re.toFixed(2)} ${sign} ${Math.abs(r.im).toFixed(2)}i`;
                }

                tooltip.innerHTML = `Root: ${text}`;
                tooltip.style.left = `${event.clientX}px`;
                tooltip.style.top = `${event.clientY}px`;
                tooltip.style.opacity = 1;
            } else {
                tooltip.style.opacity = 0;
            }
        });

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        window.resetView = function() {
            camera.position.set(6, 6, 8);
            controls.target.set(0, 0, 0);
            controls.update();
        };

        window.togglePanel = function() {
            const content = document.getElementById('panel-content');
            const btn = document.getElementById('collapse-btn');
            const header = document.querySelector('.panel-header');

            const nowCollapsed = content.classList.toggle('collapsed');
            btn.classList.toggle('collapsed', nowCollapsed);
            header.style.marginBottom = nowCollapsed ? '0px' : '20px';

            btn.setAttribute('aria-expanded', String(!nowCollapsed));
            btn.setAttribute('aria-label', nowCollapsed ? 'Expand panel' : 'Collapse panel');
        };

        // Clicking the header bar or the chevron button toggles the card
        document.querySelector('.panel-header').addEventListener('click', window.togglePanel);

        // Simple Tween engine for camera interpolation during animation
        const TWEEN = {
            tweens: [],
            update: function() {
                const now = Date.now();
                const running = this.tweens;
                this.tweens = [];   // tweens started inside callbacks land here and are kept
                const alive = running.filter(tween => tween.update(now));
                this.tweens = alive.concat(this.tweens);
            },
            Tween: class {
                constructor(object) { this.object = object; this._valuesEnd = {}; this._duration = 1000; this._easingFunction = t=>t; this._onUpdateCallback = null; this._onComplete = null; this._stopped = false; }
                to(properties, duration) { this._valuesEnd = properties; this._duration = duration; return this; }
                easing(fn) { this._easingFunction = fn; return this; }
                onUpdate(callback) { this._onUpdateCallback = callback; return this; }
                onComplete(callback) { this._onComplete = callback; return this; }
                start() {
                    this._stopped = false;
                    this._startTime = Date.now();
                    this._valuesStart = {};
                    for (const property in this._valuesEnd) this._valuesStart[property] = this.object[property];
                    TWEEN.tweens.push(this);
                    return this;
                }
                stop() {
                    this._stopped = true;
                    TWEEN.tweens = TWEEN.tweens.filter(t => t !== this);
                    return this;
                }
                update(time) {
                    if (this._stopped) return false;
                    let elapsed = (time - this._startTime) / this._duration;
                    elapsed = elapsed > 1 ? 1 : elapsed;
                    const value = this._easingFunction(elapsed);
                    for (const property in this._valuesEnd) {
                        const start = this._valuesStart[property];
                        const end = this._valuesEnd[property];
                        this.object[property] = start + (end - start) * value;
                    }
                    if (this._onUpdateCallback) this._onUpdateCallback(this.object, elapsed);
                    if (elapsed >= 1) {
                        const cb = this._onComplete;
                        this._onComplete = null;
                        if (cb) cb();
                        return false;
                    }
                    return true;
                }
            }
        };
        TWEEN.Easing = {
            Quadratic: { Out: function (k) { return k * (2 - k); } },
            Cubic: { InOut: function (k) { return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; } }
        };

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            TWEEN.update();
            controls.update();
            
            const distance = camera.position.distanceTo(controls.target);
            axesManager.update(distance);

            renderer.render(scene, camera);
        }

        window.onload = function() {
            initGraph();
            animate();
        };
    </script>
</body>
</html>
