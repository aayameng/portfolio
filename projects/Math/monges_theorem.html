 C.forEach((c,i)=>{g.beginPath();g.arc(c.x,c.y,c.r,0,7);g.fillStyle=SH[i]+"44";g.fill();g.shadowColor=SH[i];g.shadowBlur=12;g.strokeStyle=SH[i];g.lineWidth=2.5/k;g.stroke();g.shadowBlur=0;g.fillStyle=SH[i];g.beginPath();g.arc(c.x,c.y,5/k,0,7);g.fill();tx(N[i],c.x+9/k,c.y-9/k,14/k,"#fff3c4")});
 g.globalAlpha=sub?1:e;g.strokeStyle="#ffd54a";g.lineWidth=1.8/k;
 PR.forEach(([i,j],n)=>{const a=M.o[i],b=M.o[j],q=M.E[n],da=Math.hypot(a.x-q.x,a.z-q.z),db=Math.hypot(b.x-q.x,b.z-q.z),far=da>db?a:b,df=Math.max(da,db),al=Math.asin(far.r/df),L=Math.sqrt(df*df-far.r*far.r)*1.1,th=Math.atan2(far.z-q.z,far.x-q.x);
  for(const s of[-1,1]){const t=th+s*al;ln(q.x+W/2,q.z+H/2,q.x+W/2+Math.cos(t)*L,q.z+H/2+Math.sin(t)*L)}});
 if(sub&&M.la){const[ax,az,ux,uz]=M.la,L=(W+H)/k*e,X=ax+W/2,Y=az+H/2;g.strokeStyle="#7cffb2";g.lineWidth=3.5/k;g.shadowColor="#7cffb2";g.shadowBlur=14;ln(X-ux*L,Y-uz*L,X+ux*L,Y+uz*L);g.shadowBlur=0}
 M.E.forEach((q,n)=>{const x=q.x+W/2,y=q.z+H/2;g.fillStyle="#7cffb2";g.shadowColor="#7cffb2";g.shadowBlur=10;g.beginPath();g.arc(x,y,6.5/k,0,7);g.fill();g.shadowBlur=0;tx("E("+N[PR[n][0]]+N[PR[n][1]]+")",x+9/k,y-9/k,13/k,"#cfe")});
 g.globalAlpha=1}
function go(q){qi=q;[si,sub]=M.q[q];const i=si;t0=performance.now();V2=v2();RN.domElement.classList.toggle("on",i>=0);if(i<0)goal=cur;else{if(i==0&&!sub)cur=st3();goal=shot(i,sub);goal.az=cur.az+Math.atan2(Math.sin(goal.az-cur.az),Math.cos(goal.az-cur.az))}
 $("cap").textContent=si<0?CAP2[sub]:sub?`Cone touches sphere ${N[PR[i-1][sub-1]]} along a circle.`:!M.lid&&(i==5||i==6)?["No flat lid fits these circles.","Algebra still puts all E on one line."][i-5]:CAP[i];
 $("pg").style.setProperty("--w",(q+1)/M.q.length*100+"%");$("nx").innerHTML=q==M.q.length-1?"REPLAY "+IC.rp:"NEXT "+IC.nx}

function draw3(ts,dt){
 const p=Math.max(0,Math.min(1,(ts-t0)/1300)),e=1-Math.pow(1-p,3),k=1-Math.exp(-dt*2.6),{o,s}=M;
 for(const q of["x","y","z","az","el"])cur[q]+=(goal[q]-cur[q])*k;cur.d=Math.exp(Math.log(cur.d)+(Math.log(goal.d)-Math.log(cur.d))*k);
 M.sp.forEach((m,i)=>{const sy=si?1:Math.max(.02,e);m.scale.set(o[i].r,o[i].r*sy,o[i].r);M.lb[i].position.set(o[i].x,o[i].r*sy+s*.14,o[i].z)});
 M.pg.forEach((q,i)=>{q.visible=si>=i+1;q.scale.setScalar(si==i+1&&!sub?Math.max(.001,e):1);M.dt[i].scale.setScalar(si==4||si==6?1+.5*Math.abs(Math.sin(ts/260)):1)});
 if(M.lid){const f=si==5?e:1;M.lid.visible=si>=5;M.lid.position.copy(M.n).multiplyScalar((1-f)*s*1.5);M.lm.opacity=.16*f}
 if(M.ln){M.ln.visible=si>=5;M.ln.scale.set(si==5?Math.max(.001,e):1,si==7?3:1,si==7?3:1)}
 CA.position.set(cur.x+cur.d*Math.cos(cur.el)*Math.sin(cur.az),cur.y+cur.d*Math.sin(cur.el),cur.z+cur.d*Math.cos(cur.el)*Math.cos(cur.az));
 CA.lookAt(cur.x,cur.y,cur.z);RN.render(T,CA)}

function frame(ts){
 if(run){const dt=Math.min(.1,(ts-lt)/1000);lt=ts;if(auto&&qi<M.q.length-1&&ts-t0>5000)go(qi+1);si<0?draw2p(ts):draw3(ts,dt)}else{draw2();lt=ts}
 requestAnimationFrame(frame)}

/* ---------- 2D input ---------- */
cv.onpointerdown=e=>{if(run)return;
 const x=e.clientX,y=e.clientY;cv.setPointerCapture(e.pointerId);
 for(let i=C.length-1;i>=0;i--){const c=C[i];
  if(Math.hypot(x-c.x,y-c.y)<24){drag={m:"mv",c,dx:c.x-x,dy:c.y-y};return}}
 if(C.length==3){const c=C.find(c=>Math.abs(Math.hypot(x-c.x,y-c.y)-c.r)<16);
  if(c)drag={m:"rs",c};else msg("MAX 3 CIRCLES · UNDO OR CLEAR FIRST");return}
 drag={m:"new",x,y,r:0}};
cv.onpointermove=e=>{if(!drag)return;const x=e.clientX,y=e.clientY;
 if(drag.m=="mv"){const n={x:x+drag.dx,y:y+drag.dy,r:drag.c.r};if(bad(n,drag.c))blk();else{drag.c.x=n.x;drag.c.y=n.y}}
 else if(drag.m=="rs"){const n={x:drag.c.x,y:drag.c.y,r:Math.max(10,Math.hypot(x-drag.c.x,y-drag.c.y))};if(bad(n,drag.c))blk();else drag.c.r=n.r}
 else drag.r=Math.hypot(x-drag.x,y-drag.y)};
cv.onpointerup=cv.onpointercancel=()=>{
 if(drag&&drag.m=="new"&&drag.r>=12){const n={x:drag.x,y:drag.y,r:drag.r};if(bad(n))msg("CIRCLES CAN’T OVERLAP · KEEP THEM APART");else{C.push(n);sync()}}
 drag=null};
$("undo").onclick=()=>{C.pop();sync()};
$("reset").onclick=()=>{C=[];sync()};
$("fold").onclick=()=>P.classList.toggle("c");
$("rand").onclick=()=>{
 const top=P.getBoundingClientRect().top,m=Math.min(W,top-70),cy=(70+top)/2,a=Math.random()*6.3;
 C=[0,1,2].map(i=>{const t=a+i*2.1;return{x:W/2+Math.cos(t)*m*.27,y:cy+Math.sin(t)*m*.27,r:m*(.09+.06*i)+Math.random()*8}});sync()};

/* ---------- proof controls ---------- */
$("prove").onclick=()=>{
 if(C.length<3){msg(`DRAW ${3-C.length} MORE CIRCLE${C.length==2?"":"S"} FIRST`);return}
 if(calc().eq){msg("TWO RADII ARE EQUAL · DRAG A RIM TO RESIZE");return}
 try{if(!RN)initGL()}catch(err){msg("3D IS UNAVAILABLE ON THIS DEVICE");return}
 build();cur=td();run=1;document.body.classList.add("run");$("mini").hidden=false;go(0)};
$("x").onclick=()=>{run=0;document.body.classList.remove("run");$("mini").hidden=true;RN.domElement.classList.remove("on")};
$("pv").onclick=()=>go(Math.max(0,qi-1));
$("nx").onclick=()=>{if(qi==M.q.length-1){cur=td();go(0)}else go(qi+1)};
$("pl").onclick=()=>{auto=!auto;$("pl").innerHTML=auto?IC.pa:IC.pl};
Object.entries({pv:IC.pv+" PREV",pl:IC.pa,nx:"NEXT "+IC.nx,x:IC.x}).forEach(([k,v])=>$(k).innerHTML=v);
sync();requestAnimationFrame(frame);
