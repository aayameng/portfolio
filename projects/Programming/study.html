      /**
       * Renders a given page number onto #pdf-canvas with double-buffered high-DPI scaling.
       */
      async function renderPage(pageNum, options = {}) {
        if (!state.pdfDoc || !els.canvas || !ctx) return;

        const minAllowed = Math.max(1, state.rangeStart || 1);
        const maxAllowed = Math.min(state.totalPages || 1, state.rangeEnd || state.totalPages || 1);
        const targetPage = Math.max(minAllowed, Math.min(maxAllowed, parseInt(pageNum, 10) || minAllowed));

        if (state.rendering) {
          state.pendingPage = targetPage;
          state.pendingZoomRerender = Boolean(options.isZoomRefinement);
          if (state.currentRenderTask && typeof state.currentRenderTask.cancel === 'function') {
            try {
              state.currentRenderTask.cancel();
            } catch (_) {
              // Ignore cancellation error
            }
          }
          return;
        }

        state.rendering = true;
        state.currentPage = targetPage;

        if (!options.isZoomRefinement) {
          setRenderLoading(true);
        }

        try {
          const page = await state.pdfDoc.getPage(targetPage);
          const scale = computeScale(page);
          const viewport = page.getViewport({ scale, rotation: state.rotation || 0 });

          const cssWidth = Math.max(1, Math.round(viewport.width));
          const cssHeight = Math.max(1, Math.round(viewport.height));
          const dpr = getHighQualityRenderMultiplier(cssWidth, cssHeight);

          const renderViewport = page.getViewport({
            scale: scale * dpr,
            rotation: state.rotation || 0,
          });

          const offscreen = document.createElement('canvas');
          offscreen.width = Math.max(1, Math.round(renderViewport.width));
          offscreen.height = Math.max(1, Math.round(renderViewport.height));
          const offCtx = offscreen.getContext('2d', { alpha: false });

          offCtx.fillStyle = '#ffffff';
          offCtx.fillRect(0, 0, offscreen.width, offscreen.height);

          const renderTask = page.render({
            canvasContext: offCtx,
            viewport: renderViewport,
          });
          state.currentRenderTask = renderTask;

          await renderTask.promise;
          state.currentRenderTask = null;

          // Blit crisp rendered buffer onto visible canvas
          els.canvas.width = offscreen.width;
          els.canvas.height = offscreen.height;
          els.canvas.style.width = `${cssWidth}px`;
          els.canvas.style.height = `${cssHeight}px`;
          ctx.drawImage(offscreen, 0, 0);
          state.renderedScale = scale;

          if (!options.isZoomRefinement && els.pageWrapper) {
            els.pageWrapper.scrollTop = 0;
            els.pageWrapper.scrollLeft = 0;
          }

          if (typeof page.cleanup === 'function') {
            page.cleanup();
          }

          // Update page indicators & navigation buttons
          const sessionTotal = Math.max(1, maxAllowed - minAllowed + 1);
          const sessionCurrent = Math.max(1, targetPage - minAllowed + 1);

          if (els.studiedPagesCount) {
            els.studiedPagesCount.textContent = `${sessionCurrent} / ${sessionTotal}`;
          }
          if (els.bottomPageIndicator) {
            els.bottomPageIndicator.textContent = `p. ${targetPage} / ${state.totalPages}`;
          }
          if (els.veryBottomPrevBtn) {
            els.veryBottomPrevBtn.disabled = targetPage <= minAllowed;
          }
          if (els.veryBottomNextBtn) {
            els.veryBottomNextBtn.disabled = false;
            els.veryBottomNextBtn.classList.toggle('text-emerald-600', targetPage >= maxAllowed);
          }

          const newSetIdx = findSetIndexForPage(targetPage);
          if (newSetIdx !== -1 && newSetIdx !== state.activeSetIndex) {
            state.activeSetIndex = newSetIdx;
          }
          renderTopSetsStrip();
          renderDrawerSetCards();
          checkSetCompletion(targetPage);
          upsertTextbookRecord(null, true);
        } catch (err) {
          if (!err || err.name !== 'RenderingCancelledException') {
            console.error('PDF page render error:', err);
            showStatus('Could not render this PDF page. Try zooming or reloading.');
          }
        } finally {
          state.rendering = false;
          state.currentRenderTask = null;
          setRenderLoading(false);

          if (state.pendingPage !== null) {
            const queuedPage = state.pendingPage;
            const queuedZoom = state.pendingZoomRerender;
            state.pendingPage = null;
            state.pendingZoomRerender = false;
            renderPage(queuedPage, { isZoomRefinement: queuedZoom });
          }
        }
      }

      /**
       * Opens a PDFDocumentProxy with automatic fallback from Web Worker to main-thread parsing
       * so sandboxed iframes and strict mobile WebViews always load cleanly.
       */
      async function openPdfWithFallback(arrayBuffer, pdfjs) {
        const rawBytes = new Uint8Array(arrayBuffer);
        if (!looksLikePdfBytes(rawBytes)) {
          throw new Error('The selected file is not a valid PDF document.');
        }

        const preferNoWorker =
          window.origin === 'null' ||
          window.location.protocol === 'file:' ||
          !window.__pdfjsWorkerUrl;

        const createParams = (disableWorker) => ({
          data: rawBytes.slice(),
          disableWorker,
          cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/',
          cMapPacked: true,
          standardFontDataUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/standard_fonts/',
        });

        if (preferNoWorker) {
          return pdfjs.getDocument(createParams(true)).promise;
        }

        try {
          const workerPromise = pdfjs.getDocument(createParams(false)).promise;
          const timeoutPromise = new Promise((_, reject) =>
            setTimeout(() => reject(new Error('Worker timeout')), 4500)
          );
          return await Promise.race([workerPromise, timeoutPromise]);
        } catch (_) {
          return pdfjs.getDocument(createParams(true)).promise;
        }
      }

      /**
       * Loads PDF binary data, initializes study session bounds, generates cover thumbnail,
       * enters fullscreen, and renders the starting page.
       */
      async function loadPdfData(arrayBuffer, fileName = 'Document.pdf', options = {}) {
        hideStatus();
        setUploadLoading(true);

        try {
          const pdfjs = await waitForPdfJs();
          const bufferCopy = arrayBuffer.slice(0);
          const pdfDoc = await openPdfWithFallback(bufferCopy, pdfjs);

          const totalPages = Math.max(1, pdfDoc.numPages || 1);
          const filePath = options.filePath || fileName;
          const bookId = `${filePath}::${totalPages}`;

          state.pdfDoc = pdfDoc;
          state.fileName = fileName;
          state.filePath = filePath;
          state.totalPages = totalPages;
          state.activeTextbookId = bookId;
          state.pdfSourcesByKey[bookId] = bufferCopy;
          state.pdfDocsByKey[bookId] = pdfDoc;
          savePdfBinaryToIDB(bookId, bufferCopy);

          // Resolve starting page & pages to study
          const rawStart =
            options.startPageOverride !== undefined
              ? options.startPageOverride
              : parseInt((els.startPageInput && els.startPageInput.value) || '1', 10);
          const rawCount =
            options.pagesToStudyOverride !== undefined
              ? options.pagesToStudyOverride
              : parseInt((els.pagesToStudyInput && els.pagesToStudyInput.value) || '5', 10);

          const startPage = Math.max(1, Math.min(totalPages, Number.isFinite(rawStart) ? rawStart : 1));
          const count = Math.max(1, Number.isFinite(rawCount) ? rawCount : 5);
          const endPage = Math.min(totalPages, startPage + count - 1);

          if (els.startPageInput) els.startPageInput.value = String(startPage);
          if (els.pagesToStudyInput) els.pagesToStudyInput.value = String(count);

          state.rangeStart = startPage;
          state.rangeEnd = endPage;
          state.currentPage = startPage;
          state.zoom = 1.0;
          state.fitFullPage = true;
          state.fitToWidth = false;
          state.rotation = 0;
          state.pageSets = buildFivePageSets(startPage, endPage);
          state.completedSets = {};
          state.visitedPages = {};
          state.congratulatedSets = {};
          state.activeSetIndex = 0;
          state.step = 3;

          if (els.drawerDocName) els.drawerDocName.textContent = fileName;

          // Generate cover thumbnail in background if missing
          generateCoverThumbnail(pdfDoc, bookId).then((coverDataUrl) => {
            if (coverDataUrl) {
              upsertTextbookRecord({ id: bookId, coverDataUrl }, true);
            }
          });

          // Transition views
          if (els.dropzoneView) els.dropzoneView.classList.add('hidden');
          if (els.canvasView) els.canvasView.classList.remove('hidden');

          // Enter fullscreen so browser tabs and chrome stay hidden during study
          state.pendingFullscreenOnGesture = true;
          enterAppFullscreen();

          updateZoomUI();
          renderTopSetsStrip();
          renderDrawerSetCards();
          resetStudyTimer(true);
          upsertTextbookRecord(null, true);

          // Wait one animation frame so #page-wrapper has true laid-out dimensions
          await new Promise((resolve) => requestAnimationFrame(resolve));
          await renderPage(startPage);
        } catch (err) {
          console.error('Failed to open PDF:', err);
          showStatus((err && err.message) || 'Unable to open this PDF file.');
        } finally {
          setUploadLoading(false);
        }
      }

      /**
       * Handles a user-uploaded or dropped File object.
       */
      async function handleFileSelection(file) {
        if (!file) return;
        hideStatus();

        const name = file.name || 'Document.pdf';
        const mime = (file.type || '').toLowerCase();
        const isLikelyPdf =
          name.toLowerCase().endsWith('.pdf') ||
          mime === 'application/pdf' ||
          mime === 'application/x-pdf' ||
          mime === '' ||
          mime === 'application/octet-stream';

        if (!isLikelyPdf) {
          showStatus('Please choose a valid PDF (.pdf) file.');
          if (els.fileInput) els.fileInput.value = '';
          return;
        }

        setUploadLoading(true);
        try {
          const buffer = await readFileAsArrayBuffer(file);
          const pending = state.pendingResumeBook;
          state.pendingResumeBook = null;

          await loadPdfData(buffer, name, {
            filePath: file.webkitRelativePath || name,
            startPageOverride: pending ? pending.resumePage : undefined,
            pagesToStudyOverride: pending ? pending.pagesToStudy : undefined,
          });
        } catch (err) {
          setUploadLoading(false);
          console.error('Error reading uploaded file:', err);
          showStatus((err && err.message) || 'Could not read the selected PDF file.');
        } finally {
          if (els.fileInput) {
            try {
              els.fileInput.value = '';
            } catch (_) {
              // Ignore read-only input value in older WebViews
            }
          }
        }
      }

      /**
       * Returns from the PDF reading stage back to the home upload screen (saving progress).
       */
      function returnToHomeScreen() {
        hideSessionCompleteModal();
        hideFivePageCelebration();
        hideStudyReminder();
        closePageSetsDrawer();
        upsertTextbookRecord(null, true);

        if (state.timerIntervalId) {
          clearInterval(state.timerIntervalId);
          state.timerIntervalId = null;
        }
        state.timerRunning = false;
        state.step = 1;
        state.userCustomStart = false;
        state.userCustomCount = false;

        exitAppFullscreen();

        if (els.canvasView) els.canvasView.classList.add('hidden');
        if (els.dropzoneView) els.dropzoneView.classList.remove('hidden');
        updateReaderTopButtonsUI();

        renderHomeTextbooks();
      }

      /**
       * Binds all interactive UI, keyboard, wheel, touch pinch, and drag-and-drop listeners.
       */
      function bindEventListeners() {
        // 1. Native File Input Upload
        if (els.fileInput) {
          els.fileInput.addEventListener('change', (e) => {
            const files = e.target && e.target.files;
            const selected = files && files[0];
            if (selected) {
              handleFileSelection(selected);
            }
          });
        }

        // Keyboard activation on upload icon box
        if (els.uploadIconBox) {
          els.uploadIconBox.addEventListener('keydown', (e) => {
            if ((e.key === 'Enter' || e.key === ' ') && els.fileInput) {
              e.preventDefault();
              els.fileInput.click();
            }
          });
        }

        // 2. Drag & Drop PDF onto Dropzone Card
        if (els.dropzoneCard) {
          ['dragenter', 'dragover'].forEach((evtName) => {
            els.dropzoneCard.addEventListener(evtName, (e) => {
              e.preventDefault();
              e.stopPropagation();
              els.dropzoneCard.classList.add('border-indigo-500', 'bg-indigo-50/40');
            });
          });

          ['dragleave', 'drop'].forEach((evtName) => {
            els.dropzoneCard.addEventListener(evtName, (e) => {
              e.preventDefault();
              e.stopPropagation();
              els.dropzoneCard.classList.remove('border-indigo-500', 'bg-indigo-50/40');
            });
          });

          els.dropzoneCard.addEventListener('drop', (e) => {
            const files = e.dataTransfer && e.dataTransfer.files;
            const dropped = files && files[0];
            if (dropped) {
              handleFileSelection(dropped);
            }
          });
        }

        // 3. Top-Left Study Sets Drawer & Top-Right Fullscreen & Back buttons
        if (els.openSetsDrawerBtn) {
          els.openSetsDrawerBtn.addEventListener('click', () => {
            if (state.rangeSetsDrawerOpen) {
              closePageSetsDrawer();
            } else {
              openPageSetsDrawer();
            }
          });
        }

        if (els.topRightFullscreenBtn) {
          els.topRightFullscreenBtn.addEventListener('click', () => {
            if (isDocumentFullscreen()) {
              exitAppFullscreen();
            } else {
              enterAppFullscreen();
            }
          });
        }

        if (els.topRightBackBtn) {
          els.topRightBackBtn.addEventListener('click', () => {
            if (state.step === 3) {
              returnToHomeScreen();
            } else if (window.history.length > 1) {
              window.history.back();
            }
          });
        }

        // Session range input tracking & normalization
        if (els.startPageInput) {
          els.startPageInput.addEventListener('input', () => {
            state.userCustomStart = true;
          });
          els.startPageInput.addEventListener('change', () => {
            const val = parseInt(els.startPageInput.value, 10);
            if (!Number.isFinite(val) || val < 1) {
              els.startPageInput.value = '1';
            }
          });
        }

        if (els.pagesToStudyInput) {
          els.pagesToStudyInput.addEventListener('input', () => {
            state.userCustomCount = true;
          });
          els.pagesToStudyInput.addEventListener('change', () => {
            const val = parseInt(els.pagesToStudyInput.value, 10);
            if (!Number.isFinite(val) || val < 1) {
              els.pagesToStudyInput.value = '1';
            }
          });
        }

        // 4. Bottom Navigation & Zoom Controls
        if (els.veryBottomPrevBtn) {
          els.veryBottomPrevBtn.addEventListener('click', () => {
            const minPage = Math.max(1, state.rangeStart || 1);
            if (state.currentPage > minPage) {
              renderPage(state.currentPage - 1);
            }
          });
        }

        if (els.veryBottomNextBtn) {
          els.veryBottomNextBtn.addEventListener('click', () => {
            const maxPage = Math.min(state.totalPages || 1, state.rangeEnd || state.totalPages || 1);
            if (state.currentPage < maxPage) {
              renderPage(state.currentPage + 1);
            } else {
              showSessionCompleteModal();
            }
          });
        }

        if (els.bottomZoomOutBtn) {
          els.bottomZoomOutBtn.addEventListener('click', () => {
            const current = state.fitFullPage ? 1.0 : (state.zoom || 1.0);
            setZoomLevel(current - 0.25);
          });
        }

        if (els.bottomZoomInBtn) {
          els.bottomZoomInBtn.addEventListener('click', () => {
            const current = state.fitFullPage ? 1.0 : (state.zoom || 1.0);
            setZoomLevel(current + 0.25);
          });
        }

        if (els.bottomZoomResetBtn) {
          els.bottomZoomResetBtn.addEventListener('click', () => {
            setZoomLevel(1.0, { fit: true });
          });
        }

        // Timer & Drawer & Modals
        if (els.minimalPageTimer) {
          els.minimalPageTimer.addEventListener('click', toggleStudyTimer);
        }
        if (els.timerToggleBtn) {
          els.timerToggleBtn.addEventListener('click', toggleStudyTimer);
        }
        if (els.timerResetBtn) {
          els.timerResetBtn.addEventListener('click', () => resetStudyTimer(true));
        }
        if (els.drawerRotateBtn) {
          els.drawerRotateBtn.addEventListener('click', () => {
            state.rotation = ((state.rotation || 0) + 90) % 360;
            renderPage(state.currentPage);
          });
        }
        if (els.closeSetsDrawerBtn) {
          els.closeSetsDrawerBtn.addEventListener('click', closePageSetsDrawer);
        }
        if (els.pageSetsBackdrop) {
          els.pageSetsBackdrop.addEventListener('click', closePageSetsDrawer);
        }
        if (els.dismissStatusBtn) {
          els.dismissStatusBtn.addEventListener('click', hideStatus);
        }
        if (els.dismissReminderBtn) {
          els.dismissReminderBtn.addEventListener('click', hideStudyReminder);
        }
        if (els.studyNextBatchBtn) {
          els.studyNextBatchBtn.addEventListener('click', startNextStudyBatch);
        }
        if (els.finishSessionHomeBtn) {
          els.finishSessionHomeBtn.addEventListener('click', returnToHomeScreen);
        }
        if (els.stayOnPageBtn) {
          els.stayOnPageBtn.addEventListener('click', hideSessionCompleteModal);
        }

        // 5. Desktop Ctrl/Cmd + Wheel Zoom & Click-and-Drag Panning (No horizontal swipe page-turning)
        if (els.pageWrapper) {
          els.pageWrapper.addEventListener(
            'wheel',
            (e) => {
              if (state.step !== 3 || !state.pdfDoc) return;
              if (e.ctrlKey || e.metaKey) {
                e.preventDefault();
                const rect = els.pageWrapper.getBoundingClientRect();
                const focalX = e.clientX - rect.left;
                const focalY = e.clientY - rect.top;
                const current = state.fitFullPage ? 1.0 : (state.zoom || 1.0);
                const factor = e.deltaY < 0 ? 1.12 : 0.89;
                setZoomLevel(current * factor, { focalX, focalY });
              }
            },
            { passive: false }
          );

          // Desktop click-and-drag panning when zoomed in
          let isDragging = false;
          let dragStartX = 0;
          let dragStartY = 0;
          let scrollStartX = 0;
          let scrollStartY = 0;

          els.pageWrapper.addEventListener('mousedown', (e) => {
            if (e.button !== 0 || state.fitFullPage) return;
            isDragging = true;
            dragStartX = e.clientX;
            dragStartY = e.clientY;
            scrollStartX = els.pageWrapper.scrollLeft;
            scrollStartY = els.pageWrapper.scrollTop;
            els.pageWrapper.classList.add('cursor-grabbing');
          });

          window.addEventListener('mousemove', (e) => {
            if (!isDragging || !els.pageWrapper) return;
            const dx = e.clientX - dragStartX;
            const dy = e.clientY - dragStartY;
            els.pageWrapper.scrollLeft = scrollStartX - dx;
            els.pageWrapper.scrollTop = scrollStartY - dy;
          });

          window.addEventListener('mouseup', () => {
            if (!isDragging) return;
            isDragging = false;
            if (els.pageWrapper) {
              els.pageWrapper.classList.remove('cursor-grabbing');
            }
          });

          // 6. Two-finger Touch Pinch-to-Zoom (Single-finger touch scrolls horizontally & vertically; never turns pages)
          let pinchStartDist = 0;
          let pinchStartZoom = 1.0;

          const getTouchDistance = (t1, t2) =>
            Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);

          els.pageWrapper.addEventListener(
            'touchstart',
            (e) => {
              if (e.touches.length === 2) {
                pinchStartDist = getTouchDistance(e.touches[0], e.touches[1]);
                pinchStartZoom = state.fitFullPage ? 1.0 : (state.zoom || 1.0);
              }
            },
            { passive: true }
          );

          els.pageWrapper.addEventListener(
            'touchmove',
            (e) => {
              if (e.touches.length === 2 && pinchStartDist > 0) {
                e.preventDefault();
                const dist = getTouchDistance(e.touches[0], e.touches[1]);
                const ratio = dist / pinchStartDist;
                const rect = els.pageWrapper.getBoundingClientRect();
                const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
                const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
                setZoomLevel(pinchStartZoom * ratio, { focalX: midX, focalY: midY });
              }
            },
            { passive: false }
          );

          els.pageWrapper.addEventListener(
            'touchend',
            (e) => {
              if (e.touches.length < 2) {
                pinchStartDist = 0;
              }
            },
            { passive: true }
          );
        }

        // 7. Keyboard Navigation & Zoom Shortcuts
        document.addEventListener('keydown', (e) => {
          if (state.step !== 3) return;
          const tag = (e.target && e.target.tagName) || '';
          if (tag === 'INPUT' || tag === 'TEXTAREA') return;

          const minPage = Math.max(1, state.rangeStart || 1);
          const maxPage = Math.min(state.totalPages || 1, state.rangeEnd || state.totalPages || 1);

          if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
            if (state.fitFullPage && state.currentPage > minPage) {
              e.preventDefault();
              renderPage(state.currentPage - 1);
            }
          } else if (e.key === 'ArrowRight' || e.key === 'PageDown') {
            if (state.fitFullPage) {
              e.preventDefault();
              if (state.currentPage < maxPage) {
                renderPage(state.currentPage + 1);
              } else {
                showSessionCompleteModal();
              }
            }
          } else if (e.key === '+' || e.key === '=') {
            e.preventDefault();
            const current = state.fitFullPage ? 1.0 : (state.zoom || 1.0);
            setZoomLevel(current + 0.25);
          } else if (e.key === '-' || e.key === '_') {
            e.preventDefault();
            const current = state.fitFullPage ? 1.0 : (state.zoom || 1.0);
            setZoomLevel(current - 0.25);
          } else if (e.key === '0') {
            e.preventDefault();
            setZoomLevel(1.0, { fit: true });
          }
        });

        // 8. Responsive window resize & fullscreen change re-fit
        let resizeTimer = null;
        const scheduleReaderRefit = () => {
          updateReaderTopButtonsUI();
          if (state.step !== 3 || !state.pdfDoc) return;
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(() => {
            renderPage(state.currentPage, { isZoomRefinement: true });
          }, 150);
        };

        window.addEventListener('resize', scheduleReaderRefit);
        document.addEventListener('fullscreenchange', scheduleReaderRefit);
        document.addEventListener('webkitfullscreenchange', scheduleReaderRefit);

        // If an OS file picker consumed the initial gesture, enter fullscreen on first reader tap/touch/key
        const fulfillPendingFullscreen = () => {
          if (state.pendingFullscreenOnGesture && state.step === 3 && !isDocumentFullscreen()) {
            enterAppFullscreen();
          }
        };
        document.addEventListener('pointerdown', fulfillPendingFullscreen, { capture: true, passive: true });
        document.addEventListener('touchend', fulfillPendingFullscreen, { capture: true, passive: true });
        document.addEventListener('keydown', fulfillPendingFullscreen, { capture: true });
      }

      // Initialize application
      state.textbooks = loadSavedTextbooksFromStorage();
      renderHomeTextbooks();
      updateReaderTopButtonsUI();
      bindEventListeners();
    })();
  </script>
</body>
</html>
